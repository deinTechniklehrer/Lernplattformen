<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Smart-Home-Challenges – Lernplattform</title>
<script defer src="../assets/jspdf.umd.min.js"></script>
<link rel="stylesheet" href="../assets/fonts/fonts.css">
<style>
:root{
  --blue:#035591; --blue-d:#023a63; --yellow:#F5B700; --yellow-soft:#fff3c9;
  --ink:#14232f; --muted:#56687a; --paper:#eef3f7; --card:#ffffff; --line:#d3dde6;
  --accent:#035591; --accent-ink:#ffffff; --link:#035591;
  --ok:#17803f; --ok-bg:#e2f4e8; --bad:#c23b2e; --bad-bg:#fce8e5; --miss:#b7791f; --miss-bg:#fff3d6;
  --stripe:rgba(3,85,145,.10);
  --f-head:'Barlow Condensed','Arial Narrow',Arial,sans-serif;
  --f-body:'Source Sans 3','Segoe UI',Helvetica,Arial,sans-serif;
  --pc0:#d9480f; --pc1:#1971c2; --pc2:#2b8a3e; --pc3:#9c36b5; --pc4:#c2255c; --pc5:#5c7c00;
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
}
:root:not([data-theme="light"]){}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#0d1922; --card:#152531; --ink:#e9f0f6; --muted:#9db1c1; --line:#2a4051;
    --accent:#3a8fd6; --accent-ink:#04121d; --link:#7fbdf0;
    --ok:#4cc37c; --ok-bg:#12321f; --bad:#ff8074; --bad-bg:#3a1a17; --miss:#f0b95a; --miss-bg:#3a2d10;
    --yellow-soft:#3a3010; --stripe:rgba(127,189,240,.10);
    --pc0:#ff9a5c; --pc1:#74b7ff; --pc2:#6fd68a; --pc3:#d59bf0; --pc4:#ff8fb5; --pc5:#b7d84a;
  }
}
:root[data-theme="dark"]{
  --paper:#0d1922; --card:#152531; --ink:#e9f0f6; --muted:#9db1c1; --line:#2a4051;
  --accent:#3a8fd6; --accent-ink:#04121d; --link:#7fbdf0;
  --ok:#4cc37c; --ok-bg:#12321f; --bad:#ff8074; --bad-bg:#3a1a17; --miss:#f0b95a; --miss-bg:#3a2d10;
  --yellow-soft:#3a3010; --stripe:rgba(127,189,240,.10);
  --pc0:#ff9a5c; --pc1:#74b7ff; --pc2:#6fd68a; --pc3:#d59bf0; --pc4:#ff8fb5; --pc5:#b7d84a;
}
*{box-sizing:border-box}
html{height:100%;scroll-padding-top:calc(var(--safe-t) + 70px)}
body{margin:0;min-height:100%;background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.55;padding-top:var(--safe-t);padding-bottom:var(--safe-b);-webkit-text-size-adjust:100%}
h1,h2,h3{font-family:var(--f-head);font-weight:700;line-height:1.1;margin:0;letter-spacing:.01em}
h1{font-size:clamp(2.4rem,6vw,3.6rem)} h2{font-size:clamp(1.9rem,4vw,2.5rem)} h3{font-size:1.45rem;font-weight:600}
p{margin:.6em 0} a{color:var(--link)}
button,select,input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--yellow);outline-offset:2px}
.hidden{display:none!important}
.task .lesen{border-left:6px solid var(--accent);background:var(--paper);padding:10px 16px;border-radius:0 6px 6px 0;margin:6px 0 14px}
.task .lesen p{margin:.45em 0}
.task .lesen figure,.task .lesen .panels{margin:8px 0}
.marktext{line-height:2.05;margin:.4em 0;word-spacing:.08em}
.marktext .tapp{cursor:pointer;background:var(--paper);border-bottom:2px dashed var(--muted);border-radius:3px;padding:2px 3px;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.marktext .tapp:focus-visible{outline:3px solid var(--accent);outline-offset:1px}
.marktext .tapp.on{background:var(--yellow-soft);border-bottom:2px solid var(--yellow)}
.marktext .tapp.ok{background:var(--ok-bg);border-bottom:2px solid var(--ok)}
.marktext .tapp.bad{background:var(--bad-bg);border-bottom:2px solid var(--bad)}
.marktext.locked .tapp{cursor:default}
textarea.opentext{display:block;width:100%;min-height:9em;font:inherit;line-height:1.45;padding:10px 12px;border:2px solid var(--line);border-radius:6px;background:var(--card);color:var(--ink);box-sizing:border-box}
textarea.opentext:focus{outline:3px solid var(--accent);outline-offset:1px}
.denk{background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:8px 14px;margin:0 0 10px}
.denk ul{margin:.3em 0 0;padding-left:1.2em}
details.muster{margin-top:12px}
.mbtn .pic svg{width:120px;max-width:100%;height:auto;display:block}
.testauftrag{font-weight:600;margin:0 0 14px}

/* Layout */
.app{display:grid;grid-template-columns:290px minmax(0,1fr);min-height:100vh}
.app>div{min-width:0}
aside{background:var(--blue-d);color:#eaf3fb;padding:22px 18px;position:sticky;top:0;height:100vh;overflow:auto;display:flex;flex-direction:column;gap:18px}
:root[data-theme="dark"] aside{background:#0a141c}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) aside{background:#0a141c}}
.brand{display:flex;gap:12px;align-items:flex-end}
.brand b{font-family:var(--f-head);font-size:1.55rem;line-height:1;font-weight:700;display:block}
.brand small{display:block;opacity:.75;font-size:.85rem;margin-top:4px}
.stack{flex:none}
nav ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
nav a{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:4px;color:#eaf3fb;text-decoration:none;font-weight:500;border-left:4px solid transparent}
nav a:hover{background:rgba(255,255,255,.08)}
nav a[aria-current="page"]{background:rgba(255,255,255,.14);border-left-color:var(--yellow);font-weight:700}
nav .cnt{margin-left:auto;font-size:.85rem;opacity:.8;font-variant-numeric:tabular-nums}
nav .done .cnt{color:var(--yellow);opacity:1;font-weight:700}
.sidefoot{margin-top:auto;font-size:.8rem;opacity:.7}
.themebtn{background:none;border:1px solid rgba(255,255,255,.3);color:#eaf3fb;border-radius:4px;padding:5px 10px;cursor:pointer;font-size:.85rem}
main{padding:34px clamp(16px,4vw,56px) 90px;max-width:1000px;width:100%}
.topbar{display:none}
@media (max-width:900px){
  .app{grid-template-columns:minmax(0,1fr)}
  aside{display:none}
  .topbar{display:block;position:sticky;top:0;z-index:20;background:var(--blue-d);color:#fff;padding:calc(8px + var(--safe-t)) 12px 8px}
  .topbar .row{display:flex;align-items:center;gap:10px}
  .topbar b{font-family:var(--f-head);font-size:1.25rem}
  .topbar .pct{margin-left:auto;font-variant-numeric:tabular-nums;font-size:.9rem;opacity:.9}
  .pills{display:flex;gap:6px;overflow-x:auto;padding:8px 0 2px;scrollbar-width:thin}
  .pills a{flex:none;color:#fff;text-decoration:none;padding:5px 12px;border-radius:999px;border:1px solid rgba(255,255,255,.35);font-size:.9rem;white-space:nowrap}
  .pills a[aria-current="page"]{background:var(--yellow);color:#14232f;border-color:var(--yellow);font-weight:700}
  html{scroll-padding-top:110px}
  body{padding-top:0}
}

/* Hero / module header */
.pagehead{margin-bottom:26px;padding-bottom:20px;border-bottom:3px solid transparent;border-image:repeating-linear-gradient(90deg,var(--blue) 0 14px,var(--yellow) 14px 20px) 1}
.pagehead .lead{font-size:1.15rem;color:var(--muted);max-width:62ch;margin-top:10px}
.hero{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,.95fr);gap:28px;align-items:center;margin-bottom:30px}
.hero .photo{background:#fff;border-radius:6px;border:1px solid var(--line);padding:10px;position:relative;overflow:hidden}
.hero .photo::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,transparent 0 9px,var(--stripe) 9px 10px);pointer-events:none}
.hero img{display:block;width:100%;height:auto}
@media(max-width:760px){.hero{grid-template-columns:minmax(0,1fr)}}
.facts{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px;margin:18px 0}
.fact{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--yellow);padding:10px 14px;border-radius:4px}
.fact b{display:block;font-family:var(--f-head);font-size:1.5rem;line-height:1.1;color:var(--accent)}
.fact span{font-size:.92rem;color:var(--muted)}

/* Buttons */
.btn{display:inline-flex;align-items:center;gap:8px;border:2px solid var(--accent);background:var(--accent);color:var(--accent-ink);padding:9px 18px;border-radius:4px;font-weight:600;cursor:pointer;text-decoration:none;min-height:44px}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;color:var(--accent)}
.btn.yellow{background:var(--yellow);border-color:var(--yellow);color:#14232f}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btnrow{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:14px}
.field{display:flex;flex-direction:column;gap:4px;flex:1 1 220px}
.field label{font-weight:600;font-size:.92rem}
.field input{padding:9px 12px;border:2px solid var(--line);border-radius:4px;background:var(--card);min-height:44px}
.field input:focus{border-color:var(--accent)}

/* Info blocks */
.card{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:18px 20px;margin:18px 0}
.merke{border-left:6px solid var(--yellow);background:var(--yellow-soft);padding:12px 16px;border-radius:0 6px 6px 0;margin:16px 0}
.merke b.t{font-family:var(--f-head);font-size:1.25rem;display:block;margin-bottom:2px}
.vgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px;margin:16px 0}
.vcard{background:var(--card);border:1px solid var(--line);border-top:5px solid var(--blue);border-radius:4px;padding:10px 14px 14px}
.vcard.me{border-top-color:var(--yellow);box-shadow:0 0 0 2px var(--yellow) inset}
.vcard h3{margin:2px 0 4px}
.vcard p{font-size:.95rem;margin:.3em 0}
.vcard svg{width:100%;height:auto;display:block;background:var(--paper);border-radius:3px}
.tag{display:inline-block;background:var(--yellow);color:#14232f;font-weight:700;font-size:.8rem;padding:1px 8px;border-radius:999px}
.s-tank{fill:none;stroke:var(--ink);stroke-width:2}.s-liq{fill:var(--blue);opacity:.35}.s-pow{fill:var(--blue);opacity:.25}
.s-plat{fill:var(--ink)}.s-model{fill:var(--yellow);stroke:var(--ink);stroke-width:1}.s-laser{stroke:#d9480f;stroke-width:2;stroke-dasharray:4 3}
.s-spot{fill:#d9480f}.s-line{stroke:var(--ink);stroke-width:2;fill:none}.s-noz{fill:var(--ink)}.s-fil{stroke:var(--accent);stroke-width:3;fill:none}
.s-dot{fill:var(--blue)}.s-txt{font:600 9px var(--f-body);fill:var(--ink)}

/* Tasks */
.task{background:var(--card);border:1px solid var(--line);border-left:7px solid var(--accent);border-radius:4px;padding:16px 18px 18px;margin:22px 0;transition:border-color .2s}
.task.done{border-left-color:var(--ok)}
.task.assisted{border-left-color:var(--miss)}
.task .th{display:flex;align-items:baseline;gap:10px;margin-bottom:6px}
.task .th h3{margin:0}
.task .state{margin-left:auto;font-size:.85rem;font-weight:700;color:var(--ok)}
.task.assisted .state{color:var(--miss)}
.task .q{margin:.2em 0 .8em}
.figure{margin:10px 0 14px}.figure svg,.figure img{max-width:100%;height:auto}
.fb{margin-top:12px;font-weight:600}
.fb .msg{display:block;padding:10px 14px;border-radius:4px;border-left:5px solid}
.fb .good{background:var(--ok-bg);border-color:var(--ok);color:var(--ink)}
.fb .warn{background:var(--miss-bg);border-color:var(--miss);color:var(--ink)}
.fb .bad{background:var(--bad-bg);border-color:var(--bad);color:var(--ink)}
.fb .why{display:block;font-weight:400;margin-top:4px}

/* MC */
.opts{display:flex;flex-direction:column;gap:8px}
.opt{position:relative;display:flex;gap:12px;align-items:flex-start;border:2px solid var(--line);border-radius:4px;padding:10px 12px;cursor:pointer;background:var(--card)}
.opt:hover{border-color:var(--accent)}
.opt input{position:absolute;opacity:0;pointer-events:none}
.opt .mark{flex:none;width:22px;height:22px;border:2px solid var(--muted);border-radius:50%;margin-top:2px;display:grid;place-items:center}
.opt.multi .mark{border-radius:4px}
.opt input:checked + .mark{background:var(--accent);border-color:var(--accent)}
.opt input:checked + .mark::after{content:"";width:8px;height:8px;background:var(--accent-ink);border-radius:50%}
.opt.multi input:checked + .mark::after{border-radius:1px;width:10px;height:10px}
.opt input:focus-visible + .mark{outline:3px solid var(--yellow);outline-offset:2px}
.opt.ok{border-color:var(--ok);background:var(--ok-bg)}.opt.bad{border-color:var(--bad);background:var(--bad-bg)}.opt.miss{border-color:var(--miss);border-style:dashed}
.opt.locked{cursor:default}
.hintline{font-size:.9rem;color:var(--muted);margin:0 0 8px}

/* gaps + table */
.gaptext{line-height:2.4;margin:.2em 0}
select.gap,input.gap,.grid select{border:2px solid var(--line);border-radius:4px;padding:5px 8px;background:var(--card);min-height:38px;max-width:100%;margin:0 4px}
input.gap{min-width:90px}
select.gap:focus,input.gap:focus,.grid select:focus{border-color:var(--accent)}
.gap.ok,.grid select.ok,input.num.ok{border-color:var(--ok)!important;background:var(--ok-bg)!important}
.gap.bad,.grid select.bad,input.num.bad{border-color:var(--bad)!important;background:var(--bad-bg)!important}
.tscroll{overflow-x:auto}
table.grid{border-collapse:collapse;width:100%;min-width:560px}
.grid th,.grid td{border:1px solid var(--line);padding:8px 8px;text-align:left;vertical-align:middle}
.grid thead th{background:var(--accent);color:var(--accent-ink);font-family:var(--f-head);font-size:1.1rem;font-weight:600}
.grid tbody th{background:var(--paper);font-weight:700;min-width:120px}
.grid select{width:100%;margin:0}
.grid .pic svg{width:130px;height:auto;display:block;background:#fff;border-radius:3px}

/* order */
ol.ord{list-style:none;counter-reset:o;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
ol.ord li{counter-increment:o;display:flex;gap:10px;align-items:center;border:2px solid var(--line);border-radius:4px;padding:8px 10px;background:var(--card)}
ol.ord li::before{content:counter(o);flex:none;width:28px;height:28px;border-radius:50%;background:var(--paper);border:2px solid var(--line);display:grid;place-items:center;font-weight:700;font-size:.9rem}
ol.ord li.ok{border-color:var(--ok);background:var(--ok-bg)}ol.ord li.bad{border-color:var(--bad);background:var(--bad-bg)}
.ordbtns{margin-left:auto;display:flex;gap:4px}
.ib{width:38px;height:38px;border:2px solid var(--line);background:var(--card);border-radius:4px;cursor:pointer;font-size:.9rem}
.ib:hover:not(:disabled){border-color:var(--accent)}.ib:disabled{opacity:.35;cursor:default}

/* match */
.match{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px 26px}
.mbtn{overflow-wrap:anywhere;hyphens:auto}
.mcol{display:flex;flex-direction:column;gap:8px}
.mbtn{position:relative;text-align:left;border:2px solid var(--line);background:var(--card);border-radius:4px;padding:9px 12px 9px 42px;cursor:pointer;min-height:48px}
.mbtn .bd{position:absolute;left:8px;top:50%;transform:translateY(-50%);width:26px;height:26px;border-radius:50%;background:var(--paper);border:2px solid var(--line);display:grid;place-items:center;font-weight:700;font-size:.85rem}
.mbtn.sel{border-color:var(--yellow);box-shadow:0 0 0 3px var(--yellow)}
.mbtn.paired{border-color:var(--c)}.mbtn.paired .bd{background:var(--c);border-color:var(--c);color:#fff}
.mbtn.ok{background:var(--ok-bg)}.mbtn.bad{background:var(--bad-bg)}
@media(max-width:620px){.match{gap:8px 10px;font-size:.95rem}}

/* sort */
.pool,.bin .chips{display:flex;flex-wrap:wrap;gap:8px;min-height:44px}
.pool{border:2px dashed var(--line);border-radius:6px;padding:8px;margin-bottom:12px}
.bins{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.bin{border:2px solid var(--blue);border-radius:6px;padding:8px 10px 10px;background:var(--card);cursor:pointer}
.bin h4{margin:0 0 6px;font-family:var(--f-head);font-size:1.25rem;color:var(--accent)}
.bin.target{box-shadow:0 0 0 3px var(--yellow)}
.chip{border:2px solid var(--line);background:var(--paper);border-radius:999px;padding:5px 14px;cursor:pointer;font-weight:600}
.chip.sel{background:var(--yellow);border-color:var(--yellow);color:#14232f}
.chip.ok{background:var(--ok-bg);border-color:var(--ok)}.chip.bad{background:var(--bad-bg);border-color:var(--bad)}

/* label image */
.imgwrap{position:relative;background:#fff;border:1px solid var(--line);border-radius:6px;max-width:640px;margin:0 auto}
.imgwrap img{display:block;width:100%;height:auto;border-radius:6px}
.mk{position:absolute;transform:translate(-50%,-50%);width:32px;height:32px;border-radius:50%;border:3px solid #fff;background:var(--yellow);color:#14232f;font-weight:800;cursor:pointer;box-shadow:0 1px 5px rgba(0,0,0,.5);display:grid;place-items:center;padding:0;font-size:.95rem}
.mk.set{background:var(--accent);color:var(--accent-ink)}
.mk.ok{background:var(--ok);color:#fff}.mk.bad{background:var(--bad);color:#fff}
.lbl{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:8px;margin-top:14px}
.lbl button{display:flex;gap:10px;align-items:center;text-align:left;border:2px solid var(--line);background:var(--card);border-radius:4px;padding:6px 10px;cursor:pointer;min-height:44px}
.lbl button .n{flex:none;width:26px;height:26px;border-radius:50%;background:var(--yellow);color:#14232f;font-weight:800;display:grid;place-items:center;font-size:.85rem}
.lbl button.set .n{background:var(--accent);color:var(--accent-ink)}
.lbl button.ok{border-color:var(--ok);background:var(--ok-bg)}.lbl button.bad{border-color:var(--bad);background:var(--bad-bg)}
.lbl .empty{color:var(--muted)}
.overlay{position:fixed;inset:0;background:rgba(5,15,25,.6);display:grid;place-items:center;z-index:50;padding:16px}
.pop{background:var(--card);border-radius:8px;max-width:440px;width:100%;max-height:86vh;overflow:auto;padding:16px 18px;box-shadow:0 10px 40px rgba(0,0,0,.5)}
.pop h3{margin-bottom:10px}
.pop .tl{display:flex;flex-direction:column;gap:6px}
.pop .tl button{text-align:left;border:2px solid var(--line);background:var(--card);border-radius:4px;padding:9px 12px;cursor:pointer;min-height:44px}
.pop .tl button:hover:not(:disabled){border-color:var(--accent)}
.pop .tl button:disabled{opacity:.4;text-decoration:line-through;cursor:default}

/* num */
.numrow{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin:8px 0}
.numrow .ql{flex:1 1 260px}

  <div>

<script>
'use strict';
/* ---------- Helfer ---------- */
const $ = (s, el = document) => el.querySelector(s);
function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  if (attrs) for (const k in attrs) {
    const v = attrs[k];
    if (v == null || v === false) continue;
    if (k === 'class') el.className = v;
    else if (k === 'html') el.innerHTML = v;
    else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else el.setAttribute(k, v === true ? '' : v);
  }
  for (const c of kids.flat(Infinity)) { if (c == null || c === false) continue; el.append(c.nodeType ? c : document.createTextNode(c)); }
  return el;
}
function shuffle(a) { const b = a.slice(); for (let i = b.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [b[i], b[j]] = [b[j], b[i]]; } return b; }
function shuffleNotSame(a) { let b, n = 0; do { b = shuffle(a); n++; } while (n < 25 && b.every((x, i) => x === a[i])); return b; }
const norm = s => String(s).toLowerCase().trim().replace(/ä/g, 'ae').replace(/ö/g, 'oe').replace(/ü/g, 'ue').replace(/ß/g, 'ss').replace(/\s+/g, ' ');
const parseNum = s => { const v = parseFloat(String(s).replace(',', '.').replace(/[^\d.\-]/g, '')); return isNaN(v) ? null : v; };
const fmtMin = m => { m = Math.round(m); const hh = Math.floor(m / 60), mm = m % 60; return hh ? `${hh} h ${String(mm).padStart(2, '0')} min` : `${mm} min`; };
const strip = s => String(s).replace(/<[^>]+>/g, '');

/* ---------- Speicher (nur im Browser, mit Absicherung) ---------- */
const KEY = 'smarthome-challenges-v1';
let S = { name: '', klasse: '', tasks: {}, ch: {}, dry: {} };
function load() { try { const r = localStorage.getItem(KEY); if (r) { const o = JSON.parse(r); S = Object.assign(S, o); S.tasks = S.tasks || {}; S.ch = S.ch || {}; S.dry = S.dry || {}; } } catch (e) { } }
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { } }
function tst(id) { return S.tasks[id] || (S.tasks[id] = { done: false, assisted: false, attempts: 0 }); }

/* ---------- Aufgaben-Rahmen ---------- */
const TYPES = {};
const TASKCACHE = {};
function buildTask(t, nr) {
  if (TASKCACHE[t.id]) return TASKCACHE[t.id];
  const st = tst(t.id);
  const card = h('section', { class: 'task', id: 't-' + t.id });
  const state = h('span', { class: 'state' });
  const fb = h('div', { class: 'fb', 'aria-live': 'polite' });
  const ctx = { finish: null };
  const impl = TYPES[t.type](t, ctx);
  const bCheck = h('button', { class: 'btn', type: 'button' }, 'Prüfen');
  const bReveal = h('button', { class: 'btn ghost hidden', type: 'button' }, 'Lösung anzeigen');
  const bReset = h('button', { class: 'btn ghost', type: 'button' }, 'Zurücksetzen');
  const explain = () => t.explain ? `<span class="why">${t.explain}</span>` : '';
  const say = (cls, msg, extra = '') => { fb.innerHTML = `<span class="msg ${cls}">${msg}${extra}</span>`; };
  const paintState = () => {
    card.classList.toggle('done', st.done && !st.assisted);
    card.classList.toggle('assisted', st.done && st.assisted);
    state.textContent = st.done ? (st.assisted ? 'mit Lösungshilfe' : 'gelöst ✓') : '';
    refreshChrome();
  };
  bCheck.onclick = () => {
    const r = impl.check();
    st.attempts++; if (window.LP) LP.result(t.id, !!r.ok, t._label || t.title || t.id, card);
    if (r.ok) {
      const firstTime = !st.done;
      st.done = true; if (firstTime) st.assisted = false;
      impl.lock && impl.lock();
      say('good', r.msg || 'Richtig! Alles stimmt.', explain());
      bCheck.classList.add('hidden'); bReveal.classList.add('hidden');
    } else {
      let m = r.msg || (r.total > 1 ? `${r.right} von ${r.total} stimmen. Schau dir die markierten Stellen noch einmal an.` : 'Das stimmt noch nicht. Lies noch einmal genau.');
      if (t.hint) m += `<span class="why">Tipp: ${t.hint}</span>`;
      say('bad', m);
      if (st.attempts >= 2) bReveal.classList.remove('hidden');
    }
    save(); paintState();
  };
  bReveal.onclick = () => {
    impl.reveal(); impl.lock && impl.lock();
    if (!st.done) { st.assisted = true; if (window.LP) LP.assist(t.id); }
    st.done = true;
    say('warn', 'So sieht die Lösung aus. Das zählt als „mit Lösungshilfe“ – versuche die Aufgabe später noch einmal ohne Hilfe.', explain());
    bCheck.classList.add('hidden'); bReveal.classList.add('hidden');
    save(); paintState();
  };
  bReset.onclick = () => {
    impl.reset(); fb.innerHTML = '';
    bCheck.classList.remove('hidden'); if (st.attempts < 2) bReveal.classList.add('hidden');
  };
  ctx.finish = () => { if (!st.done) { st.done = true; st.assisted = false; save(); paintState(); } };
  card.append(...[
    h('div', { class: 'th' }, h('h3', null, `Aufgabe ${nr}`), h('span', { class: 't-title' }, t.title || ''), state),
    t.lesen ? h('div', { class: 'info-box lesen', html: t.lesen }) : null,
    t.info ? h('details', { class: 'info' }, h('summary', null, 'Info zur Aufgabe'), h('div', { class: 'infobody', html: t.info })) : null,
    t.q ? h('p', { class: 'q', html: t.q }) : null,
    t.tipp ? h('details', { class: 'info tipp' }, h('summary', null, 'Tipp'), h('div', { class: 'infobody', html: t.tipp })) : null,
    impl.el,
    impl.auto ? null : h('div', { class: 'btnrow' }, bCheck, bReveal, bReset),
    fb
  ].filter(Boolean));
  if (st.done) {
    if (impl.auto) { impl.restoreDone && impl.restoreDone(); }
    else {
      impl.reveal(); impl.lock && impl.lock();
      say(st.assisted ? 'warn' : 'good', st.assisted ? 'Bereits mit Lösungshilfe bearbeitet. Du kannst „Zurücksetzen“ drücken und es noch einmal versuchen.' : 'Bereits gelöst. Mit „Zurücksetzen“ kannst du nochmal üben.', explain());
      bCheck.classList.add('hidden');
    }
    paintState();
  }
  // Nach „Zurücksetzen“ muss Prüfen wieder erscheinen:
  const origReset = bReset.onclick;
  bReset.onclick = () => { origReset(); bCheck.classList.remove('hidden'); impl.unlock && impl.unlock(); };
  TASKCACHE[t.id] = card;
  return card;
}

/* ---------- Aufgabentypen ---------- */
// Einfach- und Mehrfachauswahl
TYPES.mc = (t) => {
  const multi = t.ans.length > 1;
  let opts = t.opts.map((text, i) => ({ text, i, ok: t.ans.includes(i) }));
  if (!t.fixed) opts = shuffle(opts);
  const name = 'q_' + t.id;
  const rows = opts.map(o => {
    const inp = h('input', { type: multi ? 'checkbox' : 'radio', name });
    const row = h('label', { class: 'opt' + (multi ? ' multi' : '') }, inp, h('span', { class: 'mark' }), h('span', { html: o.text }));
    return { o, inp, row };
  });
  const el = h('div', null, multi ? h('p', { class: 'hintline' }, 'Mehrere Antworten sind richtig.') : null, h('div', { class: 'opts' }, rows.map(r => r.row)));
  const clear = () => rows.forEach(r => r.row.classList.remove('ok', 'bad', 'miss'));
  rows.forEach(r => r.inp.addEventListener('change', clear));
  return {
    el,
    check() {
      clear(); let right = 0, allOk = true;
      rows.forEach(r => {
        const s = r.inp.checked, good = s === r.o.ok;
        if (good) right++; else allOk = false;
        if (s && r.o.ok) r.row.classList.add('ok');
        else if (s && !r.o.ok) r.row.classList.add('bad');
        else if (!s && r.o.ok && multi) r.row.classList.add('miss');
      });
      if (!multi) { const any = rows.some(r => r.inp.checked); return { ok: allOk, right: allOk ? 1 : 0, total: 1, msg: any ? null : 'Wähle zuerst eine Antwort aus.' }; }
      return { ok: allOk, right, total: rows.length, msg: allOk ? null : 'Nicht ganz: Gestrichelt markiert sind richtige Antworten, die noch fehlen. Rot sind falsch angekreuzt.' };
    },
    reveal() { clear(); rows.forEach(r => { r.inp.checked = r.o.ok; if (r.o.ok) r.row.classList.add('ok'); }); },
    lock() { rows.forEach(r => { r.inp.disabled = true; r.row.classList.add('locked'); }); },
    unlock() { rows.forEach(r => { r.inp.disabled = false; r.row.classList.remove('locked'); }); },
    reset() { clear(); rows.forEach(r => { r.inp.checked = false; }); }
  };
};

// Lückentext (Auswahl oder freie Eingabe)
TYPES.gaps = (t) => {
  const parts = t.text.split(/\{(\d+)\}/); const ctrls = [];
  const p = h('p', { class: 'gaptext' });
  parts.forEach((s, i) => {
    if (i % 2 === 0) { if (s) p.append(h('span', { html: s })); return; }
    const g = t.gaps[+s]; let c;
    if (g.opts) c = h('select', { class: 'gap', 'aria-label': 'Lücke ' + (+s + 1) }, h('option', { value: '' }, '…'), shuffle(g.opts).map(o => h('option', { value: o }, o)));
    else c = h('input', { class: 'gap', type: 'text', size: g.size || 10, autocomplete: 'off', autocapitalize: 'off', spellcheck: 'false', 'aria-label': 'Lücke ' + (+s + 1) });
    c.addEventListener('input', () => c.classList.remove('ok', 'bad')); c.addEventListener('change', () => c.classList.remove('ok', 'bad'));
    ctrls.push({ c, g }); p.append(c);
  });
  const acc = g => (Array.isArray(g.ans) ? g.ans : [g.ans]).map(norm);
  return {
    el: p,
    check() { let right = 0; ctrls.forEach(({ c, g }) => { const ok = c.value && acc(g).includes(norm(c.value)); c.classList.remove('ok', 'bad'); c.classList.add(ok ? 'ok' : 'bad'); if (ok) right++; }); return { ok: right === ctrls.length, right, total: ctrls.length }; },
    reveal() { ctrls.forEach(({ c, g }) => { c.value = Array.isArray(g.ans) ? g.ans[0] : g.ans; c.classList.remove('bad'); c.classList.add('ok'); }); },
    lock() { ctrls.forEach(({ c }) => c.disabled = true); }, unlock() { ctrls.forEach(({ c }) => c.disabled = false); },
    reset() { ctrls.forEach(({ c }) => { c.value = ''; c.classList.remove('ok', 'bad'); }); }
  };
};

// Tabelle mit Auswahlfeldern (Steckbrief)
TYPES.table = (t) => {
  const cells = [];
  const thead = h('thead', null, h('tr', null, h('th', null, t.corner || ''), t.cols.map(c => h('th', null, c.name))));
  const tbody = h('tbody', null, t.rows.map(r => h('tr', null,
    h('th', { scope: 'row', class: r.pic ? 'pic' : '', html: r.label }),
    t.cols.map((c, j) => {
      const s = h('select', { 'aria-label': strip(r.label) + ' – ' + c.name }, h('option', { value: '' }, 'wählen …'), shuffle(c.opts).map(o => h('option', { value: o }, o)));
      s.addEventListener('change', () => s.classList.remove('ok', 'bad'));
      cells.push({ s, ans: r.ans[j] }); return h('td', null, s);
    }))));
  return {
    el: h('div', { class: 'tscroll' }, h('table', { class: 'grid' }, thead, tbody)),
    check() { let right = 0; cells.forEach(({ s, ans }) => { const ok = s.value === ans; s.classList.remove('ok', 'bad'); s.classList.add(ok ? 'ok' : 'bad'); if (ok) right++; }); return { ok: right === cells.length, right, total: cells.length }; },
    reveal() { cells.forEach(({ s, ans }) => { s.value = ans; s.classList.remove('bad'); s.classList.add('ok'); }); },
    lock() { cells.forEach(({ s }) => s.disabled = true); }, unlock() { cells.forEach(({ s }) => s.disabled = false); },
    reset() { cells.forEach(({ s }) => { s.value = ''; s.classList.remove('ok', 'bad'); }); }
  };
};

// Reihenfolge
TYPES.order = (t) => {
  let list = shuffleNotSame(t.items.map((text, i) => ({ text, i }))); let marks = []; let locked = false;
  const ol = h('ol', { class: 'ord' });
  function paint() {
    ol.replaceChildren(...list.map((o, pos) => h('li', { class: marks[pos] || '' },
      h('span', { html: o.text }),
      h('span', { class: 'ordbtns' },
        h('button', { class: 'ib', type: 'button', 'aria-label': 'nach oben', disabled: locked || pos === 0, onclick: () => move(pos, -1) }, '▲'),
        h('button', { class: 'ib', type: 'button', 'aria-label': 'nach unten', disabled: locked || pos === list.length - 1, onclick: () => move(pos, 1) }, '▼')))));
  }
  function move(pos, d) { const j = pos + d; [list[pos], list[j]] = [list[j], list[pos]]; marks = []; paint(); }
  paint();
  return {
    el: h('div', null, h('p', { class: 'hintline' }, 'Verschiebe die Schritte mit den Pfeilen in die richtige Reihenfolge.'), ol),
    check() { let right = 0; marks = list.map((o, pos) => { const ok = o.i === pos; if (ok) right++; return ok ? 'ok' : 'bad'; }); paint(); return { ok: right === list.length, right, total: list.length, msg: right === list.length ? null : `${right} von ${list.length} Schritten stehen an der richtigen Stelle (grün). Die roten müssen noch wandern.` }; },
    reveal() { list = list.slice().sort((a, b) => a.i - b.i); marks = list.map(() => 'ok'); paint(); },
    lock() { locked = true; paint(); }, unlock() { locked = false; paint(); },
    reset() { marks = []; list = shuffleNotSame(list.slice().sort((a, b) => a.i - b.i)); locked = false; paint(); }
  };
};

// Zuordnen (antippen: links, dann rechts)
TYPES.match = (t) => {
  const n = t.pairs.length;
  const L = t.pairs.map((p, i) => ({ text: p[0], i }));
  const R = shuffleNotSame(t.pairs.map((p, i) => ({ text: p[1], i })));
  const map = new Map(); let selL = null; let marks = {}; let locked = false;
  const colL = h('div', { class: 'mcol' }), colR = h('div', { class: 'mcol' });
  function paint() {
    colL.replaceChildren(...L.map(l => {
      const paired = map.has(l.i);
      const b = h('button', { type: 'button', class: 'mbtn' + (selL === l.i ? ' sel' : '') + (paired ? ' paired' : '') + (marks[l.i] ? ' ' + marks[l.i] : ''), style: paired ? `--c:var(--pc${l.i % 6})` : null, disabled: locked, onclick: () => { selL = selL === l.i ? null : l.i; marks = {}; paint(); } },
        h('span', { class: 'bd' }, String(l.i + 1)), h('span', { html: l.text }));
      return b;
    }));
    colR.replaceChildren(...R.map(r => {
      let owner = null; map.forEach((v, k) => { if (v === r.i) owner = k; });
      const b = h('button', { type: 'button', class: 'mbtn' + (owner !== null ? ' paired' : ''), style: owner !== null ? `--c:var(--pc${owner % 6})` : null, disabled: locked, onclick: () => {
        marks = {};
        if (selL !== null) { map.forEach((v, k) => { if (v === r.i) map.delete(k); }); map.set(selL, r.i); selL = null; }
        else if (owner !== null) map.delete(owner);
        paint();
      } }, h('span', { class: 'bd' }, owner !== null ? String(owner + 1) : ''), h('span', { html: r.text }));
      return b;
    }));
  }
  paint();
  return {
    el: h('div', null, h('p', { class: 'hintline' }, t.how || 'Tippe links eine Aussage an und dann rechts den passenden Begriff. Zum Lösen einer Verbindung tippe den Begriff rechts noch einmal an.'), h('div', { class: 'match' }, colL, colR)),
    check() { let right = 0; marks = {}; L.forEach(l => { const ok = map.get(l.i) === l.i; marks[l.i] = ok ? 'ok' : 'bad'; if (ok) right++; }); paint(); return { ok: right === n, right, total: n, msg: map.size < n ? 'Es sind noch nicht alle Paare verbunden.' : null }; },
    reveal() { marks = {}; L.forEach(l => { map.set(l.i, l.i); marks[l.i] = 'ok'; }); selL = null; paint(); },
    lock() { locked = true; paint(); }, unlock() { locked = false; paint(); },
    reset() { map.clear(); marks = {}; selL = null; locked = false; paint(); }
  };
};

// Einsortieren in Gruppen
TYPES.sort = (t) => {
  const items = shuffle(t.items.map((it, i) => ({ ...it, i })));
  const place = {}; items.forEach(it => place[it.i] = null);
  let sel = null; let marks = {}; let locked = false;
  const pool = h('div', { class: 'pool' });
  const bins = h('div', { class: 'bins' });
  function chip(it) { return h('button', { type: 'button', class: 'chip' + (sel === it.i ? ' sel' : '') + (marks[it.i] ? ' ' + marks[it.i] : ''), disabled: locked, onclick: (e) => { e.stopPropagation(); sel = sel === it.i ? null : it.i; marks = {}; paint(); } }, it.text); }
  function paint() {
    pool.replaceChildren(...items.filter(it => place[it.i] === null).map(chip));
    pool.onclick = () => { if (sel !== null && !locked) { place[sel] = null; sel = null; marks = {}; paint(); } };
    bins.replaceChildren(...t.cats.map((c, ci) => h('div', { class: 'bin' + (sel !== null ? ' target' : ''), onclick: () => { if (sel !== null && !locked) { place[sel] = ci; sel = null; marks = {}; paint(); } } },
      h('h4', null, c), h('div', { class: 'chips' }, items.filter(it => place[it.i] === ci).map(chip)))));
  }
  paint();
  return {
    el: h('div', null, h('p', { class: 'hintline' }, 'Tippe einen Begriff an und dann das Feld, in das er gehört.'), pool, bins),
    check() { let right = 0, placed = 0; marks = {}; items.forEach(it => { if (place[it.i] !== null) placed++; const ok = place[it.i] === it.cat; marks[it.i] = place[it.i] === null ? '' : (ok ? 'ok' : 'bad'); if (ok) right++; }); paint(); return { ok: right === items.length, right, total: items.length, msg: placed < items.length ? 'Es liegen noch Begriffe oben im Sammelfeld.' : null }; },
    reveal() { items.forEach(it => { place[it.i] = it.cat; marks[it.i] = 'ok'; }); sel = null; paint(); },
    lock() { locked = true; paint(); }, unlock() { locked = false; paint(); },
    reset() { items.forEach(it => place[it.i] = null); marks = {}; sel = null; locked = false; paint(); }
  };
};

// Im Text antippen (Sätze oder Satzteile auswählen)
TYPES.mark = (t) => {
  const items = []; let locked = false;
  const p = h('p', { class: 'marktext' });
  const clear = () => items.forEach(it => it.b.classList.remove('ok', 'bad'));
  const paint = () => { items.forEach(it => { it.b.classList.toggle('on', it.on); it.b.setAttribute('aria-pressed', it.on ? 'true' : 'false'); }); p.classList.toggle('locked', locked); };
  t.parts.forEach(pt => {
    if (typeof pt === 'string') { p.append(h('span', { html: pt })); return; }
    const b = h('span', { class: 'tapp', role: 'button', tabindex: '0', 'aria-pressed': 'false', html: pt[0] });
    const it = { b, ok: !!pt[1], on: false };
    const tog = () => { if (locked) return; it.on = !it.on; clear(); paint(); };
    b.addEventListener('click', tog);
    b.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); tog(); } });
    items.push(it); p.append(b);
  });
  return {
    el: h('div', null, h('p', { class: 'hintline' }, 'Tippe die passenden Sätze an. Noch einmal antippen hebt die Auswahl auf.'), p),
    check() {
      clear(); let right = 0;
      items.forEach(it => { if (it.on === it.ok) right++; if (it.on) it.b.classList.add(it.ok ? 'ok' : 'bad'); });
      const ok = right === items.length;
      return { ok, right, total: items.length, msg: ok ? null : (items.some(it => it.on) ? `${right} von ${items.length} Sätzen richtig eingeordnet. Rot: falsch angetippt. Vielleicht fehlt auch noch ein Satz.` : 'Tippe zuerst mindestens einen Satz an.') };
    },
    reveal() { items.forEach(it => { it.on = it.ok; }); clear(); items.forEach(it => { if (it.ok) it.b.classList.add('ok'); }); paint(); },
    lock() { locked = true; paint(); }, unlock() { locked = false; paint(); },
    reset() { items.forEach(it => { it.on = false; }); clear(); locked = false; paint(); }
  };
};

// Offene Schreibaufgabe mit „Denk an“ und Musterlösung (ohne automatische Bewertung)
TYPES.open = (t, ctx) => {
  const st = tst(t.id);
  const ta = h('textarea', { class: 'opentext', rows: '7', 'aria-label': 'Deine Antwort', placeholder: 'Schreib hier deine Antwort in ganzen Sätzen.' });
  ta.value = st.text || '';
  const cnt = h('p', { class: 'hintline' });
  const fb2 = h('div', { class: 'fb', 'aria-live': 'polite' });
  const muster = h('details', { class: 'info muster' + (st.done ? '' : ' hidden') }, h('summary', null, 'Musterlösung'), h('div', { class: 'infobody', html: t.muster }));
  const upd = () => { const n = ta.value.trim().length; cnt.textContent = n < t.min ? `${n} Zeichen – schreib mindestens ${t.min}.` : `${n} Zeichen`; };
  ta.addEventListener('input', () => { st.text = ta.value; save(); upd(); });
  const bDone = h('button', { class: 'btn', type: 'button' }, 'Fertig');
  bDone.onclick = () => {
    const v = ta.value.trim();
    if (v.length < t.min) { fb2.innerHTML = `<span class="msg bad">Deine Antwort ist noch zu kurz. Schreib mindestens ${t.min} Zeichen, also zwei bis drei ganze Sätze.</span>`; return; }
    st.text = v; save();
    const miss = (t.checks || []).filter(c => !new RegExp(c[1], 'i').test(v)).map(c => c[0]);
    ctx.finish(); muster.classList.remove('hidden');
    fb2.innerHTML = miss.length ? `<span class="msg warn">Gespeichert. Prüfe noch einmal, ob du an Folgendes gedacht hast: ${miss.join(', ')}. Vergleiche dann mit der Musterlösung.</span>` : '<span class="msg good">Gespeichert. Vergleiche deine Antwort mit der Musterlösung.</span>';

const L = {};
L.domain = `<p>In Home Assistant gehört jede Anzeige zu einer <b>Entität</b>, und jede Entität hat eine Art, die <b>Domäne</b>. Ein <b>Sensor</b> (Domäne <code>sensor</code>) liefert einen Messwert mit Einheit, zum Beispiel Grad Celsius, Prozent oder Watt. Ein <b>Binärsensor</b> (<code>binary_sensor</code>) kennt dagegen nur zwei Zustände, etwa „Geöffnet“ und „Geschlossen“ oder „Erkannt“ und „Frei“. Schalten kannst du ihn nicht, er meldet nur, was er bemerkt.</p>
<p><b>Licht</b> (<code>light</code>) und <b>Schalter</b> (<code>switch</code>) schaltest du selbst ein und aus. Ein Licht kann oft zusätzlich Helligkeit und Farbe ändern, ein Schalter nur „Ein“ und „Aus“. Ein Gerät kann Entitäten aus mehreren Domänen haben: Der Zwischenstecker hat einen Schalter, mit dem du die Steckdose schaltest, und Sensoren, die die Leistung des angeschlossenen Geräts messen. Auch batteriebetriebene Geräte melden ihren Batteriestand als Messwert.</p>`;
L.entity = `${SG.device()}<p>Ein <b>Gerät</b> ist das, was du anfassen kannst: die Lampe, ein Zwischenstecker, später auch der Türsensor. Jedes Gerät stellt eine oder mehrere <b>Entitäten</b> bereit. Jede Entität hat eine eindeutige <b>Entitäts-ID</b>. Sie besteht aus zwei Teilen, die ein Punkt trennt: Vorne steht die Domäne, also die Art der Entität, dahinter ein Name aus Kleinbuchstaben, Ziffern und Unterstrichen. Leerzeichen und Umlaute gibt es in der ID nicht, aus „Tür“ wird „tur“.</p>
<p>Seit Version 2026.11 setzt Home Assistant den angezeigten Namen einer Entität aus dem Gerätenamen und dem Namen der Entität zusammen. Benennst du ein Gerät um, ändern sich deshalb die angezeigten Namen aller seiner Entitäten mit. Die Entitäts-IDs bleiben dabei gleich, damit Automationen, die eine ID verwenden, weiter funktionieren.</p>
<p>Den <b>Zustand</b> einer Entität siehst du auf dem Dashboard in deutscher Sprache, zum Beispiel „Ein“. Im Hintergrund speichert Home Assistant einen kurzen englischen Wert: beim Zwischenstecker <code>on</code> für eingeschaltet und <code>off</code> für ausgeschaltet. Mit einem <b>Bereich</b> ordnest du ein Gerät einem Ort zu, etwa „Station 2“. Die Entitäten des Geräts übernehmen diesen Bereich.</p>`;
L.zigbee = `<p><b>Zigbee</b> ist ein Funkstandard für Smart-Home-Geräte. Er funkt wie das WLAN im Bereich von 2,4 GHz, braucht aber viel weniger Energie. In einem Zigbee-Netz gibt es drei Rollen. Der <b>Koordinator</b> gründet das Netz und verbindet es mit Home Assistant. An deiner Station übernimmt das der Funk-Stick, der am Kleinstrechner steckt.</p>
<p><b>Router</b> leiten Nachrichten anderer Geräte weiter und machen das Netz größer. Das schaffen nur Geräte, die ständig Strom aus der Steckdose bekommen, denn sie müssen immer empfangsbereit sein. <b>Endgeräte</b> laufen mit Batterie. Sie schlafen fast die ganze Zeit und wachen nur auf, wenn sie etwas melden müssen. Dadurch hält die Batterie lange, aber Nachrichten anderer Geräte können sie nicht weiterleiten.</p>
<p>Nicht alles an der Station funkt über Zigbee. Der LED-Streifen hängt an einem eigenen Controller, der sich wie das Tablet über das WLAN verbindet. Auch der kleine Router der Station ist ein WLAN-Router: Mit den Routern im Zigbee-Netz hat er nur den Namen gemeinsam.</p>`;
L.koppeln = `<p><b>Koppeln</b> heißt: Ein Zigbee-Gerät tritt dem Funknetz deiner Station bei. Dafür müssen beide Seiten gleichzeitig bereit sein. Tippst du auf „Gerät hinzufügen“, sucht Home Assistant einige Minuten lang nach neuen Geräten. In dieser Zeit muss das Gerät im <b>Kopplungsmodus</b> sein. Meist hältst du dafür eine Taste einige Sekunden gedrückt, bis eine Leuchte blinkt. Dabei vergisst das Gerät ein altes Funknetz. Nach dem Koppeln legt Home Assistant das Gerät mit allen seinen Entitäten an. Neue Geräte erscheinen dann auch auf dem Dashboard.</p>`;
L.wled = `<p>Der LED-Streifen hängt an einem eigenen <b>Controller</b> mit der Software <b>WLED</b>. Der Controller funkt nicht über Zigbee, sondern ist wie das Tablet mit dem <b>WLAN</b> der Station verbunden. Sein Strom kommt aus einem eigenen Netzteil. Home Assistant bemerkt den Controller im Netzwerk von selbst und zeigt ihn unter „Entdeckt“ an.</p>
<p>Jede LED auf dem Streifen lässt sich einzeln ansteuern. Darum kann der Controller Farbverläufe und <b>Effekte</b> zeigen. In Home Assistant erscheint der Streifen als Licht (Domäne <code>light</code>) mit Helligkeit, Farbe und einer Liste von Effekten.</p>`;
L.binary = `<p>Türsensor und Bewegungsmelder sind <b>Binärsensoren</b> (Domäne <code>binary_sensor</code>): Sie kennen nur zwei Zustände, etwa „Geöffnet“ und „Geschlossen“ oder „Erkannt“ und „Frei“. Schalten kannst du sie nicht, sie melden nur. Im Hintergrund speichert Home Assistant <code>on</code> (geöffnet, erkannt) oder <code>off</code> (geschlossen, frei). Ihren <b>Batteriestand</b> melden sie zusätzlich als Messwert in Prozent, also als eigene Entität der Domäne <code>sensor</code>.</p>
<p>Der Klimasensor misst Temperatur und Luftfeuchtigkeit. Beides sind Messwerte mit Einheit, also zwei Entitäten der Domäne <code>sensor</code> an einem Gerät. Alle drei Sensoren laufen mit Batterie und sind im Funknetz Endgeräte. Wie bei jedem Gerät gilt: Benennst du einen Sensor um, ändert sich sein angezeigter Name, die Entitäts-IDs bleiben gleich.</p>`;
L.lampe = `<p>Die Lampe in der Fassung ist selbst ein Zigbee-Gerät mit Funkempfänger. Damit sie Befehle empfangen kann, braucht sie ständig Strom. Wird sie stromlos, etwa über einen Lichtschalter oder eine ausgeschaltete Steckdosenleiste, zeigt Home Assistant bei ihr nach einiger Zeit „Nicht verfügbar“, auch wenn alle anderen Geräte normal arbeiten.</p>
<p>Fällt dagegen der Funk-Stick aus, reagiert kein einziges Zigbee-Gerät mehr, weil das ganze Netz am Koordinator hängt. Fällt das WLAN der Station aus, verliert zuerst das Tablet die Verbindung, und auch der LED-Streifen ist nicht mehr erreichbar. Das Zigbee-Netz funkt davon unabhängig weiter.</p>`;
L.verlauf = `<p>Sensoren melden ihre Werte nicht jede Sekunde. Ein Temperatur- und Feuchtesensor schickt einen neuen Wert, wenn sich etwas deutlich ändert oder wenn eine bestimmte Zeit vergangen ist. Im <b>Verlauf</b> sieht eine Kurve deshalb oft wie eine Treppe oder ein Zickzack aus. Haucht man den Sensor an, steigt die Luftfeuchtigkeit schnell und fällt danach langsam wieder.</p>
<p>Ein Bewegungsmelder meldet „Erkannt“, sobald er eine Bewegung bemerkt. Auf „Frei“ springt er aber erst, wenn eine Weile lang nichts mehr passiert ist. Diese Zeit heißt <b>Nachlaufzeit</b>. Sie verhindert, dass das Licht ausgeht, nur weil jemand kurz still sitzt. Wie lang sie ist, hängt vom Gerät ab. Du ermittelst sie, indem du vergleichst, wann sich zuletzt jemand bewegt hat und wann der Melder auf „Frei“ springt.</p>`;
L.auto = `${SG.auto()}<p>Eine <b>Automation</b> erledigt etwas von selbst. Im Editor von Home Assistant hat sie drei Blöcke. Unter <b>„Sobald“</b> steht der <b>Auslöser</b>: ein Ereignis, also ein Moment, in dem sich etwas ändert, zum Beispiel „die Feuchte steigt über 65 %“. Erst dann startet die Automation.</p>
<p>Unter <b>„Und wenn“</b> stehen <b>Bedingungen</b>. Sie werden nur in dem Moment geprüft, in dem ein Auslöser feuert, etwa „die Tür ist geschlossen“. Ist eine Bedingung nicht erfüllt, bricht die Automation ab. Eine Bedingung allein startet nichts. Unter <b>„Dann“</b> stehen die <b>Aktionen</b>, also das, was passieren soll, zum Beispiel „der LED-Streifen leuchtet blau“. Was für die Aufgabe keine Rolle spielt, gehört in keinen der drei Blöcke.</p>`;
L.dauer = `<p>Beim Auslöser „Zustand“ wählst du die Entität und bei <b>„Zu“</b> den neuen Zustand, beim Türsensor zum Beispiel „Geöffnet“. Darunter gibt es das Feld <b>„Dauer“</b> mit Stunden, Minuten und Sekunden. Steht dort 5 Minuten, startet die Automation erst, wenn die Tür 5 Minuten lang offen steht. Wird sie vorher geschlossen, startet die Automation nicht. Die Dauer ist eine Zeitspanne, keine Uhrzeit: Eine Uhrzeit wie 0:05 Uhr stellst du nur beim Auslöser oder bei der Bedingung „Zeitpunkt“ ein.</p>
<p>Unter „Dann“ gibt es außerdem die Aktion <b>„Verzögerung“</b>. Sie wartet erst, nachdem die Automation schon gestartet ist, und führt danach die nächste Aktion auf jeden Fall aus. Was in der Wartezeit passiert, bemerkt sie nicht. Schalten kannst du unter „Dann“ nur Aktoren wie die Lampe, den LED-Streifen oder einen Zwischenstecker, Sensoren melden nur.</p>`;
L.zeit = `<p>Eine Uhrzeit kann in einer Automation zwei Aufgaben haben. Als <b>Auslöser</b> ist sie ein <b>Moment</b>: Du wählst unter „Sobald“ bei „Auslöser hinzufügen“ die Gruppe „Zeit und Ort“ und dann „Zeitpunkt“ und stellst bei „Um“ zum Beispiel 16:00 ein. Die Automation startet dann genau einmal, wenn die Uhr 16:00 erreicht. Unter „Wochentage“ legst du fest, an welchen Tagen das passiert. Ist die Station um diese Uhrzeit ausgeschaltet, wird der Start nicht nachgeholt.</p>
<p>Als <b>Bedingung</b> ist die Uhrzeit ein <b>Zeitraum</b>: Unter „Und wenn“ wählst du ebenfalls „Zeit und Ort“ und „Zeitpunkt“ und stellst „Nach“ 7:30 und „Vor“ 16:00 ein. Diese Bedingung startet nichts. Sie wird nur geprüft, wenn ein anderer Auslöser feuert, zum Beispiel die Tür. Liegt die Uhrzeit dann außerhalb des Zeitraums, bricht die Automation ab. Auch Zustände wie „die Tür ist geschlossen“ sind Bedingungen: Sie beschreiben, wie etwas gerade ist, nicht, dass sich etwas ändert.</p>`;
L.szene = `<p>Eine <b>Szene</b> speichert, wie mehrere Geräte gleichzeitig eingestellt sein sollen, zum Beispiel „Lampe hell und kaltweiß, LED-Streifen aus“. Aktivierst du die Szene, stellt Home Assistant alle Geräte auf einmal so ein. Von selbst startet eine Szene nie. Du aktivierst sie im Dashboard, oder eine Automation aktiviert sie als Aktion. Im <b>Live-Modus</b> des Szenen-Editors werden Änderungen sofort auf die Geräte übertragen, im <b>Prüf-Modus</b> passt du nur die Details an.</p>
<p>Eine <b>Automation</b> dagegen wartet auf ihren Auslöser. Ihr Auslöser ist der Moment, der sie startet. Ihre Bedingungen prüft sie genau in diesem Moment, bevor es weitergeht. Ihre Aktionen sind die Befehle, die danach ausgeführt werden.</p>`;
L.yaml = `<p>Hinter jeder Automation steht Text im Format <b>YAML</b>. Du siehst ihn über das Menü <b>⋮</b> und „In YAML bearbeiten“. Drei Regeln reichen für den Anfang: Jede Zeile hat die Form <code>schlüssel: wert</code>. Was zusammengehört, ist gleich weit mit <b>Leerzeichen</b> eingerückt, nie mit dem Tabulator. Ein Bindestrich am Zeilenanfang beginnt einen Eintrag in einer <b>Liste</b>, zum Beispiel einen von mehreren Auslösern.</p>
<p>In YAML stehen die Zustände so, wie Home Assistant sie im Hintergrund speichert: <code>"on"</code> für „Geöffnet“ oder „Erkannt“, <code>"off"</code> für „Geschlossen“ oder „Frei“. Eine Wartezeit legst du mit <code>for:</code> fest, darunter eingerückt die Einheit, etwa <code>minutes: 2</code>. Die Aktion zum Einschalten einer Lampe heißt <code>light.turn_on</code>, zum Ausschalten <code>light.turn_off</code>. Für einen Schalter wie den Zwischenstecker heißen sie <code>switch.turn_on</code> und <code>switch.turn_off</code>.</p>`;

function solHtml(t) {

  if (t.type === 'sort') return li(t.cats.map((c, ci) => `<b>${c}:</b> ` + t.items.filter(i => i.cat === ci).map(i => i.text).join('; ')));
  if (t.type === 'gaps') return `<p${t.code ? ' class="gaptext code"' : ''}>` + t.text.replace(/\{(\d+)\}/g, (m, k) => `<b>${esc(t.gaps[+k].ans)}</b>`) + '</p>';
  if (t.type === 'mark') return li(t.parts.filter(x => typeof x !== 'string').map(x => (x[1] ? '<b>antippen:</b> ' : 'nicht antippen: ') + x[0]));
  if (t.type === 'match') return li(t.pairs.map(x => `${x[0]} → <b>${x[1]}</b>`));
  if (t.type === 'num') return li(t.items.map(x => `${x.q} <b>${String(x.ans).replace('.', ',')} ${x.unit || ''}</b>` + (x.tol ? ` (±${x.tol})` : '')));
  if (t.type === 'code') return '<p>Antippen:</p>' + li(t.lines.map((x, i) => x[1] ? `Zeile ${i + 1}: <code>${esc(x[0].trim())}</code>` : null).filter(Boolean));
  return '';
}

<script>/* lp-shell-Adapter: Modul-Bauart (Elektroinstallation, 3D-Druck): MODULES, navItems(), curKey(), modStats(), Router über #/…

   und setzt die Kapitelleiste darunter. Farbe der Fortschrittsspalte: --blue der Seite. */
(function () {
  var tries = 0;
  function start() {
    var side = document.querySelector('#side');
    if (!window.LPShell || typeof navItems !== 'function' || !side || !side.querySelector('.brand')) { if (++tries < 200) setTimeout(start, 50); return; }

    var b = side.querySelector('.brand b'), sm = side.querySelector('.brand small');
    var wrap = document.createElement('div'); wrap.className = 'lps-mwrap';
    var head = document.createElement('header'); head.className = 'lps-mhead';
    var img = document.createElement('img'); img.alt = 'Logo: dein Technik Lehrer';
    function logo() { var d = document.documentElement.getAttribute('data-theme') === 'dark' || (!document.documentElement.getAttribute('data-theme') && matchMedia('(prefers-color-scheme: dark)').matches); img.src = (d && typeof LOGO_D !== 'undefined') ? LOGO_D : (typeof LOGO_L !== 'undefined' ? LOGO_L : ''); }

      bodyClass: 'lps-modul', color: '--blue',
      chapters: function () {
