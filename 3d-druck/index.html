<script defer src="../assets/jspdf.umd.min.js"></script>
<link rel="stylesheet" href="../assets/fonts/fonts.css">
<style>
:root{
  --blue:#035591; --blue-d:#023a63; --yellow:#F5B700; --yellow-soft:#fff3c9;
  --ink:#14232f; --muted:#56687a; --paper:#eef3f7; --card:#ffffff; --line:#d3dde6;
  --accent:#035591; --accent-ink:#ffffff; --link:#035591;
  --ok:#17803f; --ok-bg:#e2f4e8; --bad:#c23b2e; --bad-bg:#fce8e5; --miss:#b7791f; --miss-bg:#fff3d6;
  --stripe:rgba(3,85,145,.10);
  --f-head:'Barlow Condensed','Arial Narrow',Arial,sans-serif;
  --f-body:'Source Sans 3','Segoe UI',Helvetica,Arial,sans-serif;
  --pc0:#d9480f; --pc1:#1971c2; --pc2:#2b8a3e; --pc3:#9c36b5; --pc4:#c2255c; --pc5:#5c7c00;
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
}
:root:not([data-theme="light"]){}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#0d1922; --card:#152531; --ink:#e9f0f6; --muted:#9db1c1; --line:#2a4051;
    --accent:#3a8fd6; --accent-ink:#04121d; --link:#7fbdf0;
    --ok:#4cc37c; --ok-bg:#12321f; --bad:#ff8074; --bad-bg:#3a1a17; --miss:#f0b95a; --miss-bg:#3a2d10;
    --yellow-soft:#3a3010; --stripe:rgba(127,189,240,.10);
    --pc0:#ff9a5c; --pc1:#74b7ff; --pc2:#6fd68a; --pc3:#d59bf0; --pc4:#ff8fb5; --pc5:#b7d84a;
  }
}
:root[data-theme="dark"]{
  --paper:#0d1922; --card:#152531; --ink:#e9f0f6; --muted:#9db1c1; --line:#2a4051;
  --accent:#3a8fd6; --accent-ink:#04121d; --link:#7fbdf0;
  --ok:#4cc37c; --ok-bg:#12321f; --bad:#ff8074; --bad-bg:#3a1a17; --miss:#f0b95a; --miss-bg:#3a2d10;
  --yellow-soft:#3a3010; --stripe:rgba(127,189,240,.10);
  --pc0:#ff9a5c; --pc1:#74b7ff; --pc2:#6fd68a; --pc3:#d59bf0; --pc4:#ff8fb5; --pc5:#b7d84a;
}
*{box-sizing:border-box}
html{height:100%;scroll-padding-top:calc(var(--safe-t) + 70px)}
body{margin:0;min-height:100%;background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.55;padding-top:var(--safe-t);padding-bottom:var(--safe-b);-webkit-text-size-adjust:100%}
h1,h2,h3{font-family:var(--f-head);font-weight:700;line-height:1.1;margin:0;letter-spacing:.01em}
h1{font-size:clamp(2.4rem,6vw,3.6rem)} h2{font-size:clamp(1.9rem,4vw,2.5rem)} h3{font-size:1.45rem;font-weight:600}
p{margin:.6em 0} a{color:var(--link)}
button,select,input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--yellow);outline-offset:2px}
.hidden{display:none!important}

/* Layout */
.app{display:grid;grid-template-columns:290px minmax(0,1fr);min-height:100vh}
.app>div{min-width:0}
aside{background:var(--blue-d);color:#eaf3fb;padding:22px 18px;position:sticky;top:0;height:100vh;overflow:auto;display:flex;flex-direction:column;gap:18px}
:root[data-theme="dark"] aside{background:#0a141c}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) aside{background:#0a141c}}
.brand{display:flex;gap:12px;align-items:flex-end}
.brand b{font-family:var(--f-head);font-size:1.55rem;line-height:1;font-weight:700;display:block}
.brand small{display:block;opacity:.75;font-size:.85rem;margin-top:4px}
.stack{flex:none}
nav ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
nav a{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:4px;color:#eaf3fb;text-decoration:none;font-weight:500;border-left:4px solid transparent}
nav a:hover{background:rgba(255,255,255,.08)}
nav a[aria-current="page"]{background:rgba(255,255,255,.14);border-left-color:var(--yellow);font-weight:700}
nav .cnt{margin-left:auto;font-size:.85rem;opacity:.8;font-variant-numeric:tabular-nums}
nav .done .cnt{color:var(--yellow);opacity:1;font-weight:700}
.sidefoot{margin-top:auto;font-size:.8rem;opacity:.7}
.themebtn{background:none;border:1px solid rgba(255,255,255,.3);color:#eaf3fb;border-radius:4px;padding:5px 10px;cursor:pointer;font-size:.85rem}
main{padding:34px clamp(16px,4vw,56px) 90px;max-width:1000px;width:100%}
.topbar{display:none}
@media (max-width:900px){
  .app{grid-template-columns:minmax(0,1fr)}
  aside{display:none}
  .topbar{display:block;position:sticky;top:0;z-index:20;background:var(--blue-d);color:#fff;padding:calc(8px + var(--safe-t)) 12px 8px}
  .topbar .row{display:flex;align-items:center;gap:10px}
  .topbar b{font-family:var(--f-head);font-size:1.25rem}
  .topbar .pct{margin-left:auto;font-variant-numeric:tabular-nums;font-size:.9rem;opacity:.9}
  .pills{display:flex;gap:6px;overflow-x:auto;padding:8px 0 2px;scrollbar-width:thin}
  .pills a{flex:none;color:#fff;text-decoration:none;padding:5px 12px;border-radius:999px;border:1px solid rgba(255,255,255,.35);font-size:.9rem;white-space:nowrap}
  .pills a[aria-current="page"]{background:var(--yellow);color:#14232f;border-color:var(--yellow);font-weight:700}
  html{scroll-padding-top:110px}
  body{padding-top:0}
}

/* Hero / module header */
.pagehead{margin-bottom:26px;padding-bottom:20px;border-bottom:3px solid transparent;border-image:repeating-linear-gradient(90deg,var(--blue) 0 14px,var(--yellow) 14px 20px) 1}
.pagehead .lead{font-size:1.15rem;color:var(--muted);max-width:62ch;margin-top:10px}
.hero{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,.95fr);gap:28px;align-items:center;margin-bottom:30px}
.hero .photo{background:#fff;border-radius:6px;border:1px solid var(--line);padding:10px;position:relative;overflow:hidden}
.hero .photo::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,transparent 0 9px,var(--stripe) 9px 10px);pointer-events:none}
.hero img{display:block;width:100%;height:auto}
@media(max-width:760px){.hero{grid-template-columns:minmax(0,1fr)}}
.facts{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px;margin:18px 0}
.fact{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--yellow);padding:10px 14px;border-radius:4px}
.fact b{display:block;font-family:var(--f-head);font-size:1.5rem;line-height:1.1;color:var(--accent)}
.fact span{font-size:.92rem;color:var(--muted)}

/* Buttons */
.btn{display:inline-flex;align-items:center;gap:8px;border:2px solid var(--accent);background:var(--accent);color:var(--accent-ink);padding:9px 18px;border-radius:4px;font-weight:600;cursor:pointer;text-decoration:none;min-height:44px}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;color:var(--accent)}
.btn.yellow{background:var(--yellow);border-color:var(--yellow);color:#14232f}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btnrow{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:14px}
.field{display:flex;flex-direction:column;gap:4px;flex:1 1 220px}
.field label{font-weight:600;font-size:.92rem}
.field input{padding:9px 12px;border:2px solid var(--line);border-radius:4px;background:var(--card);min-height:44px}
.field input:focus{border-color:var(--accent)}

/* Info blocks */
.card{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:18px 20px;margin:18px 0}
.merke{border-left:6px solid var(--yellow);background:var(--yellow-soft);padding:12px 16px;border-radius:0 6px 6px 0;margin:16px 0}
.merke b.t{font-family:var(--f-head);font-size:1.25rem;display:block;margin-bottom:2px}
.vgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px;margin:16px 0}
.vcard{background:var(--card);border:1px solid var(--line);border-top:5px solid var(--blue);border-radius:4px;padding:10px 14px 14px}
.vcard.me{border-top-color:var(--yellow);box-shadow:0 0 0 2px var(--yellow) inset}
.vcard h3{margin:2px 0 4px}
.vcard p{font-size:.95rem;margin:.3em 0}
.vcard svg{width:100%;height:auto;display:block;background:var(--paper);border-radius:3px}
.tag{display:inline-block;background:var(--yellow);color:#14232f;font-weight:700;font-size:.8rem;padding:1px 8px;border-radius:999px}
.s-tank{fill:none;stroke:var(--ink);stroke-width:2}.s-liq{fill:var(--blue);opacity:.35}.s-pow{fill:var(--blue);opacity:.25}
.s-plat{fill:var(--ink)}.s-model{fill:var(--yellow);stroke:var(--ink);stroke-width:1}.s-laser{stroke:#d9480f;stroke-width:2;stroke-dasharray:4 3}
.s-spot{fill:#d9480f}.s-line{stroke:var(--ink);stroke-width:2;fill:none}.s-noz{fill:var(--ink)}.s-fil{stroke:var(--accent);stroke-width:3;fill:none}
.s-dot{fill:var(--blue)}.s-txt{font:600 9px var(--f-body);fill:var(--ink)}

/* Tasks */
.task{background:var(--card);border:1px solid var(--line);border-left:7px solid var(--accent);border-radius:4px;padding:16px 18px 18px;margin:22px 0;transition:border-color .2s}
.task.done{border-left-color:var(--ok)}
.task.assisted{border-left-color:var(--miss)}
.task .th{display:flex;align-items:baseline;gap:10px;margin-bottom:6px}
.task .th h3{margin:0}
.task .state{margin-left:auto;font-size:.85rem;font-weight:700;color:var(--ok)}
.task.assisted .state{color:var(--miss)}
.task .q{margin:.2em 0 .8em}
.figure{margin:10px 0 14px}.figure svg,.figure img{max-width:100%;height:auto}
.fb{margin-top:12px;font-weight:600}
.fb .msg{display:block;padding:10px 14px;border-radius:4px;border-left:5px solid}
.fb .good{background:var(--ok-bg);border-color:var(--ok);color:var(--ink)}
.fb .warn{background:var(--miss-bg);border-color:var(--miss);color:var(--ink)}
.fb .bad{background:var(--bad-bg);border-color:var(--bad);color:var(--ink)}
.fb .why{display:block;font-weight:400;margin-top:4px}

/* MC */
.opts{display:flex;flex-direction:column;gap:8px}
.opt{position:relative;display:flex;gap:12px;align-items:flex-start;border:2px solid var(--line);border-radius:4px;padding:10px 12px;cursor:pointer;background:var(--card)}
.opt:hover{border-color:var(--accent)}
.opt input{position:absolute;opacity:0;pointer-events:none}
.opt .mark{flex:none;width:22px;height:22px;border:2px solid var(--muted);border-radius:50%;margin-top:2px;display:grid;place-items:center}
.opt.multi .mark{border-radius:4px}
.opt input:checked + .mark{background:var(--accent);border-color:var(--accent)}
.opt input:checked + .mark::after{content:"";width:8px;height:8px;background:var(--accent-ink);border-radius:50%}
.opt.multi input:checked + .mark::after{border-radius:1px;width:10px;height:10px}
.opt input:focus-visible + .mark{outline:3px solid var(--yellow);outline-offset:2px}
.opt.ok{border-color:var(--ok);background:var(--ok-bg)}.opt.bad{border-color:var(--bad);background:var(--bad-bg)}.opt.miss{border-color:var(--miss);border-style:dashed}
.opt.locked{cursor:default}
.hintline{font-size:.9rem;color:var(--muted);margin:0 0 8px}

/* gaps + table */
.gaptext{line-height:2.4;margin:.2em 0}
select.gap,input.gap,.grid select{border:2px solid var(--line);border-radius:4px;padding:5px 8px;background:var(--card);min-height:38px;max-width:100%;margin:0 4px}
input.gap{min-width:90px}
select.gap:focus,input.gap:focus,.grid select:focus{border-color:var(--accent)}
.gap.ok,.grid select.ok,input.num.ok{border-color:var(--ok)!important;background:var(--ok-bg)!important}
.gap.bad,.grid select.bad,input.num.bad{border-color:var(--bad)!important;background:var(--bad-bg)!important}
.tscroll{overflow-x:auto}
table.grid{border-collapse:collapse;width:100%;min-width:560px}
.grid th,.grid td{border:1px solid var(--line);padding:8px 8px;text-align:left;vertical-align:middle}
.grid thead th{background:var(--accent);color:var(--accent-ink);font-family:var(--f-head);font-size:1.1rem;font-weight:600}
.grid tbody th{background:var(--paper);font-weight:700;min-width:120px}
.grid select{width:100%;margin:0}
.grid .pic svg{width:130px;height:auto;display:block;background:#fff;border-radius:3px}

/* order */
ol.ord{list-style:none;counter-reset:o;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
ol.ord li{counter-increment:o;display:flex;gap:10px;align-items:center;border:2px solid var(--line);border-radius:4px;padding:8px 10px;background:var(--card)}
ol.ord li::before{content:counter(o);flex:none;width:28px;height:28px;border-radius:50%;background:var(--paper);border:2px solid var(--line);display:grid;place-items:center;font-weight:700;font-size:.9rem}
ol.ord li.ok{border-color:var(--ok);background:var(--ok-bg)}ol.ord li.bad{border-color:var(--bad);background:var(--bad-bg)}
.ordbtns{margin-left:auto;display:flex;gap:4px}
.ib{width:38px;height:38px;border:2px solid var(--line);background:var(--card);border-radius:4px;cursor:pointer;font-size:.9rem}
.ib:hover:not(:disabled){border-color:var(--accent)}.ib:disabled{opacity:.35;cursor:default}

/* match */
.match{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px 26px}
.mbtn{overflow-wrap:anywhere;hyphens:auto}
.mcol{display:flex;flex-direction:column;gap:8px}
.mbtn{position:relative;text-align:left;border:2px solid var(--line);background:var(--card);border-radius:4px;padding:9px 12px 9px 42px;cursor:pointer;min-height:48px}
.mbtn .bd{position:absolute;left:8px;top:50%;transform:translateY(-50%);width:26px;height:26px;border-radius:50%;background:var(--paper);border:2px solid var(--line);display:grid;place-items:center;font-weight:700;font-size:.85rem}
.mbtn.sel{border-color:var(--yellow);box-shadow:0 0 0 3px var(--yellow)}
.mbtn.paired{border-color:var(--c)}.mbtn.paired .bd{background:var(--c);border-color:var(--c);color:#fff}
.mbtn.ok{background:var(--ok-bg)}.mbtn.bad{background:var(--bad-bg)}
@media(max-width:620px){.match{gap:8px 10px;font-size:.95rem}}

/* sort */
.pool,.bin .chips{display:flex;flex-wrap:wrap;gap:8px;min-height:44px}
.pool{border:2px dashed var(--line);border-radius:6px;padding:8px;margin-bottom:12px}
.bins{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.bin{border:2px solid var(--blue);border-radius:6px;padding:8px 10px 10px;background:var(--card);cursor:pointer}
.bin h4{margin:0 0 6px;font-family:var(--f-head);font-size:1.25rem;color:var(--accent)}
.bin.target{box-shadow:0 0 0 3px var(--yellow)}
.chip{border:2px solid var(--line);background:var(--paper);border-radius:999px;padding:5px 14px;cursor:pointer;font-weight:600}
.chip.sel{background:var(--yellow);border-color:var(--yellow);color:#14232f}
.chip.ok{background:var(--ok-bg);border-color:var(--ok)}.chip.bad{background:var(--bad-bg);border-color:var(--bad)}

/* label image */
.imgwrap{position:relative;background:#fff;border:1px solid var(--line);border-radius:6px;max-width:640px;margin:0 auto}
.imgwrap img{display:block;width:100%;height:auto;border-radius:6px}
.mk{position:absolute;transform:translate(-50%,-50%);width:32px;height:32px;border-radius:50%;border:3px solid #fff;background:var(--yellow);color:#14232f;font-weight:800;cursor:pointer;box-shadow:0 1px 5px rgba(0,0,0,.5);display:grid;place-items:center;padding:0;font-size:.95rem}
.mk.set{background:var(--accent);color:var(--accent-ink)}
.mk.ok{background:var(--ok);color:#fff}.mk.bad{background:var(--bad);color:#fff}
.lbl{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:8px;margin-top:14px}
.lbl button{display:flex;gap:10px;align-items:center;text-align:left;border:2px solid var(--line);background:var(--card);border-radius:4px;padding:6px 10px;cursor:pointer;min-height:44px}
.lbl button .n{flex:none;width:26px;height:26px;border-radius:50%;background:var(--yellow);color:#14232f;font-weight:800;display:grid;place-items:center;font-size:.85rem}
.lbl button.set .n{background:var(--accent);color:var(--accent-ink)}
.lbl button.ok{border-color:var(--ok);background:var(--ok-bg)}.lbl button.bad{border-color:var(--bad);background:var(--bad-bg)}
.lbl .empty{color:var(--muted)}
.overlay{position:fixed;inset:0;background:rgba(5,15,25,.6);display:grid;place-items:center;z-index:50;padding:16px}
.pop{background:var(--card);border-radius:8px;max-width:440px;width:100%;max-height:86vh;overflow:auto;padding:16px 18px;box-shadow:0 10px 40px rgba(0,0,0,.5)}
.pop h3{margin-bottom:10px}
.pop .tl{display:flex;flex-direction:column;gap:6px}
.pop .tl button{text-align:left;border:2px solid var(--line);background:var(--card);border-radius:4px;padding:9px 12px;cursor:pointer;min-height:44px}
.pop .tl button:hover:not(:disabled){border-color:var(--accent)}
.pop .tl button:disabled{opacity:.4;text-decoration:line-through;cursor:default}

/* num */
.numrow{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin:8px 0}
.numrow .ql{flex:1 1 260px}
input.num{width:110px;border:2px solid var(--line);border-radius:4px;padding:7px 10px;background:var(--card);min-height:42px;text-align:right}
input.num:focus{border-color:var(--accent)}
.unit{color:var(--muted)}
.numrow .sol{font-size:.9rem;color:var(--muted)}

/* Lab */
.lab{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px}
@media(max-width:760px){.lab{grid-template-columns:1fr}}
.ctl{margin:0 0 12px}
.ctl label{display:flex;justify-content:space-between;font-weight:600}
.ctl output{font-variant-numeric:tabular-nums;color:var(--accent);font-weight:700}
.ctl input[type=range]{width:100%;accent-color:var(--accent);height:34px}
.ctl small{color:var(--muted);display:block}
.viz{display:flex;gap:12px;align-items:flex-end;justify-content:center}
.viz figure{margin:0;text-align:center;font-size:.82rem;color:var(--muted)}
.viz svg{background:var(--paper);border:1px solid var(--line);border-radius:4px;width:150px;height:150px}
.meters{margin:12px 0;display:grid;gap:8px}
.meter{display:grid;grid-template-columns:96px 1fr 64px;gap:8px;align-items:center;font-size:.92rem}
.bar{height:14px;background:var(--paper);border:1px solid var(--line);border-radius:7px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);transition:width .25s}
.readout{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}
.readout div{background:var(--paper);border-radius:4px;padding:6px 10px}
.readout b{display:block;font-family:var(--f-head);font-size:1.4rem;line-height:1.1}
.readout span{font-size:.82rem;color:var(--muted)}
.warns{font-size:.92rem;color:var(--miss);min-height:1.4em}
.goals{list-style:none;padding:0;margin:14px 0 0;display:grid;gap:8px}
.goals li{display:flex;gap:10px;align-items:flex-start;border:2px solid var(--line);border-radius:4px;padding:8px 12px;background:var(--card)}
.goals li .gi{flex:none;width:26px;height:26px;border-radius:50%;border:2px solid var(--muted);display:grid;place-items:center;font-weight:800;font-size:.9rem}
.goals li.met{border-color:var(--ok);background:var(--ok-bg)}.goals li.met .gi{background:var(--ok);border-color:var(--ok);color:#fff}
.goals li.now .gi{border-color:var(--yellow);background:var(--yellow);color:#14232f}

/* Nav + progress */
.modnav{display:flex;justify-content:space-between;gap:10px;margin-top:36px;flex-wrap:wrap}
.pbar{display:flex;gap:3px;margin:8px 0}
.pbar i{flex:1;height:10px;background:var(--line);border-radius:2px}
.pbar i.on{background:var(--accent)}
.pbar i.cur{background:var(--yellow)}
.layers{display:flex;flex-direction:column-reverse;gap:3px;width:120px}
.layers i{height:6px;background:rgba(255,255,255,.18);border-radius:1px}
.layers i.on{background:#5aa9e6}.layers i.top{background:var(--yellow)}
.progwrap{display:flex;gap:14px;align-items:flex-end}
.progwrap .pnum{font-family:var(--f-head);font-size:2rem;line-height:1}
.progwrap small{opacity:.75;display:block}

/* Test */
.qcard{background:var(--card);border:1px solid var(--line);border-left:7px solid var(--blue);padding:18px 20px;border-radius:4px}
.qcard .qq{font-size:1.15rem;font-weight:600;margin:.2em 0 .8em}
.dots{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0 4px}
.dots button{width:34px;height:34px;border-radius:4px;border:2px solid var(--line);background:var(--card);cursor:pointer;font-weight:700;font-size:.85rem}
.dots button.ans{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.dots button.cur{outline:3px solid var(--yellow)}
.score{display:flex;gap:22px;align-items:center;flex-wrap:wrap}
.score .big{font-family:var(--f-head);font-size:4.2rem;line-height:1;color:var(--accent)}
.rev{display:grid;gap:12px;margin-top:18px}
.rev .ri{background:var(--card);border:1px solid var(--line);border-left:6px solid var(--ok);border-radius:4px;padding:12px 16px}
.rev .ri.wrong{border-left-color:var(--bad)}
.rev .ri b{display:block}
.rev .ri .ga{font-size:.95rem}

/* Export */
.sheet{background:#fff;color:#111;border:1px solid var(--line);border-radius:4px;padding:28px 32px;margin-top:18px}
.sheet h2{color:#035591}
.sheet table{border-collapse:collapse;width:100%;margin:10px 0 18px;font-size:.95rem}
.sheet th,.sheet td{border:1px solid #c9d3dc;padding:6px 10px;text-align:left}
.sheet th{background:#e8eff5}
.sheet .meta{display:flex;gap:26px;flex-wrap:wrap;margin:10px 0 18px}
.sheet .ok{color:#17803f;font-weight:700}.sheet .no{color:#c23b2e;font-weight:700}
textarea.rep{width:100%;min-height:200px;font:14px/1.45 ui-monospace,Menlo,Consolas,monospace;border:2px solid var(--line);border-radius:4px;padding:10px;background:var(--card);color:var(--ink)}
.toast{position:fixed;left:50%;bottom:calc(20px + var(--safe-b));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 18px;border-radius:6px;z-index:80;font-weight:600;max-width:90vw}
details.tch{margin-top:20px}details.tch summary{cursor:pointer;font-weight:600}
footer.foot{margin-top:50px;font-size:.85rem;color:var(--muted)}


/* Infokästen & Grafiken */
details.info{margin:4px 0 14px;border:2px solid var(--line);border-radius:6px;background:var(--paper)}
details.info>summary{cursor:pointer;list-style:none;padding:8px 14px;font-weight:700;color:var(--link);display:flex;gap:10px;align-items:center;min-height:44px}
details.info>summary::-webkit-details-marker{display:none}
details.info>summary::before{content:"i";flex:none;display:grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--accent);color:var(--accent-ink);font-family:Georgia,serif;font-style:italic;font-weight:700}
details.info>summary::after{content:"öffnen";margin-left:auto;font-weight:500;font-size:.9rem;color:var(--muted)}
details.info[open]>summary::after{content:"schließen"}
details.info[open]{border-color:var(--accent)}
details.info .infobody{padding:2px 16px 12px}
.ig{background:#fff;border:1px solid var(--line);border-radius:4px;padding:10px;margin:10px 0}
.ig svg{display:block;width:100%;height:auto;max-width:460px;margin:0 auto}
.ig figcaption,.panels figcaption{font-size:.9rem;color:#14232f;padding:6px 2px 0;line-height:1.35}
.panels{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin:10px 0}
.panels figure{margin:0;background:#fff;border:1px solid var(--line);border-radius:4px;padding:8px}
.panels figure svg{display:block;width:100%;height:auto;max-width:230px;margin:0 auto}
.trio{display:flex;gap:6px}.trio svg{flex:1;min-width:0}
.split{display:grid;grid-template-columns:minmax(0,220px) minmax(0,1fr);gap:16px;align-items:start}
@media(max-width:600px){.split{grid-template-columns:1fr}}
ul.il{margin:.4em 0;padding-left:1.2em}ul.il li{margin:.25em 0}
ol.steps{margin:.3em 0 0;padding-left:1.3em}ol.steps li{margin:.2em 0}
.merke.cura{border-left-color:var(--accent);background:var(--card);border:1px solid var(--line);border-left:6px solid var(--accent)}
table.mt{border-collapse:collapse;width:100%;min-width:420px;font-size:.95rem;margin:8px 0;background:var(--card)}
.mt th,.mt td{border:1px solid var(--line);padding:6px 9px;text-align:left}
.mt thead th{background:var(--accent);color:var(--accent-ink)}
.mt tbody th{background:var(--paper)}
.chain{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:12px 0}
.chain .box{background:var(--card);border:2px solid var(--accent);padding:6px 12px;border-radius:4px;font-weight:600}
.chain .ar{font-size:1.4rem;color:var(--accent);font-weight:700}
.hbars{margin:10px 0;display:grid;gap:6px}
.hb{display:grid;grid-template-columns:52px minmax(0,1fr) 92px;gap:10px;align-items:center}
.hb .bw{background:var(--line);height:18px;border-radius:2px;overflow:hidden}
.hb i{display:block;height:100%;background:var(--accent)}
.hb b{font-variant-numeric:tabular-nums;font-size:.95rem}
.vgrid.two{grid-template-columns:repeat(2,minmax(0,1fr))}
@media(max-width:640px){.vgrid.two{grid-template-columns:1fr}}
.vcard svg{background:#fff!important;border:1px solid var(--line)}
/* Code */
.codebox{font:600 1.05rem/1.6 ui-monospace,Menlo,Consolas,monospace;letter-spacing:.04em;word-break:break-all;background:var(--paper);border:2px dashed var(--accent);border-radius:6px;padding:12px 14px;user-select:all;-webkit-user-select:all}
textarea.codein{width:100%;min-height:74px;font:600 1rem/1.5 ui-monospace,Menlo,Consolas,monospace;border:2px solid var(--line);border-radius:4px;padding:8px 10px;background:var(--card);color:var(--ink);text-transform:uppercase}
textarea.codein:focus{border-color:var(--accent)}
.note{padding:10px 14px;border-radius:4px;border-left:5px solid var(--miss);background:var(--miss-bg);margin:10px 0}
.note.good{border-color:var(--ok);background:var(--ok-bg)}.note.bad{border-color:var(--bad);background:var(--bad-bg)}

.slogo{width:190px;height:auto;display:block}
.hero img.hlogo{width:min(300px,70%);height:auto;margin-bottom:14px}
.hero img.lg-dark{display:none}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .hero img.lg-light{display:none}:root:not([data-theme="light"]) .hero img.lg-dark{display:block}}
:root[data-theme="dark"] .hero img.lg-light{display:none}:root[data-theme="dark"] .hero img.lg-dark{display:block}
.sheet .shead{display:flex;flex-wrap:wrap-reverse;justify-content:space-between;align-items:flex-start;gap:12px}.sheet .shead img{width:180px;max-width:60%;height:auto}
@media(max-width:600px){.sheet{padding:18px 14px}}
.topbar .tlogo{height:26px;width:auto}
@media print{
  body{background:#fff;font-size:12pt}
  aside,.topbar,.no-print,.toast{display:none!important}
  .app{display:block}main{padding:0;max-width:none}
  .sheet{border:none;padding:0;margin:0}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

<body>
<div class="app">
  <aside id="side"></aside>
  <div>
    <div class="topbar" id="top"></div>
    <main id="main" tabindex="-1"></main>
  </div>
</div>
<script>

'use strict';
/* ---------- Helfer ---------- */
const $ = (s, el = document) => el.querySelector(s);
function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  if (attrs) for (const k in attrs) {
    const v = attrs[k];
    if (v == null || v === false) continue;
    if (k === 'class') el.className = v;
    else if (k === 'html') el.innerHTML = v;
    else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else el.setAttribute(k, v === true ? '' : v);
  }
  for (const c of kids.flat(Infinity)) { if (c == null || c === false) continue; el.append(c.nodeType ? c : document.createTextNode(c)); }
  return el;
}
function shuffle(a) { const b = a.slice(); for (let i = b.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [b[i], b[j]] = [b[j], b[i]]; } return b; }
function shuffleNotSame(a) { let b, n = 0; do { b = shuffle(a); n++; } while (n < 25 && b.every((x, i) => x === a[i])); return b; }
const norm = s => String(s).toLowerCase().trim().replace(/ä/g, 'ae').replace(/ö/g, 'oe').replace(/ü/g, 'ue').replace(/ß/g, 'ss').replace(/\s+/g, ' ');
const parseNum = s => { const v = parseFloat(String(s).replace(',', '.').replace(/[^\d.\-]/g, '')); return isNaN(v) ? null : v; };
const fmtMin = m => { m = Math.round(m); const hh = Math.floor(m / 60), mm = m % 60; return hh ? `${hh} h ${String(mm).padStart(2, '0')} min` : `${mm} min`; };
const strip = s => String(s).replace(/<[^>]+>/g, '');

/* ---------- Speicher (nur im Browser, mit Absicherung) ---------- */
const KEY = 'ender3v2-lernplattform-v1';
let S = { name: '', klasse: '', tasks: {}, test: { attempts: [] } };
function load() { try { const r = localStorage.getItem(KEY); if (r) { const o = JSON.parse(r); S = Object.assign(S, o); S.tasks = S.tasks || {}; S.test = S.test || { attempts: [] }; } } catch (e) { } }
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { } }
function tst(id) { return S.tasks[id] || (S.tasks[id] = { done: false, assisted: false, attempts: 0 }); }

/* ---------- Aufgaben-Rahmen ---------- */
const TYPES = {};
const TASKCACHE = {};
function buildTask(t, nr) {
  if (TASKCACHE[t.id]) return TASKCACHE[t.id];
  const st = tst(t.id);
  const card = h('section', { class: 'task', id: 't-' + t.id });
  const state = h('span', { class: 'state' });
  const fb = h('div', { class: 'fb', 'aria-live': 'polite' });
  const ctx = { finish: null };
  const impl = TYPES[t.type](t, ctx);
  const bCheck = h('button', { class: 'btn', type: 'button' }, 'Prüfen');
  const bReveal = h('button', { class: 'btn ghost hidden', type: 'button' }, 'Lösung anzeigen');
  const bReset = h('button', { class: 'btn ghost', type: 'button' }, 'Zurücksetzen');
  const explain = () => t.explain ? `<span class="why">${t.explain}</span>` : '';
  const say = (cls, msg, extra = '') => { fb.innerHTML = `<span class="msg ${cls}">${msg}${extra}</span>`; };
  const paintState = () => {
    card.classList.toggle('done', st.done && !st.assisted);
    card.classList.toggle('assisted', st.done && st.assisted);
    state.textContent = st.done ? (st.assisted ? 'mit Lösungshilfe' : 'gelöst ✓') : '';
    refreshChrome();
  };
  bCheck.onclick = () => {
    const r = impl.check();
    st.attempts++;
    if (r.ok) {
      const firstTime = !st.done;
      st.done = true; if (firstTime) st.assisted = false;
      impl.lock && impl.lock();
      say('good', r.msg || 'Richtig! Alles stimmt.', explain());
      bCheck.classList.add('hidden'); bReveal.classList.add('hidden');
    } else {
      let m = r.msg || (r.total > 1 ? `${r.right} von ${r.total} stimmen. Schau dir die markierten Stellen noch einmal an.` : 'Das stimmt noch nicht. Lies noch einmal genau.');
      if (t.hint) m += `<span class="why">Tipp: ${t.hint}</span>`;
      say('bad', m);
      if (st.attempts >= 2) bReveal.classList.remove('hidden');
    }
    save(); paintState();
  };
  bReveal.onclick = () => {
    impl.reveal(); impl.lock && impl.lock();
    if (!st.done) st.assisted = true;
    st.done = true;
    say('warn', 'So sieht die Lösung aus. Das zählt als „mit Lösungshilfe“ – versuche die Aufgabe später noch einmal ohne Hilfe.', explain());
    bCheck.classList.add('hidden'); bReveal.classList.add('hidden');
    save(); paintState();
  };
  bReset.onclick = () => {
    impl.reset(); fb.innerHTML = '';
    bCheck.classList.remove('hidden'); if (st.attempts < 2) bReveal.classList.add('hidden');
  };
  ctx.finish = () => { if (!st.done) { st.done = true; st.assisted = false; save(); paintState(); } };
  card.append(...[
    h('div', { class: 'th' }, h('h3', null, `Aufgabe ${nr}`), h('span', { class: 't-title' }, t.title || ''), state),
    t.info ? h('details', { class: 'info' }, h('summary', null, 'Info zur Aufgabe'), h('div', { class: 'infobody', html: t.info })) : null,
    t.q ? h('p', { class: 'q', html: t.q }) : null,
    impl.el,
    impl.auto ? null : h('div', { class: 'btnrow' }, bCheck, bReveal, bReset),
    fb
  ].filter(Boolean));
  if (st.done) {
    if (impl.auto) { impl.restoreDone && impl.restoreDone(); }
    else {
      impl.reveal(); impl.lock && impl.lock();
      say(st.assisted ? 'warn' : 'good', st.assisted ? 'Bereits mit Lösungshilfe bearbeitet. Du kannst „Zurücksetzen“ drücken und es noch einmal versuchen.' : 'Bereits gelöst. Mit „Zurücksetzen“ kannst du nochmal üben.', explain());
      bCheck.classList.add('hidden');
    }
    paintState();
  }
  // Nach „Zurücksetzen“ muss Prüfen wieder erscheinen:
  const origReset = bReset.onclick;
  bReset.onclick = () => { origReset(); bCheck.classList.remove('hidden'); impl.unlock && impl.unlock(); };
  TASKCACHE[t.id] = card;
  return card;
}

/* ---------- Aufgabentypen ---------- */
// Einfach- und Mehrfachauswahl
TYPES.mc = (t) => {
  const multi = t.ans.length > 1;
  let opts = t.opts.map((text, i) => ({ text, i, ok: t.ans.includes(i) }));
  if (!t.fixed) opts = shuffle(opts);
  const name = 'q_' + t.id;
  const rows = opts.map(o => {
    const inp = h('input', { type: multi ? 'checkbox' : 'radio', name });
    const row = h('label', { class: 'opt' + (multi ? ' multi' : '') }, inp, h('span', { class: 'mark' }), h('span', { html: o.text }));
    return { o, inp, row };
  });
  const el = h('div', null, multi ? h('p', { class: 'hintline' }, 'Mehrere Antworten sind richtig.') : null, h('div', { class: 'opts' }, rows.map(r => r.row)));
  const clear = () => rows.forEach(r => r.row.classList.remove('ok', 'bad', 'miss'));
  rows.forEach(r => r.inp.addEventListener('change', clear));
  return {
    el,
    check() {
      clear(); let right = 0, allOk = true;
      rows.forEach(r => {
        const s = r.inp.checked, good = s === r.o.ok;
        if (good) right++; else allOk = false;
        if (s && r.o.ok) r.row.classList.add('ok');
        else if (s && !r.o.ok) r.row.classList.add('bad');
        else if (!s && r.o.ok && multi) r.row.classList.add('miss');
      });
      if (!multi) { const any = rows.some(r => r.inp.checked); return { ok: allOk, right: allOk ? 1 : 0, total: 1, msg: any ? null : 'Wähle zuerst eine Antwort aus.' }; }
      return { ok: allOk, right, total: rows.length, msg: allOk ? null : 'Nicht ganz: Gestrichelt markiert sind richtige Antworten, die noch fehlen. Rot sind falsch angekreuzt.' };
    },
    reveal() { clear(); rows.forEach(r => { r.inp.checked = r.o.ok; if (r.o.ok) r.row.classList.add('ok'); }); },
    lock() { rows.forEach(r => { r.inp.disabled = true; r.row.classList.add('locked'); }); },
    unlock() { rows.forEach(r => { r.inp.disabled = false; r.row.classList.remove('locked'); }); },
    reset() { clear(); rows.forEach(r => { r.inp.checked = false; }); }
  };
};

// Lückentext (Auswahl oder freie Eingabe)
TYPES.gaps = (t) => {
  const parts = t.text.split(/\{(\d+)\}/); const ctrls = [];
  const p = h('p', { class: 'gaptext' });
  parts.forEach((s, i) => {
    if (i % 2 === 0) { if (s) p.append(h('span', { html: s })); return; }
    const g = t.gaps[+s]; let c;
    if (g.opts) c = h('select', { class: 'gap', 'aria-label': 'Lücke ' + (+s + 1) }, h('option', { value: '' }, '…'), shuffle(g.opts).map(o => h('option', { value: o }, o)));
    else c = h('input', { class: 'gap', type: 'text', size: g.size || 10, autocomplete: 'off', autocapitalize: 'off', spellcheck: 'false', 'aria-label': 'Lücke ' + (+s + 1) });
    c.addEventListener('input', () => c.classList.remove('ok', 'bad')); c.addEventListener('change', () => c.classList.remove('ok', 'bad'));
    ctrls.push({ c, g }); p.append(c);
  });
  const acc = g => (Array.isArray(g.ans) ? g.ans : [g.ans]).map(norm);
  return {
    el: p,
    check() { let right = 0; ctrls.forEach(({ c, g }) => { const ok = c.value && acc(g).includes(norm(c.value)); c.classList.remove('ok', 'bad'); c.classList.add(ok ? 'ok' : 'bad'); if (ok) right++; }); return { ok: right === ctrls.length, right, total: ctrls.length }; },
    reveal() { ctrls.forEach(({ c, g }) => { c.value = Array.isArray(g.ans) ? g.ans[0] : g.ans; c.classList.remove('bad'); c.classList.add('ok'); }); },
    lock() { ctrls.forEach(({ c }) => c.disabled = true); }, unlock() { ctrls.forEach(({ c }) => c.disabled = false); },
    reset() { ctrls.forEach(({ c }) => { c.value = ''; c.classList.remove('ok', 'bad'); }); }
  };
};

// Tabelle mit Auswahlfeldern (Steckbrief)
TYPES.table = (t) => {
  const cells = [];
  const thead = h('thead', null, h('tr', null, h('th', null, t.corner || ''), t.cols.map(c => h('th', null, c.name))));
  const tbody = h('tbody', null, t.rows.map(r => h('tr', null,
    h('th', { scope: 'row', class: r.pic ? 'pic' : '', html: r.label }),
    t.cols.map((c, j) => {
      const s = h('select', { 'aria-label': strip(r.label) + ' – ' + c.name }, h('option', { value: '' }, 'wählen …'), shuffle(c.opts).map(o => h('option', { value: o }, o)));
      s.addEventListener('change', () => s.classList.remove('ok', 'bad'));
      cells.push({ s, ans: r.ans[j] }); return h('td', null, s);
    }))));
  return {
    el: h('div', { class: 'tscroll' }, h('table', { class: 'grid' }, thead, tbody)),
    check() { let right = 0; cells.forEach(({ s, ans }) => { const ok = s.value === ans; s.classList.remove('ok', 'bad'); s.classList.add(ok ? 'ok' : 'bad'); if (ok) right++; }); return { ok: right === cells.length, right, total: cells.length }; },
    reveal() { cells.forEach(({ s, ans }) => { s.value = ans; s.classList.remove('bad'); s.classList.add('ok'); }); },
    lock() { cells.forEach(({ s }) => s.disabled = true); }, unlock() { cells.forEach(({ s }) => s.disabled = false); },
    reset() { cells.forEach(({ s }) => { s.value = ''; s.classList.remove('ok', 'bad'); }); }
  };
};

// Reihenfolge
TYPES.order = (t) => {
  let list = shuffleNotSame(t.items.map((text, i) => ({ text, i }))); let marks = []; let locked = false;
  const ol = h('ol', { class: 'ord' });
  function paint() {
    ol.replaceChildren(...list.map((o, pos) => h('li', { class: marks[pos] || '' },
      h('span', { html: o.text }),
      h('span', { class: 'ordbtns' },
        h('button', { class: 'ib', type: 'button', 'aria-label': 'nach oben', disabled: locked || pos === 0, onclick: () => move(pos, -1) }, '▲'),
        h('button', { class: 'ib', type: 'button', 'aria-label': 'nach unten', disabled: locked || pos === list.length - 1, onclick: () => move(pos, 1) }, '▼')))));
  }
  function move(pos, d) { const j = pos + d; [list[pos], list[j]] = [list[j], list[pos]]; marks = []; paint(); }
  paint();
  return {
    el: h('div', null, h('p', { class: 'hintline' }, 'Verschiebe die Schritte mit den Pfeilen in die richtige Reihenfolge.'), ol),
    check() { let right = 0; marks = list.map((o, pos) => { const ok = o.i === pos; if (ok) right++; return ok ? 'ok' : 'bad'; }); paint(); return { ok: right === list.length, right, total: list.length, msg: right === list.length ? null : `${right} von ${list.length} Schritten stehen an der richtigen Stelle (grün). Die roten müssen noch wandern.` }; },
    reveal() { list = list.slice().sort((a, b) => a.i - b.i); marks = list.map(() => 'ok'); paint(); },
    lock() { locked = true; paint(); }, unlock() { locked = false; paint(); },
    reset() { marks = []; list = shuffleNotSame(list.slice().sort((a, b) => a.i - b.i)); locked = false; paint(); }
  };
};

// Zuordnen (antippen: links, dann rechts)
TYPES.match = (t) => {

function tile(kind, dens) {
  const W = 120; let s = ''; const id = 'k' + Math.random().toString(36).slice(2, 7);
  if (kind === 'grid') { const sp = 1.6 / (dens / 100) * 4; for (let i = 6 + sp / 2; i < W - 6; i += sp) s += `M${i.toFixed(1)} 6V${W - 6}M6 ${i.toFixed(1)}H${W - 6}`; }
  if (kind === 'lines') for (let i = 12; i < W - 6; i += 12) s += `M${i} 6V${W - 6}`;
  if (kind === 'conc') for (let i = 10; i < 58; i += 10) s += `M${i} ${i}H${W - i}V${W - i}H${i}Z`;
  if (kind === 'shift') { const o = dens; for (let i = -W; i < 2 * W; i += 16) s += `M${i + o} 6L${i + o + 40} ${W - 6}`; }
  return `<svg viewBox="0 0 ${W} ${W}" role="img" aria-label="Füllung"><defs><clipPath id="${id}"><rect x="6" y="6" width="${W - 12}" height="${W - 12}"/></clipPath></defs><rect x="3" y="3" width="${W - 6}" height="${W - 6}" fill="#fff" stroke="${C.blue}" stroke-width="4"/><path d="${s}" clip-path="url(#${id})" stroke="#e8590c" stroke-width="2.4" fill="none"/></svg>`;
}
function patSVG(kind) {
  let s = '', id = 'c' + Math.random().toString(36).slice(2, 7); const W = 120;
  if (kind === 'Gitter') for (let i = 12; i < W - 6; i += 16) s += `M${i} 6V${W - 6}M6 ${i}H${W - 6}`;
  if (kind === 'Linien') for (let i = 12; i < W - 6; i += 12) s += `M${i} 6V${W - 6}`;
  if (kind === 'Dreiecke') { for (let y = 14; y < W; y += 18) s += `M0 ${y}H${W}`; for (let x = -120; x < 240; x += 21) s += `M${x} 0L${x + 70} ${W}M${x + 70} 0L${x} ${W}`; }
  if (kind === 'Konzentrisch') for (let i = 8; i < 56; i += 9) s += `M${i} ${i}H${W - i}V${W - i}H${i}Z`;
  return `<svg viewBox="0 0 ${W} ${W}" role="img" aria-label="Füllmuster"><defs><clipPath id="${id}"><rect x="5" y="5" width="${W - 10}" height="${W - 10}"/></clipPath></defs><rect x="2" y="2" width="${W - 4}" height="${W - 4}" fill="#fff" stroke="${C.blue}" stroke-width="3"/><path d="${s}" clip-path="url(#${id})" stroke="#e8590c" stroke-width="2.4" fill="none"/></svg>`;
}

      { id: 'v1', type: 'table', title: 'Steckbrief', q: 'Vervollständige den Steckbrief der vier Verfahren.', corner: 'Verfahren',
        info: `<p><b>Stereolithografie (SLA):</b> In einem Becken liegt flüssiger Kunststoff (Harz). Knapp unter der Oberfläche sitzt eine Bauplattform. Ein Laser fährt die Form der ersten Schicht ab und härtet das Harz genau dort aus. Dann senkt sich die Plattform ein Stück, frisches Harz fließt darüber und der Laser härtet die nächste Schicht. Statt Harz geht auch Wachs oder flüssige Keramik.</p>
          <p><b>Selektives Lasersintern (SLS):</b> Eine Rolle verteilt eine dünne Schicht Pulver aus Kunststoff, Metall oder Quarzsand. Ein Laser schmilzt das Pulver nur an den Stellen, an denen das Modell entstehen soll. Danach kommt die nächste Pulverschicht.</p>
          <p><b>3D-Printing (3DP):</b> Auch hier wird Pulver verteilt, zum Beispiel Gips, Kunststoff oder Keramik. Ein Druckkopf – ähnlich wie beim Tintenstrahldrucker – spritzt ein flüssiges Bindemittel auf und verklebt das Pulver. Einen Laser oder eine Heizung braucht man dafür nicht.</p>
          <p><b>Fused Deposition Modeling (FDM):</b> Das Material ist ein dünner Kunststoffdraht (Filament) auf einer Rolle. Eine Heizdüse schmilzt ihn und legt ihn als feine Schnur auf die Bauplattform. Die Schnur kühlt ab und wird wieder fest.</p>`,

      { id: 'a4', type: 'gaps', title: 'Achsen und Bewegung',
        info: `<div class="split">${fig(G.axes)}<div><p>Ein 3D-Drucker bewegt sich in drei Richtungen:</p><ul class="il"><li><b>X:</b> links und rechts</li><li><b>Y:</b> vor und zurück</li><li><b>Z:</b> hoch und runter</li></ul>
          <p>Beim Ender 3 V2 fährt der <b>Druckkopf</b> auf der Querstange nach links und rechts. Die <b>Querstange</b> selbst wird an den Säulen hoch- und runtergefahren. Das <b>Druckbett</b> fährt vor und zurück.</p></div></div>`,
        text: 'Beim Ender 3 V2 bewegt sich der Druckkopf in {0}-Richtung (links/rechts). Die Traverse mit dem Druckkopf fährt in {1}-Richtung (hoch/runter). Das Druckbett bewegt sich in {2}-Richtung (vor/zurück).', gaps: [{ opts: ['X', 'Y', 'Z'], ans: 'X' }, { opts: ['X', 'Y', 'Z'], ans: 'Z' }, { opts: ['X', 'Y', 'Z'], ans: 'Y' }], explain: 'Zahnriemen bewegen Druckkopf (X) und Bett (Y), die Z-Achse fährt über eine Gewindespindel.' },
      { id: 'a5', type: 'mc', title: 'Bowden-Extruder', q: 'Was bedeutet „Bowden-Extruder“?',
        info: `${panels([[G.bowden, '<b>Bowden:</b> Der Extruder sitzt am Rahmen. Ein Schlauch führt das Filament zum Hotend. So ist es beim Ender 3 V2.'], [G.direct, '<b>Direktantrieb:</b> Der Extruder sitzt direkt auf dem Hotend und fährt mit.']])}<p>Vorteil von Bowden: Der Druckkopf ist leicht und kann schnell bewegt werden. Nachteil: Weiche Filamente lassen sich schlecht durch den langen Schlauch schieben.</p>`,

      { id: 's2', type: 'gaps', title: 'Fachbegriffe',
        info: `${chain(['3D-Modell (.stl)', 'Slicer (Cura)', 'G-Code (.gcode)', 'Drucker'])}<p><b>STL</b> ist das Dateiformat für die Form eines 3D-Modells. Ein <b>Slicer</b> („Schneider“) zerlegt das Modell in dünne Scheiben. Daraus entsteht der <b>G-Code</b>: eine lange Liste von Befehlen wie „fahre nach X 20, Y 35“ oder „heize auf 200 °C“, die nur der Drucker ausführt.</p>`,
        text: 'Ein 3D-Modell wird als {0}-Datei gespeichert. Der {1} zerlegt es in Schichten und erzeugt daraus den {2}, den nur der Drucker lesen kann.', gaps: [{ opts: ['STL', 'PDF', 'JPG'], ans: 'STL' }, { opts: ['Slicer', 'Extruder', 'Endstop'], ans: 'Slicer' }, { opts: ['G-Code', 'Quellcode', 'Barcode'], ans: 'G-Code' }] },
      { id: 's3', type: 'num', title: 'Schichten zählen', q: 'Wie viele Schichten druckt der Drucker?',
        info: `${fig(G.layers)}<p><b>Schichtdicke:</b> Eine kleine Schichtdicke (0,1 mm) ist sehr genau, dauert aber lange. Eine große Schichtdicke (0,3 mm) ist gröber, aber schneller. Üblich sind 0,1 bis 0,3 mm.</p><p><b>Anzahl der Schichten = Höhe ÷ Schichtdicke.</b> Beispiel: 20 mm ÷ 0,2 mm = 100 Schichten.</p>`,

      { id: 's4', type: 'mc', title: 'Passende Wanddicke', q: 'Die Düse des Ender 3 V2 hat 0,4 mm. Welche Wanddicke passt dazu ohne Lücken?',
        info: `${panels([[G.wall08, 'Zwei Bahnen passen genau.'], [G.wall10, 'Eine halbe Bahn kann die Düse nicht drucken – es bleibt eine Lücke.']])}<p>Die Düse legt immer eine Bahn von etwa 0,4 mm Breite. Die Wand besteht aus mehreren solcher Bahnen nebeneinander. Die Wanddicke sollte deshalb immer ein <b>Vielfaches von 0,4 mm</b> sein: 0,4 – 0,8 – 1,2 – 1,6 mm …</p>`,

        info: `<p><b>Anzahl der Bahnen = Wanddicke ÷ 0,4 mm</b> (Düsenbreite).</p><p><b>Wanddicke = Anzahl der Bahnen × 0,4 mm.</b></p><p>Beispiel: Eine Wand aus 2 Bahnen ist 2 × 0,4 mm = 0,8 mm dick.</p>`,

      { id: 's6', type: 'mc', title: 'Flach auf das Bett', q: 'Warum soll ein Objekt in Cura möglichst flach auf dem Druckbett liegen?',

        opts: ['Große Auflagefläche, gute Haftung und weniger Stützmaterial', 'Damit es schneller abkühlt', 'Damit der Drucker weniger Strom braucht', 'Damit die Düse nicht heiß wird'], ans: [0] },
      { id: 's7', type: 'lab', title: 'Slicer-Labor', q: 'Probiere die Parameter aus und erreiche alle drei Ziele. Die Anzeigen reagieren sofort.',

  {
    id: 'infill', short: 'Füllung', title: 'Die Füllung (Infill)',
    lead: 'Die Füllung bestimmt, wie stabil, schwer und zeitaufwendig dein Druck wird. Zwei Dinge musst du einstellen: die Fülldichte und das Füllmuster.',
    intro: () => `<div class="merke"><b class="t">Fülldichte</b>Standard sind <b>20 %</b>. Muss das Objekt nicht viel aushalten, reichen oft <b>10 %</b>. Stabile Teile druckt man häufig mit <b>30 %</b> oder mehr.</div>${CURA_BOX('infill')}`,

      { id: 'i2', type: 'sort', title: 'Muster einordnen', q: 'Ordne die Füllmuster der richtigen Gruppe zu.',
        info: `${panels([[`<div class="trio">${tile('lines', 0)}${tile('lines', 0)}${tile('lines', 0)}</div>`, '<b>2D:</b> Schicht 1, 2, 3 sehen gleich aus – die Linien liegen genau übereinander.'], [`<div class="trio">${tile('shift', 0)}${tile('shift', 5)}${tile('shift', 10)}</div>`, '<b>3D:</b> Von Schicht zu Schicht wandern die Linien – als wäre die Füllung gedreht.'], [`<div class="trio">${tile('conc')}</div>`, '<b>Konzentrisch:</b> Ringe folgen der Außenform.']])}
          <p>So sehen die Muster in Cura aus:</p><ul class="il">
          <li><b>Gitter:</b> Linien in zwei Richtungen bilden Quadrate, jede Schicht gleich.</li><li><b>Linien:</b> parallele Linien, jede Schicht gleich (abwechselnd gedreht).</li><li><b>Dreiecke:</b> drei Linienrichtungen bilden Dreiecke, jede Schicht gleich.</li><li><b>Zickzack:</b> eine durchgehende Zickzacklinie, jede Schicht gleich.</li>

          <li><b>Konzentrisch:</b> Ringe parallel zur Außenwand, die Linien sind nicht miteinander verbunden.</li></ul>` ,
        cats: ['2D-Füllmuster', '3D-Füllmuster', 'konzentrisch'],
        items: [{ text: 'Gitter', cat: 0 }, { text: 'Linien', cat: 0 }, { text: 'Dreiecke', cat: 0 }, { text: 'Zickzack', cat: 0 }, { text: 'Kubisch', cat: 1 }, { text: 'Octet', cat: 1 }, { text: 'Gyroid', cat: 1 }, { text: 'Viertelkubisch', cat: 1 }, { text: 'Konzentrisch', cat: 2 }],
        hint: 'Bei 3D-Mustern liegen die Linien nicht direkt übereinander, sondern versetzt.' },

/* ---------- Fortschritt ---------- */
function modStats(m) { let d = 0, a = 0; m.tasks.forEach(t => { const s = S.tasks[t.id]; if (s && s.done) { d++; if (s.assisted) a++; } }); return { done: d, total: m.tasks.length, assisted: a }; }
function overall() { let d = 0, t = 0; MODULES.forEach(m => { const s = modStats(m); d += s.done; t += s.total; }); return { done: d, total: t, pct: t ? Math.round(100 * d / t) : 0 }; }
function bestTest() { const a = S.test.attempts; if (!a.length) return null; return a.reduce((b, x) => x.score > b.score ? x : b, a[0]); }

/* ---------- Rahmen: Seitenleiste + Kopfleiste ---------- */
let route = { name: 'start' };
let curPbar = null;
function navItems() {
  const items = [{ href: '#/start', label: 'Start', key: 'start' }];
  MODULES.forEach((m, i) => { const s = modStats(m); items.push({ href: '#/m/' + m.id, label: `${i + 1}  ${m.short}`, key: 'm:' + m.id, cnt: `${s.done}/${s.total}`, done: s.done === s.total }); });
  const b = bestTest();
  items.push({ href: '#/test', label: 'Abschlusstest', key: 'test', cnt: b ? `${b.score}/${b.max}` : '', done: !!b });
  items.push({ href: '#/export', label: 'Export & Code', key: 'export' });
  return items;
}
function curKey() { return route.name === 'm' ? 'm:' + route.id : route.name; }
function refreshChrome() {
  const o = overall(); const lit = Math.round(o.pct / 100 * 14);
  const layers = h('div', { class: 'layers', 'aria-hidden': 'true' }, Array.from({ length: 14 }, (_, i) => h('i', { class: i < lit ? (i === lit - 1 ? 'on top' : 'on') : '' })));
  const nav = h('nav', { 'aria-label': 'Module' }, h('ul', null, navItems().map(it => h('li', null, h('a', { href: it.href, class: it.done ? 'done' : '', 'aria-current': curKey() === it.key ? 'page' : null }, it.label, it.cnt ? h('span', { class: 'cnt' }, it.cnt) : null)))));
  $('#side').replaceChildren(
    h('img', { class: 'slogo', src: LOGO_D, alt: 'Logo: dein Technik Lehrer' }),
    h('div', { class: 'brand' }, h('div', null, h('b', null, '3D-Druck mit dem Ender 3 V2'), h('small', null, 'Lernplattform Technik'))),
    h('div', { class: 'progwrap' }, layers, h('div', null, h('div', { class: 'pnum' }, o.pct + ' %'), h('small', null, `${o.done} von ${o.total} Aufgaben`))),
    nav,
    h('div', { class: 'sidefoot' }, h('button', { class: 'themebtn', type: 'button', onclick: toggleTheme }, 'Hell / Dunkel'), h('p', null, 'Dein Fortschritt bleibt in diesem Browser gespeichert.'))
  );
  $('#top').replaceChildren(
    h('div', { class: 'row' }, h('img', { class: 'tlogo', src: LOGO_D, alt: 'Logo: dein Technik Lehrer' }), h('b', null, 'Ender 3 V2'), h('span', { class: 'pct' }, o.pct + ' %')),
    h('div', { class: 'pills' }, navItems().map(it => h('a', { href: it.href, 'aria-current': curKey() === it.key ? 'page' : null }, it.label.replace('  ', ' '))))
  );
  if (curPbar && curPbar.update) curPbar.update();
}
function toggleTheme() {
  const cur = document.documentElement.getAttribute('data-theme');
  const sysDark = window.matchMedia && matchMedia('(prefers-color-scheme:dark)').matches;
  const next = cur ? (cur === 'dark' ? 'light' : 'dark') : (sysDark ? 'light' : 'dark');
  document.documentElement.setAttribute('data-theme', next); S.theme = next; save();
}
function toast(msg) { const t = h('div', { class: 'toast', role: 'status' }, msg); document.body.append(t); setTimeout(() => t.remove(), 3200); }
