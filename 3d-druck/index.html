<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>3D-Druck – Lernplattform</title>
<script defer src="../assets/jspdf.umd.min.js"></script>
<link rel="stylesheet" href="../assets/fonts/fonts.css">
<style>
:root{
  --blue:#035591; --blue-d:#023a63; --yellow:#F5B700; --yellow-soft:#fff3c9;
  --ink:#14232f; --muted:#56687a; --paper:#eef3f7; --card:#ffffff; --line:#d3dde6;
  --accent:#035591; --accent-ink:#ffffff; --link:#035591;
  --ok:#17803f; --ok-bg:#e2f4e8; --bad:#c23b2e; --bad-bg:#fce8e5; --miss:#b7791f; --miss-bg:#fff3d6;
  --stripe:rgba(3,85,145,.10);
  --f-head:'Barlow Condensed','Arial Narrow',Arial,sans-serif;
  --f-body:'Source Sans 3','Segoe UI',Helvetica,Arial,sans-serif;
  --pc0:#d9480f; --pc1:#1971c2; --pc2:#2b8a3e; --pc3:#9c36b5; --pc4:#c2255c; --pc5:#5c7c00;
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
}
:root:not([data-theme="light"]){}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#0d1922; --card:#152531; --ink:#e9f0f6; --muted:#9db1c1; --line:#2a4051;
    --accent:#3a8fd6; --accent-ink:#04121d; --link:#7fbdf0;
    --ok:#4cc37c; --ok-bg:#12321f; --bad:#ff8074; --bad-bg:#3a1a17; --miss:#f0b95a; --miss-bg:#3a2d10;
    --yellow-soft:#3a3010; --stripe:rgba(127,189,240,.10);
    --pc0:#ff9a5c; --pc1:#74b7ff; --pc2:#6fd68a; --pc3:#d59bf0; --pc4:#ff8fb5; --pc5:#b7d84a;
  }
}
:root[data-theme="dark"]{
  --paper:#0d1922; --card:#152531; --ink:#e9f0f6; --muted:#9db1c1; --line:#2a4051;
  --accent:#3a8fd6; --accent-ink:#04121d; --link:#7fbdf0;
  --ok:#4cc37c; --ok-bg:#12321f; --bad:#ff8074; --bad-bg:#3a1a17; --miss:#f0b95a; --miss-bg:#3a2d10;
  --yellow-soft:#3a3010; --stripe:rgba(127,189,240,.10);
  --pc0:#ff9a5c; --pc1:#74b7ff; --pc2:#6fd68a; --pc3:#d59bf0; --pc4:#ff8fb5; --pc5:#b7d84a;
}
*{box-sizing:border-box}
html{height:100%;scroll-padding-top:calc(var(--safe-t) + 70px)}
body{margin:0;min-height:100%;background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.55;padding-top:var(--safe-t);padding-bottom:var(--safe-b);-webkit-text-size-adjust:100%}
h1,h2,h3{font-family:var(--f-head);font-weight:700;line-height:1.1;margin:0;letter-spacing:.01em}
h1{font-size:clamp(2.4rem,6vw,3.6rem)} h2{font-size:clamp(1.9rem,4vw,2.5rem)} h3{font-size:1.45rem;font-weight:600}
p{margin:.6em 0} a{color:var(--link)}
button,select,input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--yellow);outline-offset:2px}
.hidden{display:none!important}
.task .lesen{border-left:6px solid var(--accent);background:var(--paper);padding:10px 16px;border-radius:0 6px 6px 0;margin:6px 0 14px}
.task .lesen p{margin:.45em 0}
.task .lesen figure,.task .lesen .panels{margin:8px 0}
.marktext{line-height:2.05;margin:.4em 0;word-spacing:.08em}
.marktext .tapp{cursor:pointer;background:var(--paper);border-bottom:2px dashed var(--muted);border-radius:3px;padding:2px 3px;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.marktext .tapp:focus-visible{outline:3px solid var(--accent);outline-offset:1px}
.marktext .tapp.on{background:var(--yellow-soft);border-bottom:2px solid var(--yellow)}
.marktext .tapp.ok{background:var(--ok-bg);border-bottom:2px solid var(--ok)}
.marktext .tapp.bad{background:var(--bad-bg);border-bottom:2px solid var(--bad)}
.marktext.locked .tapp{cursor:default}
textarea.opentext{display:block;width:100%;min-height:9em;font:inherit;line-height:1.45;padding:10px 12px;border:2px solid var(--line);border-radius:6px;background:var(--card);color:var(--ink);box-sizing:border-box}
textarea.opentext:focus{outline:3px solid var(--accent);outline-offset:1px}
.denk{background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:8px 14px;margin:0 0 10px}
.denk ul{margin:.3em 0 0;padding-left:1.2em}
details.muster{margin-top:12px}
.mbtn .pic svg{width:120px;max-width:100%;height:auto;display:block}
.testauftrag{font-weight:600;margin:0 0 14px}

/* Layout */
.app{display:grid;grid-template-columns:290px minmax(0,1fr);min-height:100vh}
.app>div{min-width:0}
aside{background:var(--blue-d);color:#eaf3fb;padding:22px 18px;position:sticky;top:0;height:100vh;overflow:auto;display:flex;flex-direction:column;gap:18px}
:root[data-theme="dark"] aside{background:#0a141c}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) aside{background:#0a141c}}
.brand{display:flex;gap:12px;align-items:flex-end}
.brand b{font-family:var(--f-head);font-size:1.55rem;line-height:1;font-weight:700;display:block}
.brand small{display:block;opacity:.75;font-size:.85rem;margin-top:4px}
.stack{flex:none}
nav ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
nav a{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:4px;color:#eaf3fb;text-decoration:none;font-weight:500;border-left:4px solid transparent}
nav a:hover{background:rgba(255,255,255,.08)}
nav a[aria-current="page"]{background:rgba(255,255,255,.14);border-left-color:var(--yellow);font-weight:700}
nav .cnt{margin-left:auto;font-size:.85rem;opacity:.8;font-variant-numeric:tabular-nums}
nav .done .cnt{color:var(--yellow);opacity:1;font-weight:700}
.sidefoot{margin-top:auto;font-size:.8rem;opacity:.7}
.themebtn{background:none;border:1px solid rgba(255,255,255,.3);color:#eaf3fb;border-radius:4px;padding:5px 10px;cursor:pointer;font-size:.85rem}
main{padding:34px clamp(16px,4vw,56px) 90px;max-width:1000px;width:100%}
.topbar{display:none}
@media (max-width:900px){
  .app{grid-template-columns:minmax(0,1fr)}
  aside{display:none}
  .topbar{display:block;position:sticky;top:0;z-index:20;background:var(--blue-d);color:#fff;padding:calc(8px + var(--safe-t)) 12px 8px}
  .topbar .row{display:flex;align-items:center;gap:10px}
  .topbar b{font-family:var(--f-head);font-size:1.25rem}
  .topbar .pct{margin-left:auto;font-variant-numeric:tabular-nums;font-size:.9rem;opacity:.9}
  .pills{display:flex;gap:6px;overflow-x:auto;padding:8px 0 2px;scrollbar-width:thin}
  .pills a{flex:none;color:#fff;text-decoration:none;padding:5px 12px;border-radius:999px;border:1px solid rgba(255,255,255,.35);font-size:.9rem;white-space:nowrap}
  .pills a[aria-current="page"]{background:var(--yellow);color:#14232f;border-color:var(--yellow);font-weight:700}
  html{scroll-padding-top:110px}
  body{padding-top:0}
}

/* Hero / module header */
.pagehead{margin-bottom:26px;padding-bottom:20px;border-bottom:3px solid transparent;border-image:repeating-linear-gradient(90deg,var(--blue) 0 14px,var(--yellow) 14px 20px) 1}
.pagehead .lead{font-size:1.15rem;color:var(--muted);max-width:62ch;margin-top:10px}
.hero{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,.95fr);gap:28px;align-items:center;margin-bottom:30px}
.hero .photo{background:#fff;border-radius:6px;border:1px solid var(--line);padding:10px;position:relative;overflow:hidden}
.hero .photo::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,transparent 0 9px,var(--stripe) 9px 10px);pointer-events:none}
.hero img{display:block;width:100%;height:auto}
@media(max-width:760px){.hero{grid-template-columns:minmax(0,1fr)}}
.facts{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px;margin:18px 0}
.fact{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--yellow);padding:10px 14px;border-radius:4px}
.fact b{display:block;font-family:var(--f-head);font-size:1.5rem;line-height:1.1;color:var(--accent)}
.fact span{font-size:.92rem;color:var(--muted)}

/* Buttons */
.btn{display:inline-flex;align-items:center;gap:8px;border:2px solid var(--accent);background:var(--accent);color:var(--accent-ink);padding:9px 18px;border-radius:4px;font-weight:600;cursor:pointer;text-decoration:none;min-height:44px}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;color:var(--accent)}
.btn.yellow{background:var(--yellow);border-color:var(--yellow);color:#14232f}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btnrow{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:14px}
.field{display:flex;flex-direction:column;gap:4px;flex:1 1 220px}
.field label{font-weight:600;font-size:.92rem}
.field input{padding:9px 12px;border:2px solid var(--line);border-radius:4px;background:var(--card);min-height:44px}
.field input:focus{border-color:var(--accent)}

/* Info blocks */
.card{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:18px 20px;margin:18px 0}
.merke{border-left:6px solid var(--yellow);background:var(--yellow-soft);padding:12px 16px;border-radius:0 6px 6px 0;margin:16px 0}
.merke b.t{font-family:var(--f-head);font-size:1.25rem;display:block;margin-bottom:2px}
.vgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px;margin:16px 0}
.vcard{background:var(--card);border:1px solid var(--line);border-top:5px solid var(--blue);border-radius:4px;padding:10px 14px 14px}
.vcard.me{border-top-color:var(--yellow);box-shadow:0 0 0 2px var(--yellow) inset}
.vcard h3{margin:2px 0 4px}
.vcard p{font-size:.95rem;margin:.3em 0}
.vcard svg{width:100%;height:auto;display:block;background:var(--paper);border-radius:3px}
.tag{display:inline-block;background:var(--yellow);color:#14232f;font-weight:700;font-size:.8rem;padding:1px 8px;border-radius:999px}
.s-tank{fill:none;stroke:var(--ink);stroke-width:2}.s-liq{fill:var(--blue);opacity:.35}.s-pow{fill:var(--blue);opacity:.25}
.s-plat{fill:var(--ink)}.s-model{fill:var(--yellow);stroke:var(--ink);stroke-width:1}.s-laser{stroke:#d9480f;stroke-width:2;stroke-dasharray:4 3}
.s-spot{fill:#d9480f}.s-line{stroke:var(--ink);stroke-width:2;fill:none}.s-noz{fill:var(--ink)}.s-fil{stroke:var(--accent);stroke-width:3;fill:none}
.s-dot{fill:var(--blue)}.s-txt{font:600 9px var(--f-body);fill:var(--ink)}

/* Tasks */
.task{background:var(--card);border:1px solid var(--line);border-left:7px solid var(--accent);border-radius:4px;padding:16px 18px 18px;margin:22px 0;transition:border-color .2s}
.task.done{border-left-color:var(--ok)}
.task.assisted{border-left-color:var(--miss)}
.task .th{display:flex;align-items:baseline;gap:10px;margin-bottom:6px}
.task .th h3{margin:0}
.task .state{margin-left:auto;font-size:.85rem;font-weight:700;color:var(--ok)}
.task.assisted .state{color:var(--miss)}
.task .q{margin:.2em 0 .8em}
.figure{margin:10px 0 14px}.figure svg,.figure img{max-width:100%;height:auto}
.fb{margin-top:12px;font-weight:600}
.fb .msg{display:block;padding:10px 14px;border-radius:4px;border-left:5px solid}
.fb .good{background:var(--ok-bg);border-color:var(--ok);color:var(--ink)}
.fb .warn{background:var(--miss-bg);border-color:var(--miss);color:var(--ink)}
.fb .bad{background:var(--bad-bg);border-color:var(--bad);color:var(--ink)}
.fb .why{display:block;font-weight:400;margin-top:4px}

/* MC */
.opts{display:flex;flex-direction:column;gap:8px}
.opt{position:relative;display:flex;gap:12px;align-items:flex-start;border:2px solid var(--line);border-radius:4px;padding:10px 12px;cursor:pointer;background:var(--card)}
.opt:hover{border-color:var(--accent)}
.opt input{position:absolute;opacity:0;pointer-events:none}
.opt .mark{flex:none;width:22px;height:22px;border:2px solid var(--muted);border-radius:50%;margin-top:2px;display:grid;place-items:center}
.opt.multi .mark{border-radius:4px}
.opt input:checked + .mark{background:var(--accent);border-color:var(--accent)}
.opt input:checked + .mark::after{content:"";width:8px;height:8px;background:var(--accent-ink);border-radius:50%}
.opt.multi input:checked + .mark::after{border-radius:1px;width:10px;height:10px}
.opt input:focus-visible + .mark{outline:3px solid var(--yellow);outline-offset:2px}
.opt.ok{border-color:var(--ok);background:var(--ok-bg)}.opt.bad{border-color:var(--bad);background:var(--bad-bg)}.opt.miss{border-color:var(--miss);border-style:dashed}
.opt.locked{cursor:default}
.hintline{font-size:.9rem;color:var(--muted);margin:0 0 8px}

/* gaps + table */
.gaptext{line-height:2.4;margin:.2em 0}
select.gap,input.gap,.grid select{border:2px solid var(--line);border-radius:4px;padding:5px 8px;background:var(--card);min-height:38px;max-width:100%;margin:0 4px}
input.gap{min-width:90px}
select.gap:focus,input.gap:focus,.grid select:focus{border-color:var(--accent)}
.gap.ok,.grid select.ok,input.num.ok{border-color:var(--ok)!important;background:var(--ok-bg)!important}
.gap.bad,.grid select.bad,input.num.bad{border-color:var(--bad)!important;background:var(--bad-bg)!important}
.tscroll{overflow-x:auto}
table.grid{border-collapse:collapse;width:100%;min-width:560px}
.grid th,.grid td{border:1px solid var(--line);padding:8px 8px;text-align:left;vertical-align:middle}
.grid thead th{background:var(--accent);color:var(--accent-ink);font-family:var(--f-head);font-size:1.1rem;font-weight:600}
.grid tbody th{background:var(--paper);font-weight:700;min-width:120px}
.grid select{width:100%;margin:0}
.grid .pic svg{width:130px;height:auto;display:block;background:#fff;border-radius:3px}

/* order */
ol.ord{list-style:none;counter-reset:o;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
ol.ord li{counter-increment:o;display:flex;gap:10px;align-items:center;border:2px solid var(--line);border-radius:4px;padding:8px 10px;background:var(--card)}
ol.ord li::before{content:counter(o);flex:none;width:28px;height:28px;border-radius:50%;background:var(--paper);border:2px solid var(--line);display:grid;place-items:center;font-weight:700;font-size:.9rem}
ol.ord li.ok{border-color:var(--ok);background:var(--ok-bg)}ol.ord li.bad{border-color:var(--bad);background:var(--bad-bg)}
.ordbtns{margin-left:auto;display:flex;gap:4px}
.ib{width:38px;height:38px;border:2px solid var(--line);background:var(--card);border-radius:4px;cursor:pointer;font-size:.9rem}
.ib:hover:not(:disabled){border-color:var(--accent)}.ib:disabled{opacity:.35;cursor:default}

/* match */
.match{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px 26px}
.mbtn{overflow-wrap:anywhere;hyphens:auto}
.mcol{display:flex;flex-direction:column;gap:8px}
.mbtn{position:relative;text-align:left;border:2px solid var(--line);background:var(--card);border-radius:4px;padding:9px 12px 9px 42px;cursor:pointer;min-height:48px}
.mbtn .bd{position:absolute;left:8px;top:50%;transform:translateY(-50%);width:26px;height:26px;border-radius:50%;background:var(--paper);border:2px solid var(--line);display:grid;place-items:center;font-weight:700;font-size:.85rem}
.mbtn.sel{border-color:var(--yellow);box-shadow:0 0 0 3px var(--yellow)}
.mbtn.paired{border-color:var(--c)}.mbtn.paired .bd{background:var(--c);border-color:var(--c);color:#fff}
.mbtn.ok{background:var(--ok-bg)}.mbtn.bad{background:var(--bad-bg)}
@media(max-width:620px){.match{gap:8px 10px;font-size:.95rem}}

/* sort */
.pool,.bin .chips{display:flex;flex-wrap:wrap;gap:8px;min-height:44px}
.pool{border:2px dashed var(--line);border-radius:6px;padding:8px;margin-bottom:12px}
.bins{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.bin{border:2px solid var(--blue);border-radius:6px;padding:8px 10px 10px;background:var(--card);cursor:pointer}
.bin h4{margin:0 0 6px;font-family:var(--f-head);font-size:1.25rem;color:var(--accent)}
.bin.target{box-shadow:0 0 0 3px var(--yellow)}
.chip{border:2px solid var(--line);background:var(--paper);border-radius:999px;padding:5px 14px;cursor:pointer;font-weight:600}
.chip.sel{background:var(--yellow);border-color:var(--yellow);color:#14232f}
.chip.ok{background:var(--ok-bg);border-color:var(--ok)}.chip.bad{background:var(--bad-bg);border-color:var(--bad)}

/* label image */
.imgwrap{position:relative;background:#fff;border:1px solid var(--line);border-radius:6px;max-width:640px;margin:0 auto}
.imgwrap img{display:block;width:100%;height:auto;border-radius:6px}
.mk{position:absolute;transform:translate(-50%,-50%);width:32px;height:32px;border-radius:50%;border:3px solid #fff;background:var(--yellow);color:#14232f;font-weight:800;cursor:pointer;box-shadow:0 1px 5px rgba(0,0,0,.5);display:grid;place-items:center;padding:0;font-size:.95rem}
.mk.set{background:var(--accent);color:var(--accent-ink)}
.mk.ok{background:var(--ok);color:#fff}.mk.bad{background:var(--bad);color:#fff}
.lbl{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:8px;margin-top:14px}
.lbl button{display:flex;gap:10px;align-items:center;text-align:left;border:2px solid var(--line);background:var(--card);border-radius:4px;padding:6px 10px;cursor:pointer;min-height:44px}
.lbl button .n{flex:none;width:26px;height:26px;border-radius:50%;background:var(--yellow);color:#14232f;font-weight:800;display:grid;place-items:center;font-size:.85rem}
.lbl button.set .n{background:var(--accent);color:var(--accent-ink)}
.lbl button.ok{border-color:var(--ok);background:var(--ok-bg)}.lbl button.bad{border-color:var(--bad);background:var(--bad-bg)}
.lbl .empty{color:var(--muted)}
.overlay{position:fixed;inset:0;background:rgba(5,15,25,.6);display:grid;place-items:center;z-index:50;padding:16px}
.pop{background:var(--card);border-radius:8px;max-width:440px;width:100%;max-height:86vh;overflow:auto;padding:16px 18px;box-shadow:0 10px 40px rgba(0,0,0,.5)}
.pop h3{margin-bottom:10px}
.pop .tl{display:flex;flex-direction:column;gap:6px}
.pop .tl button{text-align:left;border:2px solid var(--line);background:var(--card);border-radius:4px;padding:9px 12px;cursor:pointer;min-height:44px}
.pop .tl button:hover:not(:disabled){border-color:var(--accent)}
.pop .tl button:disabled{opacity:.4;text-decoration:line-through;cursor:default}

/* num */
.numrow{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin:8px 0}
.numrow .ql{flex:1 1 260px}
input.num{width:110px;border:2px solid var(--line);border-radius:4px;padding:7px 10px;background:var(--card);min-height:42px;text-align:right}
input.num:focus{border-color:var(--accent)}
.unit{color:var(--muted)}

<div class="app">

</div>
<script>

'use strict';
/* ---------- Helfer ---------- */
const $ = (s, el = document) => el.querySelector(s);
function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  if (attrs) for (const k in attrs) {
    const v = attrs[k];
    if (v == null || v === false) continue;
    if (k === 'class') el.className = v;
    else if (k === 'html') el.innerHTML = v;
    else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else el.setAttribute(k, v === true ? '' : v);
  }
  for (const c of kids.flat(Infinity)) { if (c == null || c === false) continue; el.append(c.nodeType ? c : document.createTextNode(c)); }
  return el;
}
function shuffle(a) { const b = a.slice(); for (let i = b.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [b[i], b[j]] = [b[j], b[i]]; } return b; }
function shuffleNotSame(a) { let b, n = 0; do { b = shuffle(a); n++; } while (n < 25 && b.every((x, i) => x === a[i])); return b; }
const norm = s => String(s).toLowerCase().trim().replace(/ä/g, 'ae').replace(/ö/g, 'oe').replace(/ü/g, 'ue').replace(/ß/g, 'ss').replace(/\s+/g, ' ');
const parseNum = s => { const v = parseFloat(String(s).replace(',', '.').replace(/[^\d.\-]/g, '')); return isNaN(v) ? null : v; };
const fmtMin = m => { m = Math.round(m); const hh = Math.floor(m / 60), mm = m % 60; return hh ? `${hh} h ${String(mm).padStart(2, '0')} min` : `${mm} min`; };
const strip = s => String(s).replace(/<[^>]+>/g, '');

/* ---------- Speicher (nur im Browser, mit Absicherung) ---------- */
const KEY = 'ender3v2-lernplattform-v1';
let S = { name: '', klasse: '', tasks: {}, test: { attempts: [] } };
function load() { try { const r = localStorage.getItem(KEY); if (r) { const o = JSON.parse(r); S = Object.assign(S, o); S.tasks = S.tasks || {}; S.test = S.test || { attempts: [] }; } } catch (e) { } }
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { } }
function tst(id) { return S.tasks[id] || (S.tasks[id] = { done: false, assisted: false, attempts: 0 }); }

/* ---------- Aufgaben-Rahmen ---------- */
const TYPES = {};
const TASKCACHE = {};
function buildTask(t, nr) {
  if (TASKCACHE[t.id]) return TASKCACHE[t.id];
  const st = tst(t.id);
  const card = h('section', { class: 'task', id: 't-' + t.id });
  const state = h('span', { class: 'state' });
  const fb = h('div', { class: 'fb', 'aria-live': 'polite' });
  const ctx = { finish: null };
  const impl = TYPES[t.type](t, ctx);
  const bCheck = h('button', { class: 'btn', type: 'button' }, 'Prüfen');
  const bReveal = h('button', { class: 'btn ghost hidden', type: 'button' }, 'Lösung anzeigen');
  const bReset = h('button', { class: 'btn ghost', type: 'button' }, 'Zurücksetzen');
  const explain = () => t.explain ? `<span class="why">${t.explain}</span>` : '';
  const say = (cls, msg, extra = '') => { fb.innerHTML = `<span class="msg ${cls}">${msg}${extra}</span>`; };
  const paintState = () => {
    card.classList.toggle('done', st.done && !st.assisted);
    card.classList.toggle('assisted', st.done && st.assisted);
    state.textContent = st.done ? (st.assisted ? 'mit Lösungshilfe' : 'gelöst ✓') : '';
    refreshChrome();
  };
  bCheck.onclick = () => {
    const r = impl.check();
    st.attempts++; window.LP&&LP.result(t.id,!!r.ok,((document.querySelector('.pagehead h1')||{}).textContent||'').replace(/^\s*\d+\s+/,'')+' · Aufgabe '+nr+(t.title?': '+t.title:''),card);
    if (r.ok) {
      const firstTime = !st.done;
      st.done = true; if (firstTime) st.assisted = false;
      impl.lock && impl.lock();
      say('good', r.msg || 'Richtig! Alles stimmt.', explain());
      bCheck.classList.add('hidden'); bReveal.classList.add('hidden');
    } else {
      let m = r.msg || (r.total > 1 ? `${r.right} von ${r.total} stimmen. Schau dir die markierten Stellen noch einmal an.` : 'Das stimmt noch nicht. Lies noch einmal genau.');
      if (t.hint) m += `<span class="why">Tipp: ${t.hint}</span>`;
      say('bad', m);
      if (st.attempts >= 2) bReveal.classList.remove('hidden');
    }
    save(); paintState();
  };
  bReveal.onclick = () => {
    impl.reveal(); impl.lock && impl.lock();
    if (!st.done) { st.assisted = true; window.LP&&LP.assist(t.id); }
    st.done = true;
    say('warn', 'So sieht die Lösung aus. Das zählt als „mit Lösungshilfe“ – versuche die Aufgabe später noch einmal ohne Hilfe.', explain());
    bCheck.classList.add('hidden'); bReveal.classList.add('hidden');
    save(); paintState();
  };
  bReset.onclick = () => {
    impl.reset(); fb.innerHTML = '';
    bCheck.classList.remove('hidden'); if (st.attempts < 2) bReveal.classList.add('hidden');
  };
  ctx.finish = () => { if (!st.done) { st.done = true; st.assisted = false; save(); paintState(); } };
  card.append(...[
    h('div', { class: 'th' }, h('h3', null, `Aufgabe ${nr}`), h('span', { class: 't-title' }, t.title || ''), state),
    t.lesen ? h('div', { class: 'info-box lesen', html: t.lesen }) : null,
    t.info ? h('details', { class: 'info' }, h('summary', null, 'Info zur Aufgabe'), h('div', { class: 'infobody', html: t.info })) : null,
    t.q ? h('p', { class: 'q', html: t.q }) : null,
    impl.el,
    impl.auto ? null : h('div', { class: 'btnrow' }, bCheck, bReveal, bReset),
    fb
  ].filter(Boolean));
  if (st.done) {
    if (impl.auto) { impl.restoreDone && impl.restoreDone(); }
    else {
      impl.reveal(); impl.lock && impl.lock();
      say(st.assisted ? 'warn' : 'good', st.assisted ? 'Bereits mit Lösungshilfe bearbeitet. Du kannst „Zurücksetzen“ drücken und es noch einmal versuchen.' : 'Bereits gelöst. Mit „Zurücksetzen“ kannst du nochmal üben.', explain());
      bCheck.classList.add('hidden');
    }
    paintState();
  }
  // Nach „Zurücksetzen“ muss Prüfen wieder erscheinen:
  const origReset = bReset.onclick;
  bReset.onclick = () => { origReset(); bCheck.classList.remove('hidden'); impl.unlock && impl.unlock(); };
  TASKCACHE[t.id] = card;
  return card;
}

/* ---------- Aufgabentypen ---------- */
// Einfach- und Mehrfachauswahl
TYPES.mc = (t) => {
  const multi = t.ans.length > 1;
  let opts = t.opts.map((text, i) => ({ text, i, ok: t.ans.includes(i) }));
  if (!t.fixed) opts = shuffle(opts);
  const name = 'q_' + t.id;
  const rows = opts.map(o => {
    const inp = h('input', { type: multi ? 'checkbox' : 'radio', name });
    const row = h('label', { class: 'opt' + (multi ? ' multi' : '') }, inp, h('span', { class: 'mark' }), h('span', { html: o.text }));
    return { o, inp, row };
  });
  const el = h('div', null, multi ? h('p', { class: 'hintline' }, 'Mehrere Antworten sind richtig.') : null, h('div', { class: 'opts' }, rows.map(r => r.row)));
  const clear = () => rows.forEach(r => r.row.classList.remove('ok', 'bad', 'miss'));
  rows.forEach(r => r.inp.addEventListener('change', clear));
  return {
    el,
    check() {
      clear(); let right = 0, allOk = true;
      rows.forEach(r => {
        const s = r.inp.checked, good = s === r.o.ok;
        if (good) right++; else allOk = false;
        if (s && r.o.ok) r.row.classList.add('ok');
        else if (s && !r.o.ok) r.row.classList.add('bad');
        else if (!s && r.o.ok && multi) r.row.classList.add('miss');
      });
      if (!multi) { const any = rows.some(r => r.inp.checked); return { ok: allOk, right: allOk ? 1 : 0, total: 1, msg: any ? null : 'Wähle zuerst eine Antwort aus.' }; }
      return { ok: allOk, right, total: rows.length, msg: allOk ? null : 'Nicht ganz: Gestrichelt markiert sind richtige Antworten, die noch fehlen. Rot sind falsch angekreuzt.' };
    },
    reveal() { clear(); rows.forEach(r => { r.inp.checked = r.o.ok; if (r.o.ok) r.row.classList.add('ok'); }); },
    lock() { rows.forEach(r => { r.inp.disabled = true; r.row.classList.add('locked'); }); },
    unlock() { rows.forEach(r => { r.inp.disabled = false; r.row.classList.remove('locked'); }); },
    reset() { clear(); rows.forEach(r => { r.inp.checked = false; }); }
  };
};

// Lückentext (Auswahl oder freie Eingabe)
TYPES.gaps = (t) => {
  const parts = t.text.split(/\{(\d+)\}/); const ctrls = [];
  const p = h('p', { class: 'gaptext' });
  parts.forEach((s, i) => {
    if (i % 2 === 0) { if (s) p.append(h('span', { html: s })); return; }
    const g = t.gaps[+s]; let c;
    if (g.opts) c = h('select', { class: 'gap', 'aria-label': 'Lücke ' + (+s + 1) }, h('option', { value: '' }, '…'), shuffle(g.opts).map(o => h('option', { value: o }, o)));
    else c = h('input', { class: 'gap', type: 'text', size: g.size || 10, autocomplete: 'off', autocapitalize: 'off', spellcheck: 'false', 'aria-label': 'Lücke ' + (+s + 1) });
    c.addEventListener('input', () => c.classList.remove('ok', 'bad')); c.addEventListener('change', () => c.classList.remove('ok', 'bad'));
    ctrls.push({ c, g }); p.append(c);
  });
  const acc = g => (Array.isArray(g.ans) ? g.ans : [g.ans]).map(norm);
  return {
    el: p,
    check() { let right = 0; ctrls.forEach(({ c, g }) => { const ok = c.value && acc(g).includes(norm(c.value)); c.classList.remove('ok', 'bad'); c.classList.add(ok ? 'ok' : 'bad'); if (ok) right++; }); return { ok: right === ctrls.length, right, total: ctrls.length }; },
    reveal() { ctrls.forEach(({ c, g }) => { c.value = Array.isArray(g.ans) ? g.ans[0] : g.ans; c.classList.remove('bad'); c.classList.add('ok'); }); },
    lock() { ctrls.forEach(({ c }) => c.disabled = true); }, unlock() { ctrls.forEach(({ c }) => c.disabled = false); },
    reset() { ctrls.forEach(({ c }) => { c.value = ''; c.classList.remove('ok', 'bad'); }); }
  };
};

function labCalc(p) {
  const H = 30, Sd = 30;
  const lines = Math.max(1, Math.floor(p.wall / 0.4 + 1e-6));

  const vShell = (Sd * Sd - inner * inner) * H;
  const vTB = 2 * 0.8 * inner * inner;
  const vInf = inner * inner * Math.max(0, H - 1.6) * (p.infill / 100);
  const V = vShell + vTB + vInf;
  const flow = p.speed * p.layer * 0.4 * 0.55;
  const layers = Math.round(H / p.layer);
  const sec = V / flow + layers * 2.5;
  const grams = V * 1.24e-3;
  const stab = 100 * (0.5 * Math.sqrt(Math.min(wallT / 2.4, 1)) + 0.5 * Math.sqrt(Math.min(p.infill / 60, 1)));
  const qual = Math.max(0, Math.min(100, 100 - 60 * (p.layer - 0.1) / 0.2 - Math.max(0, p.speed - 40) * 0.5));
  return { lines, wallT, minutes: sec / 60, grams, layers, stab, qual, eff: p.wall / 0.4 - lines > 1e-6 };
}

  if (kind === 'conc') for (let i = 10; i < 58; i += 10) s += `M${i} ${i}H${W - i}V${W - i}H${i}Z`;
  if (kind === 'shift') { const o = dens; for (let i = -W; i < 2 * W; i += 16) s += `M${i + o} 6L${i + o + 40} ${W - 6}`; }

  {
    id: 'verfahren', short: 'Verfahren', title: 'Druckverfahren im Vergleich',
    lead: `Alle 3D-Drucker bauen Modelle Schicht für Schicht auf. Wie sie das tun, unterscheidet sich aber stark – und daran erkennst du, warum FDM-Drucker wie der ${P.name} in Schulen so beliebt sind.`,
    intro: () => `
      <div class="merke"><b class="t">Grundprinzip</b>Jede Schicht muss fest mit der Schicht darunter verbunden werden. Das gelingt mit einem Laser, einer Heizdüse oder mit Klebstoff.</div>
      <div class="vgrid two">
        <div class="vcard">${G.SLA}<h3>SLA</h3><p><b>Stereolithografie.</b> Ein Laser härtet flüssiges Material Schicht für Schicht aus. Sehr glatte Oberfläche.</p></div>
        <div class="vcard">${G.SLS}<h3>SLS</h3><p><b>Selektives Lasersintern.</b> Ein Laser schmilzt Pulver punktuell zusammen. Oberfläche eher rau.</p></div>
        <div class="vcard">${G.DP}<h3>3D-Printing (3DP)</h3><p>Ein Druckkopf trägt Bindemittel auf Pulver auf und verklebt es. Gute Oberfläche.</p></div>
        <div class="vcard me">${G.FDM}<h3>FDM <span class="tag">${P.name}</span></h3><p><b>Fused Deposition Modeling.</b> Filament wird in einer Heizdüse geschmolzen und Schnur für Schnur abgelegt.</p></div>
      </div>`,
    tasks: [
      { id: 'v1', type: 'sort', title: 'Steckbrief', q: 'Ordne jedes Merkmal dem Verfahren zu, zu dem es gehört.',
        lesen: `<p><b>Stereolithografie (SLA):</b> In einem Becken liegt flüssiger Kunststoff (Harz). Knapp unter der Oberfläche sitzt eine Bauplattform. Ein Laser fährt die Form der ersten Schicht ab und härtet das Harz genau dort aus. Dann senkt sich die Plattform ein Stück, frisches Harz fließt darüber und der Laser härtet die nächste Schicht. Statt Harz geht auch Wachs oder flüssige Keramik.</p>
          <p><b>Selektives Lasersintern (SLS):</b> Eine Rolle verteilt eine dünne Schicht Pulver aus Kunststoff, Metall oder Quarzsand. Ein Laser schmilzt das Pulver nur an den Stellen, an denen das Modell entstehen soll. Danach kommt die nächste Pulverschicht.</p>
          <p><b>3D-Printing (3DP):</b> Auch hier wird Pulver verteilt, zum Beispiel Gips, Kunststoff oder Keramik. Ein Druckkopf – ähnlich wie beim Tintenstrahldrucker – spritzt ein flüssiges Bindemittel auf und verklebt das Pulver. Einen Laser oder eine Heizung braucht man dafür nicht.</p>
          <p><b>Fused Deposition Modeling (FDM):</b> Das Material ist ein dünner Kunststoffdraht (Filament) auf einer Rolle. Eine Heizdüse schmilzt ihn und legt ihn als feine Schnur auf die Bauplattform. Die Schnur kühlt ab und wird wieder fest.</p>`,
        cats: ['SLA', 'SLS', '3D-Printing (3DP)', 'FDM'],
        items: [{ text: 'Laser härtet Flüssigkeit aus', cat: 0 }, { text: 'Wachs oder flüssige Keramik', cat: 0 }, { text: 'Plattform senkt sich ins Becken', cat: 0 },
          { text: 'Laser schmilzt Pulver', cat: 1 }, { text: 'Metallpulver oder Quarzsand', cat: 1 },
          { text: 'Gipspulver', cat: 2 }, { text: 'Bindemittel aus einem Druckkopf', cat: 2 }, { text: 'ohne Laser und ohne Heizung', cat: 2 },
          { text: 'Kunststoffdraht von der Rolle', cat: 3 }, { text: 'Heizdüse schmilzt das Material', cat: 3 }],
        hint: 'Lies jeden Abschnitt mit zwei Fragen im Kopf: Wie sieht das Material vorher aus, und was verbindet die Schichten?', explain: 'Nur bei 3DP wird das Pulver verklebt statt geschmolzen oder ausgehärtet – deshalb braucht es dort keine Energiequelle wie einen Laser.' },
      { id: 'v2', type: 'match', title: 'Verfahren erkennen', q: 'Ordne jede Beschreibung dem passenden Verfahren zu.',
        info: `<p><b>SLA:</b> Das Modell wächst in einem Bad aus flüssigem Kunststoff. Wo der Laserstrahl auftrifft, wird die Flüssigkeit fest.</p>
          <p><b>SLS:</b> Ein Laserstrahl erhitzt feines Pulver so stark, dass die Körner an diesen Stellen miteinander verschmelzen. Das übrige Pulver bleibt lose liegen.</p>
          <p><b>3D-Printing (3DP):</b> Ein Druckkopf tropft Klebstoff auf eine Pulverschicht. Die Körner verkleben, ohne dass etwas erhitzt wird.</p>
          <p><b>FDM:</b> Ein Kunststoffstrang wird in einer heißen Düse weich und Bahn für Bahn abgelegt. Beim Abkühlen wird er wieder fest.</p>`,
        pairs: [['Lose Körner werden verbunden, ohne dass Wärme im Spiel ist.', '3D-Printing (3DP)'], ['Aus einer Flüssigkeit entsteht durch Licht ein fester Körper.', 'SLA'], ['Ein Lichtstrahl macht Körner so heiß, dass sie zusammenfließen.', 'SLS'], ['Ein erwärmter Strang wird wie mit einer Heißklebepistole aufgetragen.', 'FDM']],
        explain: 'Merkhilfe: SLA = flüssig + Laser, SLS = Pulver + Laser, 3DP = Pulver + Kleber, FDM = Draht + Heizdüse.' },
      { id: 'v3', type: 'mark', title: 'Laser gesucht', q: 'Ermittle, welche Anlagen mit einem Laser arbeiten: Tippe die passenden Sätze an.',
        info: `<p>Ein <b>Laser</b> bündelt Licht so stark, dass er Material punktgenau aushärten oder schmelzen kann. Der Bericht nennt die Verfahren nicht. Erkenne sie am <b>Material</b> und an der <b>Arbeitsweise</b>. Die Beschreibungen stehen bei Aufgabe 1.</p>`,
        parts: ['Bei einem Besuch in einem Fertigungsbetrieb siehst du sechs Anlagen. ', ['Anlage A verteilt eine dünne Schicht Quarzsand und verschmilzt die Körner nur dort, wo später eine Gussform entsteht.', 1], ' ', ['Anlage B zieht Kunststoffdraht von einer Rolle und legt ihn als feine Schnur ab.', 0], ' ', ['In Anlage C senkt sich eine Plattform nach jeder Schicht tiefer in ein Becken mit flüssigem Harz.', 1], ' ', ['Anlage D tropft aus vielen feinen Düsen Bindemittel auf ein Bett aus Gipspulver.', 0], ' ', ['Anlage E verschmilzt Metallpulver Punkt für Punkt zu einem Ersatzteil.', 1], ' ', ['Anlage F verklebt Keramikpulver Schicht für Schicht zu einer Vase.', 0]],
        hint: 'Überlege bei jedem Satz zuerst, welches Verfahren gemeint ist. Mit Laser arbeiten zwei der vier Verfahren.', explain: 'A und E sind SLS (Laser schmilzt Pulver), C ist SLA (Laser härtet Harz). B ist FDM (Heizdüse), D und F sind 3DP (Bindemittel).' },
      { id: 'v4', type: 'order', title: 'Vom günstigsten zum teuersten', q: 'Ordne die Verfahren nach den Anschaffungskosten eines typischen Geräts – oben das günstigste.',
        lesen: `<p>Warum kosten manche 3D-Drucker weniger als ein Fahrrad und andere mehr als ein Auto? Teuer sind vor allem drei Dinge: ein starker <b>Laser</b> mit Spiegeln, die ihn sehr genau lenken, eine geschlossene <b>Kammer</b>, in der feines Pulver sicher verarbeitet wird, und eine aufwendige <b>Nachbearbeitung</b>, bei der die Teile gereinigt oder nachgehärtet werden.</p>
          <p>Eine Anlage für <b>3D-Printing</b> braucht keinen Laser. Sie muss aber Pulver gleichmäßig verteilen und das Bindemittel mit vielen feinen Düsen genau dosieren. Ein typisches Gerät kostet rund 45.000 €.</p>
          <p>Bei der <b>Stereolithografie</b> lenkt ein Laser seinen Strahl durch ein Becken mit Harz. Das Harz ist teuer, und die fertigen Teile müssen gewaschen und unter UV-Licht nachgehärtet werden. Ein solches Gerät kostet fast doppelt so viel wie die 3DP-Anlage, rund 80.000 €.</p>
          <p><b>FDM</b> kommt mit wenigen, einfachen Bauteilen aus: Motoren, Riemen, eine beheizte Düse und ein Druckbett. Ein Gerät für die Schule kostet um 2.000 €, einfache Bausätze deutlich weniger.</p>
          <p>Am meisten kostet <b>SLS</b>. Hier arbeiten ein starker Laser und eine beheizte, geschlossene Pulverkammer zusammen. Für ein typisches Gerät rechnet man mit etwa 150.000 €.</p>
          <p class="hintline">Richtwerte aus Unterrichtsmaterial, gerundet. Marktpreise ändern sich.</p>`,
        items: ['FDM', '3D-Printing (3DP)', 'SLA', 'SLS'], hint: 'Suche im Text zu jedem Verfahren den Preis. Bei einem Verfahren steht er als Vergleich mit einem anderen.',
        explain: `FDM ist mit Abstand am günstigsten, SLS am teuersten.${hbars([['FDM', 2000, '2.000 €'], ['3DP', 45000, '45.000 €'], ['SLA', 80000, '80.000 €'], ['SLS', 150000, '150.000 €']], 150000)}` },
      { id: 'v5', type: 'gaps', title: `Steckbrief ${P.name}`, q: `Nenne die fehlenden Angaben zum ${P.name}. Alles steht im Text.`,
        lesen: PV({
          ender: `<p>Im Technikraum steht ein Ender 3 V2. Bevor du ihn nutzt, liest du die Beschreibung des Herstellers, hier in eigenen Worten:</p>
          <p>Gedruckt wird auf einer Glasplatte, die bis 100 °C warm werden kann. Darauf entsteht das Modell Bahn für Bahn: Ein Motor schiebt einen Kunststoffdraht durch einen Schlauch in den Druckkopf. Dort schmilzt eine Heizung den Draht, und eine Düse mit einer Öffnung von 0,4 mm legt ihn ab. Der Draht – Fachleute nennen ihn <b>Filament</b> – ist 1,75 mm dick und kommt von einer Rolle, die oben am Rahmen hängt.</p>
          <p>Weil das Material geschmolzen und Schicht für Schicht abgelegt wird, gehört der Drucker zum Verfahren <b>Fused Deposition Modeling</b>, kurz FDM. Manche Hersteller schreiben stattdessen FFF (Fused Filament Fabrication), gemeint ist dasselbe. Die Düse wird bis 255 °C heiß. Das größte Modell darf 220 mm breit, 220 mm tief und 250 mm hoch sein.</p>`,
          cr10: `<p>Im Technikraum steht ein CR-10 S Pro. Bevor du ihn nutzt, liest du die Beschreibung des Herstellers, hier in eigenen Worten:</p>
          <p>Gedruckt wird auf einer Glasplatte mit einer Druckfolie, die bis 100 °C warm werden kann. Darauf entsteht das Modell Bahn für Bahn: Ein Motor mit zwei Zahnrädern schiebt einen Kunststoffdraht durch einen blauen Schlauch in den Druckkopf. Dort schmilzt eine Heizung den Draht, und eine Düse mit einer Öffnung von 0,4 mm legt ihn ab. Der Draht – Fachleute nennen ihn <b>Filament</b> – ist 1,75 mm dick und kommt von einer Rolle, die oben auf dem Rahmen sitzt.</p>
          <p>Weil das Material geschmolzen und Schicht für Schicht abgelegt wird, gehört der Drucker zum Verfahren <b>Fused Deposition Modeling</b>, kurz FDM. Manche Hersteller schreiben stattdessen FFF (Fused Filament Fabrication), gemeint ist dasselbe. Die Düse wird bis 250 °C heiß. Das größte Modell darf 300 mm breit, 300 mm tief und 400 mm hoch sein.</p>`,
          a1: `<p>Im Technikraum steht ein A1. Bevor du ihn nutzt, liest du die Beschreibung des Herstellers, hier in eigenen Worten:</p>
          <p>Gedruckt wird auf einer biegsamen Stahlplatte mit einer rauen PEI-Beschichtung. Das Heizbett darunter wird bis 100 °C warm. Darauf entsteht das Modell Bahn für Bahn: Ein Motor im Druckkopf zieht einen Kunststoffdraht von der Rolle und schiebt ihn direkt in die Heizung. Eine Düse mit einer Öffnung von 0,4 mm legt ihn ab. Der Draht – Fachleute nennen ihn <b>Filament</b> – ist 1,75 mm dick und läuft durch einen dünnen Schlauch vom Spulenhalter oben am Rahmen zum Druckkopf.</p>
          <p>Weil das Material geschmolzen und Schicht für Schicht abgelegt wird, gehört der Drucker zum Verfahren <b>Fused Deposition Modeling</b>, kurz FDM. Manche Hersteller schreiben stattdessen FFF (Fused Filament Fabrication), gemeint ist dasselbe. Die Düse wird bis 300 °C heiß. Das größte Modell darf 256 mm breit, 256 mm tief und 256 mm hoch sein.</p>`,
          kx: `<p>Im Technikraum steht ein Kobra X. Bevor du ihn nutzt, liest du die Beschreibung des Herstellers, hier in eigenen Worten:</p>
          <p>Gedruckt wird auf einer biegsamen Federstahlplatte mit PEI-Beschichtung, die bis 100 °C warm werden kann. Darauf entsteht das Modell Bahn für Bahn: Ein Motor im Druckkopf schiebt einen Kunststoffdraht direkt in die Heizung. Eine Düse aus gehärtetem Stahl mit einer Öffnung von 0,4 mm legt ihn ab. Der Draht – Fachleute nennen ihn <b>Filament</b> – ist 1,75 mm dick. Bis zu vier Rollen sitzen oben auf dem Rahmen, ein Farbwechsler im Druckkopf wählt, welche gerade druckt.</p>
          <p>Weil das Material geschmolzen und Schicht für Schicht abgelegt wird, gehört der Drucker zum Verfahren <b>Fused Deposition Modeling</b>, kurz FDM. Manche Hersteller schreiben stattdessen FFF (Fused Filament Fabrication), gemeint ist dasselbe. Die Düse wird bis 300 °C heiß. Das größte Modell darf 260 mm breit, 260 mm tief und 260 mm hoch sein.</p>` }),
        text: 'Verfahren (Abkürzung): {0} · Material: {1} mit {2} mm Durchmesser · Öffnung der Düse: {3} mm · größte Höhe eines Modells: {4} mm',
        gaps: [{ ans: ['FDM', 'FFF'], size: 5 }, { ans: ['Filament', 'Kunststoffdraht', 'Kunststoff-Filament', 'Kunststofffilament'], size: 12 }, { ans: ['1,75', '1.75'], size: 5 }, { ans: ['0,4', '0.4', '0,40'], size: 4 }, { ans: [String(P.bau[2])], size: 4 }],
        hint: 'Achte bei jeder Zahl im Text auf das Wort davor: Gehört sie zur Düse, zum Draht oder zum Bauraum?', explain: `Der ${P.name} ist ein FDM-Drucker (auch FFF genannt). Bauraum ${BAUTXT}, Düse 0,4 mm, Filament 1,75 mm.` },
      { id: 'v6', type: 'open', title: 'FDM in der Schule', q: 'Begründe, warum in Schulen fast immer FDM-Drucker stehen und keine SLA-, SLS- oder 3DP-Anlagen.',
        lesen: `<p>Materialkosten je Kilogramm (Richtwerte):</p>${hbars([['SLA', 600, 'ca. 600 €'], ['SLS', 450, 'ca. 450 €'], ['3DP', 300, 'ca. 300 €'], ['FDM', 60, 'ca. 60 €']], 600)}
          <p><b>Oberfläche:</b> SLA liefert die glatteste Oberfläche. FDM und 3DP liefern eine gute Oberfläche, bei SLS bleibt sie eher rau. Bei FDM sieht man die einzelnen Schichten, wenn man genau hinschaut.</p>
          <p><b>Arbeitsaufwand:</b> SLS und 3DP arbeiten mit offenem, sehr feinem Pulver, das man nicht einatmen soll. SLA-Teile müssen nach dem Druck gewaschen und nachgehärtet werden. Beim FDM nimmt man das fertige Teil einfach vom Bett. Was die Geräte kosten, steht in Aufgabe 4.</p>`,
        denk: ['die Kosten für Gerät und Material', 'die Oberfläche: Wann reicht FDM, wann nicht?', 'mindestens einen Grund, der nichts mit Geld zu tun hat'],
        min: 150, checks: [['Kosten', 'kost|günstig|billig|preis|euro|€|teuer'], ['Material', 'material|filament|kilo|kg|harz|pulver'], ['Oberfläche oder Genauigkeit', 'oberfl|glatt|rau|fein|genau|schicht'], ['einen Grund ohne Geld', 'einfach|pulver|einatm|wasch|nachhärt|sicher|bedien|aufwand']],
        muster: '<p>FDM-Drucker sind am günstigsten: Ein Gerät kostet nur einen Bruchteil einer SLA-, SLS- oder 3DP-Anlage, und Filament kostet je Kilogramm nur etwa ein Fünftel bis ein Zehntel von Harz oder Pulver. Die Oberfläche ist nicht so glatt wie bei SLA, für Modelle, Halter und Ersatzteile im Unterricht reicht sie aber aus. Außerdem ist FDM einfach und sauber zu bedienen: Es gibt kein offenes Pulver und kein flüssiges Harz, und die Teile müssen nach dem Druck nicht gewaschen oder nachgehärtet werden.</p>' },
      { id: 'v7', type: 'mc', title: 'Überhänge', q: 'Erkläre, wie ein weit ausladender Überhang trotzdem gelingt: Kreuze die passende Erklärung an.',
        lesen: `${fig(G.support, 'Gelb: das Modell. Grau: Das druckt der Drucker zusätzlich.')}
          <p>Ein 3D-Drucker baut jedes Modell von unten nach oben auf. Jede neue Bahn wird auf die Bahn darunter gelegt und verschmilzt mit ihr. Solange eine Wand nur leicht schräg steht, liegt jede Bahn noch zum Teil auf der vorherigen. Bis zu einer Neigung von etwa 45° klappt das ohne Hilfe.</p>
          <p>Ragt ein Teil des Modells weiter heraus, spricht man von einem <b>Überhang</b>. Unter ihm ist nur Luft. Das weiche Material würde nach unten hängen oder abreißen. Damit das nicht passiert, berechnet der Slicer dünne Säulen oder Gitter, die vom Druckbett bis unter den Überhang reichen. Diese <b>Stützstruktur</b> (englisch Support) wird mitgedruckt und nach dem Druck abgebrochen.</p>
          <p>Verwechsle sie nicht mit zwei anderen Einstellungen: Ein <b>Brim</b> ist ein flacher Rand um die erste Schicht, damit das Modell besser auf dem Bett haftet. Die <b>Füllung</b> (Infill) liegt im Inneren des Modells und macht es stabil. Beide tragen keinen Teil, der in die Luft ragt.</p>`,
        opts: ['Dünne Stützen unter dem Überhang, die man danach abbricht', 'Ein flacher Rand rund um das Modell, der danach abgezogen wird', 'Eine dichtere Füllung im Inneren direkt unter dem Überhang', 'Eine dickere Außenwand, die den Überhang von der Seite hält'], ans: [0],
        explain: 'Die Stützstruktur (Support) trägt den Überhang beim Drucken. Brim und Füllung helfen bei Haftung und Stabilität, tragen aber nichts, was in die Luft ragt.' }
    ]
  },
  {
    id: 'aufbau', short: 'Aufbau', title: `Aufbau des ${P.name}`,
    lead: 'Wer einen Drucker bedienen will, muss seine Bauteile kennen. Hier lernst du, wie das Filament von der Rolle bis zur Düse kommt und wie sich der Drucker bewegt.',
    intro: () => `
      <div class="facts">
        <div class="fact"><b>FDM</b><span>Druckverfahren</span></div>
        <div class="fact"><b>${BAUTXT}</b><span>Bauraum (Breite × Tiefe × Höhe)</span></div>
        <div class="fact"><b>0,4 mm</b><span>Düsendurchmesser, Filament 1,75 mm</span></div>
        <div class="fact"><b>bis ${P.tD} °C / ${P.tB} °C</b><span>Temperatur Düse / Druckbett</span></div>
      </div>`,
    tasks: [
      { id: 'a1', type: 'label', title: 'Bauteile erkennen', q: `Benenne die Bauteile des ${P.name}: Jede Nummer in der Zeichnung gehört zu genau einem Begriff.`, img: PIMG, alt: `Zeichnung des ${P.voll} mit nummerierten Markierungen`,
        info: PV({
          ender: `<p>So findest du die Bauteile am Ender 3 V2:</p><ul class="il">
          <li><b>Display mit Drehknopf:</b> rechts neben dem Drucker. Hier bedienst du den Drucker.</li>
          <li><b>Hotend:</b> der Druckkopf auf der Querstange, verdeckt von einer schwarzen Lüfterabdeckung mit vielen Löchern.</li>
          <li><b>Düse (Nozzle):</b> die kleine Metallspitze ganz unten am Druckkopf.</li>
          <li><b>Druckbett:</b> die Glasplatte, auf der gedruckt wird.</li>
          <li><b>Bowden-Schlauch:</b> der weiße Kunststoffschlauch, der von links oben zum Druckkopf läuft.</li>
          <li><b>Extruder:</b> sitzt links oben am Rahmen, erkennbar am blauen Hebel. Er schiebt das Filament in den Schlauch.</li>
          <li><b>Stellräder:</b> vier große Rändelmuttern unter dem Druckbett.</li>
          <li><b>Riemenspanner:</b> blaue Drehknöpfe an den Enden der Achsen, zum Beispiel rechts an der Querstange.</li>
          <li><b>SD-Karten-Steckplatz:</b> vorne im Sockel.</li>
          <li><b>Aluminiumprofile:</b> die senkrechten und waagerechten Stangen, aus denen der Rahmen besteht.</li></ul>
          <p>Achtung: Zwei Begriffe in der Auswahl gehören zu keiner Nummer.</p>`,
          cr10: `<p>So findest du die Bauteile am CR-10 S Pro:</p><ul class="il">
          <li><b>Touchscreen:</b> vorne im Sockel. Hier bedienst du den Drucker mit dem Finger.</li>
          <li><b>Druckkopf:</b> sitzt auf der Querstange, mit einem großen Lüfter vorn. Darin steckt das Hotend.</li>
          <li><b>Düse (Nozzle):</b> die kleine Metallspitze ganz unten am Druckkopf.</li>
          <li><b>Nivelliersensor:</b> der kleine Zylinder rechts neben der Düse. Er tastet das Druckbett ab.</li>
          <li><b>Druckbett:</b> die Glasplatte mit Druckfolie, auf der gedruckt wird.</li>
          <li><b>Bowden-Schlauch:</b> der blaue Schlauch, der vom Rahmen zum Druckkopf läuft.</li>
          <li><b>Extruder:</b> Motor mit zwei Zahnrädern am Rahmen. Er schiebt das Filament in den Schlauch.</li>
          <li><b>Filamentsensor:</b> sitzt direkt vor dem Extruder. Er meldet, wenn das Filament ausgeht.</li>
          <li><b>Stellmuttern:</b> große Muttern unter dem Druckbett, mit denen du die Ecken grob einstellst.</li>
          <li><b>Spulenhalter:</b> oben auf dem Rahmen. Hier hängt die Filamentrolle.</li>
          <li><b>Z-Motor:</b> unten an jeder Säule. Die beiden Motoren drehen die Gewindespindeln.</li></ul>
          <p>Achtung: Zwei Begriffe in der Auswahl gehören zu keiner Nummer.</p>`,
          a1: `<p>So findest du die Bauteile am A1:</p><ul class="il">
          <li><b>Touchscreen:</b> ein ausklappbarer Bildschirm am Sockel. Hier bedienst du den Drucker mit dem Finger.</li>
          <li><b>Druckkopf mit Extruder:</b> die helle Haube auf der Querstange. Darin sitzen Extruder und Hotend.</li>
          <li><b>Düse (Nozzle):</b> die kleine Metallspitze ganz unten am Druckkopf.</li>
          <li><b>Druckplatte:</b> die biegsame Stahlplatte mit rauer PEI-Beschichtung. Magnete halten sie auf dem Heizbett, du kannst sie abnehmen.</li>
          <li><b>PTFE-Schlauch:</b> der dünne weiße Schlauch vom Spulenhalter zum Druckkopf. Er führt das Filament.</li>
          <li><b>Spulenhalter:</b> oben am Querbalken des Rahmens. Hier hängt die Filamentrolle.</li>
          <li><b>Z-Säulen:</b> die beiden senkrechten Säulen. In jeder dreht sich eine Gewindespindel.</li>
          <li><b>Reinigungswischer (Purge Wiper):</b> am linken Ende der Querstange. Daran streift der Drucker die Düse ab.</li></ul>
          <p>Achtung: Zwei Begriffe in der Auswahl gehören zu keiner Nummer.</p>`,
          kx: `<p>So findest du die Bauteile am Kobra X:</p><ul class="il">
          <li><b>Touchscreen:</b> am Sockel. Hier bedienst du den Drucker mit dem Finger.</li>
          <li><b>Druckkopf mit Farbwechsler:</b> der große Kasten auf der Querstange. Darin sitzen Farbwechsler, Extruder und Hotend.</li>
          <li><b>Anzeige der aktiven Farbe:</b> ein kleines Feld vorn am Druckkopf. Es zeigt, welches Filament gerade druckt.</li>
          <li><b>Düse (Nozzle):</b> die kleine Metallspitze ganz unten am Druckkopf.</li>
          <li><b>Druckplatte:</b> die biegsame Federstahlplatte mit PEI-Beschichtung. Du kannst sie abnehmen.</li>
          <li><b>Führungsschläuche:</b> vier dünne Schläuche, die von den Rollen zum Druckkopf laufen.</li>
          <li><b>Spulenhalter:</b> oben auf dem Rahmen, für bis zu vier Rollen.</li>
          <li><b>Z-Säulen:</b> die beiden senkrechten Säulen, an denen die Querstange hoch- und runterfährt.</li></ul>
          <p>Achtung: Zwei Begriffe in der Auswahl gehören zu keiner Nummer.</p>` }),
        spots: DR[P.id].spots,
        extra: PV({ ender: ['Spulenhalter', 'Heizpatrone'], cr10: ['Display mit Drehknopf', 'Heizpatrone'], def: ['Stellrad zum Nivellieren', 'Bowden-Extruder am Rahmen'] }),
        hint: PV({ ender: 'Das Filament läuft von oben links (Extruder) durch den weißen Schlauch zum Druckkopf. Unten am Druckbett sitzen vier Stellräder.',
          cr10: 'Das Filament läuft vom Spulenhalter oben durch Filamentsensor und Extruder in den blauen Schlauch. Unter dem Druckbett sitzen große Stellmuttern.',
          a1: 'Folge dem weißen Schlauch: Er kommt vom Spulenhalter oben und endet am Druckkopf. Der Extruder sitzt im Druckkopf.',
          kx: 'Zähle die Schläuche: Von jeder der vier Rollen läuft einer zum Druckkopf.' }) },
      { id: 'a2', type: 'match', title: 'Aufgaben der Bauteile', q: 'Ordne jeder Aufgabe das passende Bauteil zu.',
        info: `<ul class="il">
          <li><b>Extruder:</b> Ein Motor dreht ein geriffeltes Rad (Rändelrad). Es greift in das Filament und schiebt es nach vorne.</li>
          <li><b>Hotend:</b> Ein Heizblock mit Heizpatrone erhitzt das Filament, bis es flüssig ist.</li>
          <li><b>Schrittmotoren:</b> Sie drehen sich nicht gleichmäßig, sondern in vielen kleinen Schritten. Das Mainboard zählt die Schritte und weiß so, wie weit sich eine Achse bewegt hat.</li>
          <li><b>Endstop-Schalter:</b> kleine Taster am Ende jeder Achse. Fährt der Drucker dagegen, weiß das Mainboard: Hier ist der Nullpunkt.</li>
          <li><b>Mainboard:</b> die Steuerplatine im Sockel. Sie liest den G-Code und steuert Motoren und Heizungen.</li>
          <li>${PV({ ender: '<b>Stellräder:</b> Mit ihnen hebt oder senkt man jede Ecke des Druckbetts ein wenig.', cr10: '<b>Nivelliersensor:</b> Er sitzt neben der Düse und tastet das Druckbett vor dem Druck an 16 Punkten ab. Das Mainboard gleicht kleine Unebenheiten beim Drucken aus.', a1: '<b>Messsystem im Druckkopf:</b> Vor dem Druck tippt die Düse an vielen Stellen auf die Platte. So misst der Drucker selbst, wie hoch das Bett überall ist.', kx: '<b>Nivelliersystem LeviQ:</b> Es misst das Druckbett vor dem Druck an vielen Punkten ab und prüft den Abstand der Düse.' })}</li>
          <li><b>Druckbett:</b> die beheizbare Platte, auf der das Modell entsteht.</li></ul>`,
        pairs: [['schiebt das Filament mit Motor und Rändelrad vor', 'Extruder'], ['schmilzt das Filament', 'Hotend'], ['drehen sich in kleinen Schritten, das Mainboard kennt die Position', 'Schrittmotoren'], ['meldet dem Mainboard den Nullpunkt', 'Endstop-Schalter'], ['steuert den gesamten Drucker', 'Mainboard'], PV({ ender: ['stellt den Abstand zwischen Düse und Bett ein', 'Stellrad'], cr10: ['tastet das Druckbett an 16 Punkten ab', 'Nivelliersensor'], a1: ['misst vor dem Druck selbst, wie hoch das Bett überall ist', 'Messsystem im Druckkopf'], kx: ['misst das Druckbett ab und prüft den Abstand der Düse', 'Nivelliersystem LeviQ'] }), ['Bauplattform, auf der das Modell entsteht', 'Druckbett']],
        explain: 'Ohne Endstops wüsste der Drucker nicht, wo er sich befindet.' },
      { id: 'a3', type: 'order', title: 'Der Weg des Filaments', q: 'Ordne die Stationen in der Reihenfolge, die das Filament durchläuft.',
        info: PV({ ender: `${fig(G.path, 'Folge der blauen Linie vom Anfang bis zum Ende. Die Namen der Stationen findest du bei Aufgabe 1 und 2.')}<p>Das Filament ist auf einer Spule aufgewickelt. Der Extruder zieht es ab und schiebt es durch einen langen Schlauch bis zum Druckkopf. Dort wird es geschmolzen und durch eine winzige Öffnung auf das Druckbett gedrückt.</p>`,
          cr10: `${fig(G.path, 'Folge der blauen Linie vom Anfang bis zum Ende. Die Namen der Stationen findest du bei Aufgabe 1 und 2.')}<p>Das Filament ist auf einer Spule aufgewickelt. Es läuft zuerst durch den Filamentsensor. Dann zieht der Extruder es ab und schiebt es durch einen langen Schlauch bis zum Druckkopf. Dort wird es geschmolzen und durch eine winzige Öffnung auf das Druckbett gedrückt.</p>`,
          a1: `${fig(G.pathD, 'Folge der blauen Linie vom Anfang bis zum Ende. Die Namen der Stationen findest du bei Aufgabe 1 und 2.')}<p>Das Filament ist auf einer Spule aufgewickelt. Es läuft durch einen dünnen Schlauch bis zum Druckkopf. Erst dort greift es der Extruder und schiebt es direkt in das Hotend. Dort wird es geschmolzen und durch eine winzige Öffnung auf das Druckbett gedrückt.</p>`,
          kx: `${fig(G.pathD, 'Folge der blauen Linie vom Anfang bis zum Ende. Die Namen der Stationen findest du bei Aufgabe 1 und 2.')}<p>Jedes Filament ist auf einer eigenen Spule aufgewickelt und läuft durch einen eigenen Schlauch bis zum Druckkopf. Dort entscheidet zuerst der Farbwechsler, welches Filament weitergeht. Dann greift es der Extruder und schiebt es in das Hotend. Dort wird es geschmolzen und durch eine winzige Öffnung auf das Druckbett gedrückt.</p>` }),
        items: PV({ ender: ['Filamentspule', 'Extruder (Vorschub)', 'Bowden-Schlauch', 'Hotend (Heizblock)', 'Düse', 'Druckbett'], cr10: ['Filamentspule', 'Filamentsensor', 'Extruder (Vorschub)', 'Bowden-Schlauch', 'Hotend (Heizblock)', 'Düse', 'Druckbett'], a1: ['Filamentspule', 'PTFE-Schlauch', 'Extruder im Druckkopf', 'Hotend (Heizblock)', 'Düse', 'Druckbett'], kx: ['Filamentspule', 'Führungsschlauch', 'Farbwechsler', 'Extruder im Druckkopf', 'Hotend (Heizblock)', 'Düse', 'Druckbett'] }),
        explain: PV({ ender: 'Beim Bowden-Prinzip sitzt der Extruder-Motor am Rahmen. Der Druckkopf bleibt dadurch leichter.', cr10: 'Beim Bowden-Prinzip sitzt der Extruder-Motor am Rahmen. Der Druckkopf bleibt dadurch leichter.', def: 'Beim Direktantrieb sitzt der Extruder im Druckkopf. Der Weg bis zum Hotend ist kurz, der Schlauch davor führt das Filament nur.' }) },
      { id: 'a4', type: 'gaps', title: 'Achsen und Bewegung', q: `Ordne den Bauteilen des ${P.name} die Achsen zu, in denen sie sich bewegen.`,
        lesen: `<div class="split">${fig(G.axes, 'Die drei Achsen eines 3D-Druckers')}<div>
          <p>Jeder Punkt im Bauraum lässt sich mit drei Zahlen beschreiben. Die <b>X-Achse</b> verläuft von links nach rechts, die <b>Y-Achse</b> von vorn nach hinten und die <b>Z-Achse</b> nach oben. Das gilt immer aus Sicht einer Person, die vor dem Drucker steht.</p>
          <p>Stell dich vor den ${P.name}. ${P.id === 'ender' || P.id === 'cr10' ? 'Die Glasplatte' : 'Die Druckplatte'}, auf der das Modell entsteht, gleitet auf einer Schiene auf dich zu und wieder von dir weg. Über ihr sitzt der Druckkopf auf einer waagerechten Stange, der <b>Querstange</b>. Ein Zahnriemen zieht ihn darauf von einer Seite zur anderen. ${P.z}</p></div></div>`,
        text: 'Der Druckkopf fährt auf der Querstange in {0}-Richtung. Die Querstange mit dem Druckkopf fährt an den Säulen in {1}-Richtung. Das Druckbett bewegt sich in {2}-Richtung. Beginnt eine neue Schicht, fährt der Drucker ein kleines Stück in {3}-Richtung.',
        gaps: [{ opts: ['X', 'Y', 'Z'], ans: 'X' }, { opts: ['X', 'Y', 'Z'], ans: 'Z' }, { opts: ['X', 'Y', 'Z'], ans: 'Y' }, { opts: ['X', 'Y', 'Z'], ans: 'Z' }],
        hint: 'Stell dir vor, du stehst vor dem Drucker: Was bewegt sich links–rechts, was vor–zurück, was hoch–runter?', explain: 'Zahnriemen bewegen Druckkopf (X) und Bett (Y), die Z-Achse fährt über eine Gewindespindel.' },
      { id: 'a5', type: 'mc', title: 'Bowden-Extruder', q: 'Erkläre den Begriff „Bowden-Extruder“: Kreuze die passende Erklärung an.',
        lesen: `${panels([[G.bowden, 'Bauart A'], [G.direct, 'Bauart B']])}
          <p>Der <b>Extruder</b> schiebt das Filament mit einem Motor und einem geriffelten Rad in Richtung Hotend. Wo dieser Motor sitzt, unterscheidet zwei Bauarten.</p>
          <p>Beim <b>Direktantrieb</b> sitzt der Extruder direkt über dem Hotend und fährt bei jeder Bewegung mit. Der Weg bis zum Hotend ist kurz, auch weiches, gummiartiges Filament lässt sich so gut drucken. Dafür ist der Druckkopf schwer.</p>
          <p>Der <b>Bowden-Extruder</b> ist nach dem Bowdenzug benannt, den du von der Fahrradbremse kennst: Ein Seil läuft in einer Hülle. Beim 3D-Drucker ist der Motor fest am Rahmen verschraubt. Er schiebt das Filament durch einen langen Kunststoffschlauch bis zum Hotend, so wie das Seil durch die Hülle läuft. Der Druckkopf bleibt leicht und kann schnell fahren. Weiches Filament knickt im langen Schlauch aber leicht ein. ${PV({ ender: 'Der Ender 3 V2 hat einen Bowden-Extruder.', cr10: 'Der CR-10 S Pro hat einen Bowden-Extruder mit zwei Zahnrädern.', a1: 'Der A1 hat dagegen einen Direktantrieb: Sein Extruder sitzt im Druckkopf.', kx: 'Der Kobra X hat dagegen einen Direktantrieb. Im Druckkopf sitzt zusätzlich ein Farbwechsler für vier Filamente.' })}</p>`,
        opts: ['Der Motor sitzt am Rahmen und schiebt das Filament durch einen Schlauch zum Hotend.', 'Der Extruder sitzt direkt über dem Hotend und fährt bei jeder Bewegung des Kopfes mit.', 'Zwei Motoren schieben das Filament von beiden Seiten gleichzeitig in das Hotend hinein.', 'Der Schlauch kühlt das Filament auf dem Weg vom Extruder zum Hotend gleichmäßig ab.'], ans: [0],
        explain: 'Beim Bowden-Extruder sitzt der Motor am Rahmen, ein Schlauch führt das Filament zum Hotend – wie das Seil in der Hülle eines Bowdenzugs.' },
      { id: 'a6', type: 'mc', title: 'Auto Home', q: 'Begründe, warum der Drucker vor dem Druck die Endstops anfährt („Auto Home“): Kreuze die passende Begründung an.',
        info: `<p>Ein Schrittmotor merkt sich nur, wie viele Schritte er gefahren ist. Nach dem Einschalten weiß der Drucker also nicht, wo Druckkopf und Bett gerade stehen. Mit <b>Auto Home</b> fährt er jede Achse langsam bis zum Endstop-Schalter. Sobald der Schalter gedrückt wird, setzt das Mainboard diese Stelle als Nullpunkt. Ab jetzt kann es jede Position genau berechnen.</p>`,
        opts: ['Damit das Mainboard den Nullpunkt kennt und jede Position daraus berechnet.', 'Damit Düse und Druckbett vor dem Druck gleichmäßig auf Temperatur kommen.', 'Damit der Drucker misst, ob das Druckbett an allen vier Ecken gleich hoch ist.', 'Damit die Motoren ihre Riemen spannen und das Spiel in den Achsen ausgleichen.'], ans: [0], explain: 'Ein Schrittmotor zählt nur Schritte. Erst am Endstop weiß das Mainboard, wo der Nullpunkt liegt.' }
    ]
  },
  {
    id: 'slicing', short: 'Slicing', title: 'Vom Modell zum G-Code',
    lead: 'Der Drucker versteht keine 3D-Zeichnung. Ein Slicer wie Cura zerlegt das Modell in Schichten und erzeugt daraus den Maschinencode.',
    intro: () => `${chain(['3D-Modell (.stl)', 'Slicer (Cura)', 'G-Code (.gcode)', P.speicher, P.name])}${CURA_BOX('slicing')}`,
    tasks: [
      { id: 's1', type: 'order', title: 'Der Weg zum G-Code', q: 'Ordne die Arbeitsschritte in Cura in der richtigen Reihenfolge.',
        info: `<p>Überlege bei jedem Schritt, was vorher schon da sein muss:</p><ul class="il">
          <li>Ohne geladenes Modell gibt es nichts zu bearbeiten.</li>
          <li>Cura muss wissen, <b>für welchen Drucker</b> es rechnet – der Bauraum und die Düse hängen davon ab.</li>
          <li>Erst wenn das Objekt gut auf dem Druckbett liegt, lohnt es sich, Parameter einzustellen.</li>
          <li>Beim <b>Slicen</b> berechnet Cura aus Modell und Parametern die Schichten. In der Schichtenansicht prüfst du das Ergebnis.</li>
          <li>Ganz zum Schluss wird der fertige G-Code ${P.speicherAuf} gespeichert.</li></ul>`,
        items: ['STL-Datei in Cura laden', `Den Drucker (${P.name}) und das Profil auswählen`, 'Objekt bewegen, drehen oder skalieren – möglichst flach auf das Druckbett legen', 'Parameter einstellen (Schichtdicke, Wanddicke, Fülldichte, Geschwindigkeit)', 'Slicen und in der Schichtenansicht prüfen', `G-Code ${P.speicherAuf} speichern`] },
      { id: 's2', type: 'gaps', title: 'Fachbegriffe', q: 'Ordne die Fachbegriffe den passenden Lücken zu.',
        info: `${chain(['3D-Modell (.stl)', 'Slicer (Cura)', 'G-Code (.gcode)', 'Drucker'])}<p><b>STL</b> ist das Dateiformat für die Form eines 3D-Modells. Ein <b>Slicer</b> („Schneider“) zerlegt das Modell in dünne Scheiben. Daraus entsteht der <b>G-Code</b>: eine lange Liste von Befehlen wie „fahre nach X 20, Y 35“ oder „heize auf 200 °C“, die nur der Drucker ausführt.</p>`,
        text: 'Ein 3D-Modell wird als {0}-Datei gespeichert. Der {1} zerlegt es in Schichten und erzeugt daraus den {2}, den nur der Drucker lesen kann.', gaps: [{ opts: ['STL', 'PDF', 'JPG'], ans: 'STL' }, { opts: ['Slicer', 'Extruder', 'Endstop'], ans: 'Slicer' }, { opts: ['G-Code', 'Quellcode', 'Barcode'], ans: 'G-Code' }] },
      { id: 's3', type: 'num', title: 'Schichten zählen', q: 'Berechne für beide Objekte die Zahl der Schichten.',
        info: `${fig(G.layers)}<p><b>Schichtdicke:</b> Eine kleine Schichtdicke (0,1 mm) ist sehr genau, dauert aber lange. Eine große Schichtdicke (0,3 mm) ist gröber, aber schneller. Üblich sind 0,1 bis 0,3 mm.</p><p><b>Anzahl der Schichten = Höhe ÷ Schichtdicke.</b> Beispiel: 20 mm ÷ 0,2 mm = 100 Schichten.</p>`,
        items: [{ q: 'Ein Objekt ist 30 mm hoch, die Schichtdicke beträgt 0,2 mm.', ans: 150, unit: 'Schichten' }, { q: 'Ein Objekt ist 45 mm hoch, die Schichtdicke beträgt 0,15 mm.', ans: 300, unit: 'Schichten' }], explain: 'Halbiert man die Schichtdicke, verdoppelt sich die Schichtzahl – und ungefähr die Druckzeit.' },
      { id: 's4', type: 'mc', title: 'Passende Wanddicke', q: 'Ermittle alle Wanddicken, die eine 0,4-mm-Düse ohne Lücke drucken kann.',
        info: `${panels([[G.wall08, 'Zwei Bahnen passen genau.'], [G.wall10, 'Eine halbe Bahn kann die Düse nicht drucken – es bleibt eine Lücke.']])}<p>Die Düse legt immer eine Bahn von etwa 0,4 mm Breite. Eine Wand besteht aus mehreren solcher Bahnen nebeneinander. Halbe Bahnen gibt es nicht. Die Wanddicke sollte deshalb ein ganzzahliges <b>Vielfaches der Düsenbreite</b> sein.</p>`,
        opts: ['1,0 mm', '1,2 mm', '1,4 mm', '1,6 mm'], ans: [1, 3], fixed: true, hint: 'Teile jede Wanddicke durch 0,4 mm. Es passt nur, wenn eine ganze Zahl herauskommt.', explain: '1,2 mm = 3 Bahnen, 1,6 mm = 4 Bahnen. Bei 1,0 mm und 1,4 mm bliebe eine halbe Bahn übrig.' },
      { id: 's5', type: 'num', title: 'Bahnen zählen', q: 'Berechne die fehlenden Werte.',
        info: `<p><b>Anzahl der Bahnen = Wanddicke ÷ 0,4 mm</b> (Düsenbreite).</p><p><b>Wanddicke = Anzahl der Bahnen × 0,4 mm.</b></p><p>Beispiel: Eine Wand aus 2 Bahnen ist 2 × 0,4 mm = 0,8 mm dick.</p>`,
        items: [{ q: 'Wie viele Bahnen hat eine Wand mit 1,2 mm Dicke bei einer 0,4-mm-Düse?', ans: 3, unit: 'Bahnen' }, { q: 'Wie dick ist eine Wand aus 4 Bahnen?', ans: 1.6, unit: 'mm' }] },
      { id: 's6', type: 'mc', title: 'Flach auf das Bett', q: 'Begründe, warum ein Objekt in Cura möglichst flach auf dem Druckbett liegen soll: Kreuze die passende Begründung an.',
        info: `${panels([[G.flat, '<b>Flach:</b> große Auflagefläche, keine Stützen nötig.'], [G.edge, '<b>Hochkant:</b> kleine Auflagefläche, der Überhang braucht Stützen (grau).']])}<p>Die erste Schicht muss gut auf dem Bett haften. Je größer die Auflagefläche, desto sicherer hält das Objekt. Außerdem entstehen weniger Überhänge – das spart Stützmaterial und Nacharbeit.</p>`,
        opts: ['Es haftet auf großer Fläche gut und braucht weniger Stützmaterial.', 'Das Bett muss dann nicht nivelliert werden, weil das Teil sicher hält.', 'Die Düse kann kühler drucken, weil sie pro Schicht weniger Material legt.', 'Das Teil wird dadurch in allen Richtungen gleich fest und biegt sich nicht.'], ans: [0], explain: 'Große Auflagefläche = gute Haftung. Weniger Überhänge = weniger Stützen und Nacharbeit.' },
      { id: 's7', type: 'lab', title: 'Slicer-Labor', q: 'Erprobe im Slicer-Labor verschiedene Einstellungen, bis alle drei Ziele erreicht sind. Die Anzeigen reagieren sofort.',
        info: `<ul class="il"><li><b>Schichtdicke:</b> dünn = feine Oberfläche, aber viele Schichten und lange Druckzeit.</li><li><b>Wanddicke:</b> dicke Wände machen stabil. Nutze Vielfache von 0,4 mm.</li><li><b>Fülldichte:</b> mehr Füllung = steifer, aber mehr Zeit und Material.</li><li><b>Geschwindigkeit:</b> schneller spart Zeit, zu schnell verschlechtert die Qualität.</li></ul><p>Danach: Probiere dieselben Einstellungen mit einem echten Objekt in Cura aus (siehe Kasten oben).</p>` }
    ]
  },
  {
    id: 'infill', short: 'Füllung', title: 'Die Füllung (Infill)',
    lead: 'Die Füllung bestimmt, wie stabil, schwer und zeitaufwendig dein Druck wird. Zwei Dinge musst du einstellen: die Fülldichte und das Füllmuster.',
    intro: () => `<div class="merke"><b class="t">Fülldichte</b>Standard sind <b>20 %</b>. Muss das Objekt nicht viel aushalten, reichen oft <b>10 %</b>. Stabile Teile druckt man häufig mit <b>30 %</b> oder mehr.</div>${CURA_BOX('infill')}`,
    tasks: [
      { id: 'i1', type: 'num', title: 'Passende Fülldichte', q: 'Nenne für jedes Objekt einen sinnvollen Wert der Fülldichte.',
        info: `${panels([[tile('grid', 10), '<b>ca. 10 %:</b> Deko, Teile ohne Belastung'], [tile('grid', 20), '<b>ca. 20 %:</b> Standard für Alltagsteile'], [tile('grid', 40), '<b>30–60 %:</b> Teile, die Kraft aushalten müssen']])}<p>Die Füllung ist mitentscheidend für Stabilität, Gewicht und Druckdauer. Mehr Füllung macht ein Teil steifer, aber schwerer, teurer und langsamer.</p>`,
        items: [{ q: 'Würfel, der nicht viel Kraft aushalten muss', min: 5, max: 15, show: 10, unit: '%' }, { q: 'Schlüsselanhänger, der manchmal zwischen den Schlüsseln gequetscht wird', min: 15, max: 30, show: 20, unit: '%' }, { q: 'Haken, an dem Gegenstände aufgehängt werden', min: 30, max: 60, show: 40, unit: '%' }],
        hint: 'Je mehr Kraft das Teil aushalten muss, desto mehr Füllung braucht es.' },
      { id: 'i2', type: 'sort', title: 'Muster einordnen', q: 'Ordne die Füllmuster der richtigen Gruppe zu.',
        info: `${panels([[`<div class="trio">${tile('lines', 0)}${tile('lines', 0)}${tile('lines', 0)}</div>`, '<b>2D:</b> Schicht 1, 2, 3 sehen gleich aus – die Linien liegen genau übereinander.'], [`<div class="trio">${tile('shift', 0)}${tile('shift', 5)}${tile('shift', 10)}</div>`, '<b>3D:</b> Von Schicht zu Schicht wandern die Linien – als wäre die Füllung gedreht.'], [`<div class="trio">${tile('conc')}</div>`, '<b>Konzentrisch:</b> Ringe folgen der Außenform.']])}
          <p>So sehen die Muster in Cura aus:</p><ul class="il">
          <li><b>Gitter:</b> Linien in zwei Richtungen bilden Quadrate, jede Schicht gleich.</li><li><b>Linien:</b> parallele Linien, jede Schicht gleich (abwechselnd gedreht).</li><li><b>Dreiecke:</b> drei Linienrichtungen bilden Dreiecke, jede Schicht gleich.</li><li><b>Zickzack:</b> eine durchgehende Zickzacklinie, jede Schicht gleich.</li>
          <li><b>Kubisch:</b> Würfel, die auf der Spitze stehen – die Linien verschieben sich mit jeder Schicht.</li><li><b>Viertelkubisch:</b> ähnlich wie Kubisch, die Linien wandern von Schicht zu Schicht.</li><li><b>Octet:</b> eine räumliche Gitterstruktur aus Pyramiden, die sich über die Höhe verändert.</li><li><b>Gyroid:</b> weiche Wellenlinien, die sich mit jeder Schicht verschieben.</li>
          <li><b>Konzentrisch:</b> Ringe parallel zur Außenwand, die Linien sind nicht miteinander verbunden.</li></ul>` ,
        cats: ['2D-Füllmuster', '3D-Füllmuster', 'konzentrisch'],
        items: [{ text: 'Gitter', cat: 0 }, { text: 'Linien', cat: 0 }, { text: 'Dreiecke', cat: 0 }, { text: 'Zickzack', cat: 0 }, { text: 'Kubisch', cat: 1 }, { text: 'Octet', cat: 1 }, { text: 'Gyroid', cat: 1 }, { text: 'Viertelkubisch', cat: 1 }, { text: 'Konzentrisch', cat: 2 }],
        hint: 'Bei 3D-Mustern liegen die Linien nicht direkt übereinander, sondern versetzt.' },
      { id: 'i3', type: 'match', title: 'Muster erkennen', q: 'Ordne jeder Draufsicht den Namen des Füllmusters zu.', how: 'Tippe links ein Bild an und dann rechts den passenden Namen. Zum Lösen einer Verbindung tippe den Namen rechts noch einmal an.',
        info: `<ul class="il"><li><b>Gitter:</b> Linien in zwei Richtungen, die sich im rechten Winkel kreuzen – es entstehen Quadrate.</li><li><b>Linien:</b> nur parallele Linien in einer Richtung.</li><li><b>Dreiecke:</b> Linien in drei Richtungen – es entstehen Dreiecke.</li><li><b>Konzentrisch:</b> geschlossene Ringe ineinander, wie Jahresringe.</li></ul>`,
        pairs: [[`<span class="pic">${patSVG('Dreiecke')}</span>`, 'Dreiecke'], [`<span class="pic">${patSVG('Gitter')}</span>`, 'Gitter'], [`<span class="pic">${patSVG('Konzentrisch')}</span>`, 'Konzentrisch'], [`<span class="pic">${patSVG('Linien')}</span>`, 'Linien']] },
      { id: 'i4', type: 'gaps', title: 'Füllmuster im Vergleich', q: 'Ordne die passenden Begriffe den Lücken zu.',
        lesen: `<p>Cura bietet mehr als ein Dutzend Füllmuster an. Sie lassen sich in drei Gruppen einteilen. Die Gruppen unterscheiden sich vor allem darin, wie die Linien von Schicht zu Schicht liegen.</p>
          <p>Die ältesten Muster wie Gitter, Linien oder Dreiecke sind <b>2D-Füllmuster</b>. Der Drucker legt in jeder Schicht dasselbe Bild, die Linien stapeln sich also genau aufeinander. Das geht schnell. Belastbar ist die Füllung aber vor allem von oben nach unten, drückt man seitlich, gibt sie leichter nach.</p>
          <p>Bei <b>3D-Füllmustern</b> wie Gyroid oder Kubisch verschiebt der Slicer die Linien mit jeder Schicht ein wenig. So entsteht im Inneren ein räumliches Gerüst. Es soll ein Teil von allen Seiten etwa gleich gut stützen, egal aus welcher Richtung die Kraft kommt.</p>
          <p>Ganz anders arbeiten <b>konzentrische Muster</b>. Ihre Ringe folgen der Außenwand, sind aber nicht miteinander verbunden. Ein solches Teil lässt sich in X- und Y-Richtung zusammendrücken und federt zurück. Das ist gut für biegsame Teile und schlecht für stabile.</p>
          <p>Jedes Muster verlangt von der Düse einen anderen Weg. Mit dem Muster ändert sich deshalb nicht nur die Festigkeit, sondern auch die <b>Druckzeit</b>.</p>`,
        text: 'Ein Armband soll federn, wenn man es seitlich zusammendrückt. Dafür passt ein Muster aus {0}, weil sie nicht miteinander {1} sind. Ein Halter, der Kräfte aus allen Richtungen aushalten muss, bekommt eher ein {2}. Bei einem {3} liegen die Linien jeder Schicht genau übereinander. Wer das Muster wechselt, verändert auch die {4}.',
        gaps: [{ opts: ['Ringen', 'Dreiecken', 'Quadraten'], ans: 'Ringen' }, { opts: ['verbunden', 'versetzt', 'gekreuzt'], ans: 'verbunden' }, { opts: ['3D-Füllmuster', '2D-Füllmuster', 'Linienmuster'], ans: '3D-Füllmuster' }, { opts: ['2D-Füllmuster', '3D-Füllmuster', 'Gyroid-Muster'], ans: '2D-Füllmuster' }, { opts: ['Druckzeit', 'Schichtdicke', 'Düsentemperatur'], ans: 'Druckzeit' }],
        hint: 'Für das Armband: Welche Gruppe lässt sich seitlich zusammendrücken? Für den Halter: Welche Gruppe stützt aus allen Richtungen?', explain: 'Konzentrisch = elastisch in X und Y, 3D-Muster = in alle Richtungen ähnlich stabil, 2D-Muster = Linien übereinander.' },
      { id: 'i5', type: 'mc', title: 'Die volle Packung', q: 'Erkläre, was bei einer Fülldichte von 100 % passiert: Kreuze die passende Erklärung an.',
        info: `${panels([[tile('grid', 20), '20 %: viel Luft im Inneren'], [tile('grid', 90), 'fast 100 %: das Innere ist nahezu voll']])}<p>Die Fülldichte gibt an, wie viel vom Inneren mit Material gefüllt wird. Bei 0 % ist das Objekt hohl, bei 100 % massiv. Mehr Füllung heißt mehr Material, mehr Gewicht und längere Druckzeit.</p>`,
        opts: ['Das Innere wird massiv gefüllt, Material und Druckzeit steigen stark.', 'Das Objekt wird stabiler, die Druckzeit bleibt aber gleich.', 'Die Wände werden dicker, die Füllung im Inneren bleibt gleich.', 'Der Drucker füllt nur die oberste und die unterste Schicht.'], ans: [0], explain: 'Volle Füllung ist selten nötig. Oft ist mehr Wanddicke die bessere Wahl.' }
    ]
