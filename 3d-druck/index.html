  {
    id: 'bett', short: 'Bett-Leveling', title: 'Bett nivellieren und Druckstart',
    lead: PV({ ender: 'Eine perfekte erste Schicht entscheidet über den ganzen Druck. Beim Ender 3 V2 stellst du dafür den Abstand zwischen Düse und Druckbett mit vier Stellrädern ein.',
      cr10: 'Eine perfekte erste Schicht entscheidet über den ganzen Druck. Beim CR-10 S Pro stellst du die Ecken zuerst grob mit vier Stellmuttern ein. Danach misst ein Sensor das Bett an 16 Punkten genau ab.',
      a1: 'Eine perfekte erste Schicht entscheidet über den ganzen Druck. Beim A1 stellst du dafür nichts von Hand ein: Er misst das Druckbett selbst ab. Deine Aufgabe ist eine saubere, richtig aufgelegte Druckplatte und ein prüfender Blick auf die erste Schicht.',
      kx: 'Eine perfekte erste Schicht entscheidet über den ganzen Druck. Beim Kobra X misst das Nivelliersystem LeviQ das Bett selbst ab und prüft vor jedem Druck den Abstand der Düse. Passt die erste Schicht trotzdem nicht, stellst du den Z-Offset nach.' }),
    intro: () => PV({ ender: `<div class="merke"><b class="t">Vorsicht heiß</b>Beim Nivellieren sind Düse (ca. 200 °C) und Bett (ca. 60 °C) vorgeheizt. Düse nicht berühren und das Papier nur am Rand halten.</div>`,
      cr10: `<div class="merke"><b class="t">Vorsicht</b>Beim Nivellieren fährt der Druckkopf über das Bett. Halte das Papier nur am Rand und nimm die Hand weg, bevor der Sensor misst.</div>`,
      def: `<div class="merke"><b class="t">Vorsicht heiß</b>Beim Kalibrieren heizt der Drucker Düse und Bett auf und fährt den Druckkopf über die Platte. Greife nicht in den Bauraum, bis er fertig ist.</div>` }),
    tasks: [
      PV({
        ender: { id: 'b1', type: 'order', title: 'Nivellieren Schritt für Schritt', q: 'Ordne die Schritte der Papier-Methode in der richtigen Reihenfolge.',
          info: `${fig(G.paper)}<p><b>Warum vorheizen?</b> Metall dehnt sich bei Wärme aus. Stellt man kalt ein, stimmt der Abstand beim Drucken nicht mehr.</p>
            <p><b>Warum Auto Home?</b> Der Drucker muss seinen Nullpunkt kennen, damit die Düse auf der richtigen Höhe steht.</p>
            <p><b>Warum Motoren lösen?</b> Nur ohne Motorkraft kannst du Druckkopf und Bett von Hand über jede Ecke schieben.</p>
            <p><b>Die Papier-Methode:</b> Ein Blatt Papier wird zwischen Düse und Bett geschoben. Man dreht am Stellrad der Ecke, bis sich das Blatt mit leichtem Widerstand ziehen lässt. Danach folgen die anderen Ecken. Weil sich die Ecken gegenseitig beeinflussen, prüft man am Ende alles noch einmal. Ob es wirklich passt, zeigt erst eine gedruckte Testschicht.</p>`,
          items: ['Düse und Druckbett auf Drucktemperatur vorheizen (z. B. 200 °C / 60 °C)', '„Auto Home“ ausführen', 'Schrittmotoren lösen („Disable Steppers“), damit sich Druckkopf und Bett von Hand schieben lassen', 'Düse über eine Bettecke schieben', 'Papier unterlegen und das Stellrad drehen, bis das Blatt leicht bremst', 'Die anderen drei Ecken nacheinander genauso einstellen', 'Alle Ecken noch einmal kontrollieren', 'Eine Testschicht drucken und die Haftung beurteilen'] },
        cr10: { id: 'b1', type: 'order', title: 'Nivellieren Schritt für Schritt', q: 'Ordne die Schritte beim Nivellieren des CR-10 S Pro in der richtigen Reihenfolge.',
          info: `${fig(G.paper)}<p><b>Erst sauber:</b> Fett und Staub auf der Glasplatte stören die Haftung. Laut Anleitung reinigst du sie vor jedem Druck mit Glasreiniger oder Isopropanol.</p>
            <p><b>Hilfs-Nivellierung:</b> Am Touchscreen öffnest du den Nivellier-Modus. Tippst du eine Nummer an, fährt die Düse an eine Ecke. Dort schiebst du ein Blatt Papier unter die Düse und drehst die Stellmutter, bis das Papier leicht bremst. Danach folgen die anderen Ecken. Mit der Nummer für die Mitte prüfst du, ob die Platte auch dort passt.</p>
            <p><b>Feinarbeit:</b> Mit einer Fühlerlehre von 0,2 mm prüfst du den Abstand genauer. Am Bildschirm hebst oder senkst du die Düse mit Z+ und Z−, bis die Lehre gerade so hindurchpasst.</p>
            <p><b>Automatische Nivellierung:</b> Zum Schluss misst der Sensor neben der Düse das Bett an 16 Punkten. Kleine Unebenheiten gleicht der Drucker danach beim Drucken selbst aus. Ob alles passt, zeigt eine Testschicht.</p>`,
          items: ['Die Glasplatte mit Glasreiniger oder Isopropanol reinigen', 'Am Touchscreen den Nivellier-Modus öffnen und eine Ecke antippen', 'An jeder Ecke Papier unterlegen und die Stellmutter drehen, bis das Blatt leicht bremst', 'Mit der Nummer für die Mitte prüfen, ob die Platte auch dort passt', 'Den Abstand mit der 0,2-mm-Fühlerlehre prüfen und mit Z+ oder Z− nachstellen', 'Die automatische Nivellierung starten: Der Sensor misst 16 Punkte', 'Eine Testschicht drucken und die Haftung beurteilen'] },
        a1: { id: 'b1', type: 'order', title: 'Druckstart Schritt für Schritt', q: 'Ordne die Schritte vom Vorbereiten der Druckplatte bis zum fertigen Teil in der richtigen Reihenfolge.',
          info: `<p><b>Sauber und flach:</b> Der A1 misst das Bett selbst ab. Das klappt nur, wenn die Druckplatte sauber ist und flach auf dem Heizbett liegt. Schon ein Krümel unter der Platte oder Fett von den Fingern verändert die erste Schicht. Der A1 tastet vor dem Druck sogar ab, ob die Platte richtig liegt, und meldet sich, wenn nicht.</p>
            <p><b>Start:</b> Nach dem Start heizt der Drucker Düse und Bett auf. Dann tippt die Düse an vielen Stellen auf die Platte und misst so ihre Höhe. Erst danach beginnt die erste Schicht.</p>
            <p><b>Hinschauen:</b> Die erste Schicht verrät, ob die Messung gepasst hat. Läuft etwas schief, brichst du ab, bevor viel Material verloren ist.</p>
            <p><b>Abnehmen:</b> Ist das Teil abgekühlt, nimmst du die Platte ab und biegst sie leicht. Dann springt das Teil von selbst ab.</p>`,
          items: ['Die Druckplatte abnehmen und von Staub und Fett befreien', 'Die Platte sauber und flach auf das Heizbett legen', 'Den Druck starten: Der Drucker heizt auf und misst das Bett selbst ab', 'Die erste Schicht beobachten und beurteilen', 'Nach dem Abkühlen die Platte abnehmen und leicht biegen, bis sich das Teil löst'] },
        kx: { id: 'b1', type: 'order', title: 'Druckstart Schritt für Schritt', q: 'Ordne die Schritte vom Vorbereiten der Druckplatte bis zum fertigen Teil in der richtigen Reihenfolge.',
          info: `<p><b>Sauber und flach:</b> Der Kobra X misst das Bett selbst ab. Das klappt nur, wenn die Druckplatte sauber ist und flach auf dem Heizbett liegt. Schon ein Krümel unter der Platte oder Fett von den Fingern verändert die erste Schicht.</p>
            <p><b>Start:</b> Nach dem Start heizt der Drucker Düse und Bett auf. Das Nivelliersystem LeviQ misst die Platte und prüft den Abstand der Düse. Erst danach beginnt die erste Schicht.</p>
            <p><b>Hinschauen und nachstellen:</b> Die erste Schicht verrät, ob der Abstand passt. Ist die Düse zu nah oder zu weit weg, änderst du am Touchscreen den <b>Z-Offset</b> in kleinen Schritten.</p>
            <p><b>Abnehmen:</b> Ist das Teil abgekühlt, nimmst du die Platte ab und biegst sie leicht. Dann springt das Teil von selbst ab.</p>`,
          items: ['Die Druckplatte abnehmen und von Staub und Fett befreien', 'Die Platte sauber und flach auf das Heizbett legen', 'Den Druck starten: LeviQ misst das Bett ab und prüft den Abstand der Düse', 'Die erste Schicht beobachten und beurteilen', 'Wenn nötig, den Z-Offset in kleinen Schritten nachstellen', 'Nach dem Abkühlen die Platte abnehmen und leicht biegen, bis sich das Teil löst'] } }),
      PV({
        ender: { id: 'b2', type: 'gaps', title: 'Stellräder und Papier', q: 'Ordne die passenden Begriffe den Lücken zu.',
          info: `${panels([[G.knobCW, '<b>Im Uhrzeigersinn</b> (von oben gesehen): Das Bett kommt der Düse näher.'], [G.knobCCW, '<b>Gegen den Uhrzeigersinn:</b> Das Bett senkt sich, der Abstand wird größer.']])}<p>Das Papier soll <b>leicht bremsen</b>: Es klemmt nicht fest, flattert aber auch nicht frei. Die vier Ecken hängen zusammen: Verstellst du eine, ändern sich die Nachbarecken ein wenig mit.</p>`,
          text: 'Das Papier soll sich mit leichtem {0} ziehen lassen. Dreht man das Stellrad im {1}, wird das Bett angehoben. Weil sich beim Verstellen die Nachbarecken mitbewegen, kontrolliert man {2} vier Ecken mehrmals.', gaps: [{ opts: ['Widerstand', 'Spiel', 'Schwung'], ans: 'Widerstand' }, { opts: ['Uhrzeigersinn', 'Gegenuhrzeigersinn'], ans: 'Uhrzeigersinn' }, { opts: ['alle', 'nur zwei', 'keine'], ans: 'alle' }] },
        cr10: { id: 'b2', type: 'gaps', title: 'Stellmuttern und Sensor', q: 'Ordne die passenden Begriffe den Lücken zu.',
          info: `<p>Der CR-10 S Pro nivelliert in zwei Stufen. Zuerst stellst du mit den Stellmuttern die Ecken so ein, dass ein Blatt Papier unter der Düse <b>leicht bremst</b>: Es klemmt nicht fest, flattert aber auch nicht frei. Danach übernimmt der <b>Sensor</b> neben der Düse. Er misst das Bett an 16 Punkten, ohne es zu berühren. Das Mainboard merkt sich die Werte und hebt oder senkt die Düse beim Drucken ein wenig, wo das Bett nicht ganz eben ist.</p>`,
          text: 'Bei der Hilfs-Nivellierung soll das Papier mit leichtem {0} unter der Düse durchrutschen. Danach misst ein {1} neben der Düse das Bett an 16 Punkten. Kleine Unebenheiten gleicht der Drucker beim Drucken {2} aus.', gaps: [{ opts: ['Widerstand', 'Spiel', 'Schwung'], ans: 'Widerstand' }, { opts: ['Sensor', 'Endstop', 'Lüfter'], ans: 'Sensor' }, { opts: ['selbst', 'nicht', 'nur am Rand'], ans: 'selbst' }] },
        a1: { id: 'b2', type: 'gaps', title: 'Automatische Kalibrierung', q: 'Ordne die passenden Begriffe den Lücken zu.',
          info: `<p>Beim A1 drehst du an keinem Stellrad. Vor dem Druck misst er selbst, wie hoch das Bett an vielen Stellen ist. Die Druckplatte ist eine dünne Stahlplatte. <b>Magnete</b> im Heizbett halten sie fest, deshalb lässt sie sich leicht abnehmen und wieder auflegen. Fett von den Fingern auf der Platte sorgt dafür, dass das Filament schlechter klebt. Fasse die Platte deshalb am Rand an.</p>`,
          text: 'Der A1 misst die Höhe des Druckbetts vor dem Druck {0}. Die Druckplatte wird von {1} gehalten. Fett von den Fingern auf der Platte verschlechtert die {2}.', gaps: [{ opts: ['selbst', 'von Hand mit Papier', 'gar nicht'], ans: 'selbst' }, { opts: ['Magneten', 'Schrauben', 'Klebeband'], ans: 'Magneten' }, { opts: ['Haftung', 'Temperatur', 'Geschwindigkeit'], ans: 'Haftung' }] },
        kx: { id: 'b2', type: 'gaps', title: 'LeviQ und Z-Offset', q: 'Ordne die passenden Begriffe den Lücken zu.',
          info: `<p>Beim Kobra X drehst du an keinem Stellrad. Das Nivelliersystem <b>LeviQ</b> misst das Bett vor dem Druck selbst ab und prüft den Abstand der Düse. Bleibt die erste Schicht trotzdem zu flach oder zu rund, stellst du am Touchscreen den <b>Z-Offset</b> nach: Er verschiebt die Düse in sehr kleinen Schritten näher an die Platte oder weiter weg. Fett von den Fingern auf der Platte sorgt dafür, dass das Filament schlechter klebt. Fasse die Platte deshalb am Rand an.</p>`,
          text: 'Das Nivelliersystem LeviQ misst das Druckbett {0} ab. Passt der Abstand der Düse in der ersten Schicht nicht, stellt man den {1} nach. Fett von den Fingern auf der Platte verschlechtert die {2}.', gaps: [{ opts: ['selbst', 'von Hand mit Papier', 'gar nicht'], ans: 'selbst' }, { opts: ['Z-Offset', 'Riemen', 'Lüfter'], ans: 'Z-Offset' }, { opts: ['Haftung', 'Temperatur', 'Geschwindigkeit'], ans: 'Haftung' }] } }),
      { id: 'b3', type: 'sort', title: 'Erste Schicht beurteilen', q: 'Ordne jede Beobachtung an der ersten Schicht dem passenden Abstand zwischen Düse und Bett zu.',
        lesen: `<p>Die erste Schicht zeigt dir, ob das Bett richtig eingestellt ist. Entscheidend ist, wie stark die Düse das weiche Filament gegen ${P.plattePlain} drückt.</p>
          <p>Steht die Düse <b>zu tief</b>, bleibt kaum Platz. Das Filament wird breit und dünn gequetscht, an manchen Stellen scheint ${P.id === 'ender' || P.id === 'cr10' ? 'das Glas' : 'die Platte'} durch. Oft hört man die Düse über die Platte kratzen. Es kommt nur wenig Material heraus, weil die Öffnung fast verschlossen ist. Staut sich das Filament, klickt der Motor des Extruders.</p>
          <p>Steht die Düse <b>zu hoch</b>, fällt das Filament aus der Luft auf das Bett. Es bleibt rund wie eine Schnur und wird nicht angedrückt. Zwischen den Bahnen entstehen Lücken, und die ganze Schicht lässt sich mit dem Fingernagel leicht abschieben.</p>
          <p>Ist der Abstand <b>richtig</b>, wird jede Bahn leicht flachgedrückt. Sie ist etwas breiter als hoch, berührt die Nachbarbahn ohne Lücke und haftet so fest, dass sie sich nicht abschieben lässt.</p>`,
        cats: ['Düse zu nah am Bett', 'Abstand richtig', 'Düse zu weit weg'],
        items: [{ text: P.id === 'ender' || P.id === 'cr10' ? 'Das Glas scheint durch die Bahnen.' : 'Die Platte scheint durch die Bahnen.', cat: 0 }, { text: 'Man hört ein Kratzen.', cat: 0 }, { text: 'Der Extruder-Motor klickt.', cat: 0 }, { text: 'Bahnen etwas breiter als hoch, ohne Lücke', cat: 1 }, { text: 'Die Schicht haftet fest.', cat: 1 }, { text: 'Bahnen rund wie eine Schnur', cat: 2 }, { text: 'Lücken zwischen den Bahnen', cat: 2 }, { text: 'Die Schicht lässt sich abschieben.', cat: 2 }],
        hint: 'Frage dich bei jeder Beobachtung: Wird das Filament zu stark, richtig oder gar nicht angedrückt?', explain: 'Zu nah: gequetscht, kratzt, wenig Material. Zu weit: runde Schnüre, Lücken, schlechte Haftung.' },
      PV({
        ender: { id: 'b4', type: 'match', title: 'Erste Schicht korrigieren', q: 'Ordne jedem Bild einer ersten Schicht die passende Maßnahme zu.', how: 'Tippe links ein Bild an und dann rechts die passende Maßnahme. Zum Lösen einer Verbindung tippe die Maßnahme rechts noch einmal an.',
          info: `<p>Die Bilder zeigen die Düse und die erste Schicht von der Seite, jeweils an einer anderen Ecke des Betts. Wie die Stellräder das Bett bewegen, steht bei Aufgabe 2.</p>`,
          pairs: [[`<span class="pic">${G.far}</span>`, 'Stellrad im Uhrzeigersinn drehen, das Bett kommt näher'], [`<span class="pic">${G.ok}</span>`, 'Nichts verstellen, so soll die erste Schicht aussehen'], [`<span class="pic">${G.near}</span>`, 'Stellrad gegen den Uhrzeigersinn drehen, das Bett senkt sich']],
          hint: 'Erkenne zuerst bei jedem Bild, ob die Düse zu nah, zu weit weg oder richtig steht.', explain: 'Runde Schnüre: Abstand zu groß, Bett anheben. Platte, dünne Bahnen: Abstand zu klein, Bett absenken.' },
        a1: { id: 'b4', type: 'match', title: 'Erste Schicht deuten', q: 'Ordne jedem Bild einer ersten Schicht die passende Folge für den Druck zu.', how: 'Tippe links ein Bild an und dann rechts die passende Folge. Zum Lösen einer Verbindung tippe die Folge rechts noch einmal an.',
          info: `<p>Die Bilder zeigen die Düse und die erste Schicht von der Seite. Beim A1 stellst du den Abstand nicht selbst ein. Sieht die erste Schicht falsch aus, brichst du den Druck ab, prüfst die Druckplatte und holst die Lehrkraft. Was zu nah und zu weit weg bedeutet, steht bei Aufgabe 3.</p>`,
          pairs: [[`<span class="pic">${G.far}</span>`, 'Die Bahnen haften kaum, das Teil kann sich lösen'], [`<span class="pic">${G.ok}</span>`, 'Die Schicht haftet fest, der Druck kann weiterlaufen'], [`<span class="pic">${G.near}</span>`, 'Es kommt kaum Material heraus, die Düse kratzt']],
          hint: 'Erkenne zuerst bei jedem Bild, ob die Düse zu nah, zu weit weg oder richtig steht.', explain: 'Runde Schnüre: Abstand zu groß, das Teil hält schlecht. Platte, dünne Bahnen: Abstand zu klein, die Düse ist fast verschlossen.' },
        def: { id: 'b4', type: 'match', title: 'Erste Schicht korrigieren', q: 'Ordne jedem Bild einer ersten Schicht die passende Maßnahme zu.', how: 'Tippe links ein Bild an und dann rechts die passende Maßnahme. Zum Lösen einer Verbindung tippe die Maßnahme rechts noch einmal an.',
          info: `<p>Die Bilder zeigen die Düse und die erste Schicht von der Seite. Den Abstand der Düse in der ersten Schicht stellst du am Touchscreen mit dem <b>Z-Offset</b> nach${P.id === 'cr10' ? ' (während des Drucks unter „Adjust“)' : ''}. Er bewegt die Düse in sehr kleinen Schritten näher an das Bett oder weiter weg.</p>`,
          pairs: [[`<span class="pic">${G.far}</span>`, 'Z-Offset so ändern, dass die Düse näher an das Bett kommt'], [`<span class="pic">${G.ok}</span>`, 'Nichts verstellen, so soll die erste Schicht aussehen'], [`<span class="pic">${G.near}</span>`, 'Z-Offset so ändern, dass die Düse weiter vom Bett weg ist']],
          hint: 'Erkenne zuerst bei jedem Bild, ob die Düse zu nah, zu weit weg oder richtig steht.', explain: 'Runde Schnüre: Abstand zu groß, Düse näher heran. Platte, dünne Bahnen: Abstand zu klein, Düse weiter weg.' } }),
      { id: 'b5', type: 'mc', title: 'Haftung verbessern', q: 'Erkläre, was die Einstellung „Brim“ bei der Druckplattenhaftung in Cura bewirkt: Kreuze die passende Erklärung an.',
        info: `${fig(G.brim, 'Von oben: Mehrere Linien (blau) laufen als flacher Rand um die erste Schicht des Modells.')}<p>Ein <b>Brim</b> ist ein dünner Rand aus einer Schicht, der direkt am Modell hängt. Er vergrößert die Fläche, die am Bett klebt. Nach dem Druck zieht man ihn einfach ab. Die Breite stellst du in Cura ein, zum Beispiel 8 mm.</p><p>In derselben Liste findest du zwei andere Einstellungen: Ein <b>Skirt</b> ist eine einzelne Linie, die mit etwas Abstand um das Modell läuft. Sie berührt es nicht und dient nur dazu, dass das Filament gleichmäßig fließt, bevor das Modell beginnt. Ein <b>Raft</b> ist ein dickes Gitter aus mehreren Schichten, das unter dem ganzen Modell liegt.</p>`,
        opts: ['Ein flacher Rand am Objekt vergrößert die Fläche, die am Bett haftet.', 'Eine einzelne Linie umfährt das Objekt mit Abstand, ohne es zu berühren.', 'Ein dickes Gitter aus mehreren Schichten liegt unter dem ganzen Objekt.', 'Die erste Schicht wird langsamer und etwas dicker auf das Bett gelegt.'], ans: [0], explain: 'Brim = Rand am Modell. Skirt = Linie mit Abstand, Raft = Gitter unter dem Modell.' },
      { id: 'b6', type: 'num', title: 'Typische Temperaturen', q: `Nenne die üblichen Temperaturen für PLA am ${P.name}.`,
        lesen: `<p>Jeder Kunststoff wird bei einer anderen Temperatur weich. <b>PETG</b> ist zäher und hält mehr Wärme aus als PLA. Damit es sauber fließt, muss die Düse zwischen 230 und 245 °C heiß sein, das Bett 70 bis 80 °C. Das in der Schule übliche <b>PLA</b> schmilzt schon bei geringerer Hitze: Die Düse arbeitet meist mit 200 °C, je nach Rolle zwischen 190 und 215 °C. Das Bett bleibt deutlich kühler als bei PETG. Üblich sind 60 °C, also etwa 50 bis 65 °C.</p>
          <p>Warum wird das Bett überhaupt beheizt? Kunststoff zieht sich beim Abkühlen zusammen. Kühlt die erste Schicht auf ${P.id === 'ender' || P.id === 'cr10' ? 'dem kalten Glas' : 'der kalten Platte'} zu schnell ab, ziehen sich die Ecken hoch und das Teil löst sich (Warping). Ein warmes Bett hält die unterste Schicht etwas weich, sodass sie fest haftet. Zu heiß darf es aber nicht sein, sonst bleibt die Schicht zu weich und verformt sich.</p>
          <p class="hintline">Richtwerte. Die genauen Werte stehen auf der Filamentrolle.</p>`,
        items: [{ q: 'Düsentemperatur', min: 190, max: 215, show: 200, unit: '°C' }, { q: 'Betttemperatur', min: 50, max: 65, show: 60, unit: '°C' }],
        hint: 'Im Text stehen Werte für zwei Kunststoffe. Gefragt ist nur PLA.' }
    ]

/* ---------- Fortschritt ---------- */
function modStats(m) { let d = 0, a = 0; m.tasks.forEach(t => { const s = S.tasks[t.id]; if (s && s.done) { d++; if (s.assisted) a++; } }); return { done: d, total: m.tasks.length, assisted: a }; }
function overall() { let d = 0, t = 0; MODULES.forEach(m => { const s = modStats(m); d += s.done; t += s.total; }); return { done: d, total: t, pct: t ? Math.round(100 * d / t) : 0 }; }
function bestTest() { const a = S.test.attempts; if (!a.length) return null; return a.reduce((b, x) => x.score > b.score ? x : b, a[0]); }

function navItems() {
  const items = [{ href: '#/start', label: 'Start', key: 'start' }];
  MODULES.forEach((m, i) => { const s = modStats(m); items.push({ href: '#/m/' + m.id, label: `${i + 1}  ${m.short}`, key: 'm:' + m.id, cnt: `${s.done}/${s.total}`, done: s.done === s.total }); });
  const b = bestTest();
  items.push({ href: '#/test', label: 'Abschlusstest', key: 'test', cnt: b ? `${b.score}/${b.max}` : '', done: !!b });
  items.push({ href: '#/export', label: 'Export & Code', key: 'export' });
  return items;
}

    h('div', { class: 'pills' }, navItems().map(it => h('a', { href: it.href, 'aria-current': curKey() === it.key ? 'page' : null }, it.label.replace('  ', ' '))))

function toggleTheme() {
  const cur = document.documentElement.getAttribute('data-theme');
  const sysDark = window.matchMedia && matchMedia('(prefers-color-scheme:dark)').matches;
  const next = cur ? (cur === 'dark' ? 'light' : 'dark') : (sysDark ? 'light' : 'dark');
  document.documentElement.setAttribute('data-theme', next); S.theme = next; save();
}

<script>/* lp-shell-Adapter: Modul-Bauart (Elektroinstallation, 3D-Druck): MODULES, navItems(), curKey(), modStats(), Router über #/…

(function () {
  var tries = 0;
  function start() {

    if (!window.LPShell || typeof navItems !== 'function' || !side || !side.querySelector('.brand')) { if (++tries < 200) setTimeout(start, 50); return; }
