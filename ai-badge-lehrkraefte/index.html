<script>
(function(){
  var KIND='html', FILE='', KEY='lp-lehrkraefte-pw';
  var P=JSON.parse(document.getElementById('payload').textContent);
  var $=function(id){return document.getElementById(id);};
  function b64(s){var b=atob(s),u=new Uint8Array(b.length);for(var i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u;}
  async function decrypt(pw){
    var base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
    var key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(P.salt),iterations:P.iter,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
    return new Uint8Array(await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(P.iv)},key,b64(P.ct)));
  }
  function show(bytes){
    if(KIND==='html'){var html=new TextDecoder().decode(bytes);document.open();document.write(html);document.close();return;}
    var url=URL.createObjectURL(new Blob([bytes],{type:'application/pdf'}));
    var out=$('out');out.hidden=false;$('f').hidden=true;$('msg').textContent='Entsperrt.';
    var a=document.createElement('a');a.className='btn';a.href=url;a.target='_blank';a.rel='noopener';a.textContent='PDF öffnen';
    var d=document.createElement('a');d.className='btn ghost';d.href=url;d.download=FILE;d.textContent='PDF herunterladen';
    out.append(a,d);
  }
  async function tryOpen(pw,silent){
    if(!window.crypto||!crypto.subtle){$('msg').textContent='Dieser Browser kann die Seite nicht entsperren. Bitte einen aktuellen Browser verwenden.';$('msg').className='msg bad';return;}
    $('go').disabled=true;if(!silent){$('msg').className='msg';$('msg').textContent='Wird entsperrt …';}
    try{
      var bytes=await decrypt(pw);
      if($('keep').checked){try{localStorage.setItem(KEY,pw);}catch(e){}}
      show(bytes);
    }catch(e){
      try{if(silent)localStorage.removeItem(KEY);}catch(x){}
      $('msg').className='msg bad';$('msg').textContent=silent?'':'Das Passwort stimmt nicht. Achte auf Groß- und Kleinschreibung und die Bindestriche.';
    }finally{var g=$('go');if(g)g.disabled=false;}
  }
  $('show').addEventListener('change',function(){$('pw').type=this.checked?'text':'password';});
  $('f').addEventListener('submit',function(e){e.preventDefault();tryOpen($('pw').value.trim().normalize('NFC'),false);});
  var saved=null;try{saved=localStorage.getItem(KEY);}catch(e){}
  if(saved){$('keep').checked=true;tryOpen(saved,true);}
})();
</script>
