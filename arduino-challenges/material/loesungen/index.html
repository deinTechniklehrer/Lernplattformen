<style>
:root{--bg:#eef3f8;--card:#ffffff;--ink:#14212e;--muted:#56657a;--line:#cfd9e4;--accent:#0b5aa2;--accent-ink:#ffffff;--bad:#b3261e;--f:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;color-scheme:light}

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.5 var(--f);display:grid;place-items:center;padding:24px max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px))}
main{width:100%;max-width:440px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:28px 24px;display:flex;flex-direction:column;gap:14px}
.lock{width:44px;height:44px;border-radius:50%;background:var(--accent);display:grid;place-items:center}
.lock svg{width:22px;height:22px;stroke:var(--accent-ink);fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
h1{font-size:1.45rem;line-height:1.2;margin:0;text-wrap:balance}
p{margin:0;color:var(--muted)}
label{font-weight:700;font-size:.95rem}
input[type=password],input[type=text]{width:100%;font:inherit;padding:11px 12px;border:1.5px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
input:focus-visible,button:focus-visible,a:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.row{display:flex;align-items:center;gap:8px;font-size:.95rem;color:var(--muted)}
button,.btn{font:700 1rem var(--f);padding:11px 16px;border-radius:8px;border:0;background:var(--accent);color:var(--accent-ink);cursor:pointer;text-align:center;text-decoration:none}
button[disabled]{opacity:.6;cursor:wait}
.btn.ghost{background:transparent;color:var(--accent);border:1.5px solid var(--accent)}
.msg{min-height:1.4em;font-size:.95rem}
.msg.bad{color:var(--bad)}
.out{display:flex;flex-direction:column;gap:10px}
footer{font-size:.8rem;color:var(--muted)}
</style>

  <h1>Arduino-Challenges: Lösungen</h1>

      if($('keep').checked){try{localStorage.setItem(KEY,pw);}catch(e){}}
      show(bytes);
    }catch(e){
      try{if(silent)localStorage.removeItem(KEY);}catch(x){}
      $('msg').className='msg bad';$('msg').textContent=silent?'':'Das Passwort stimmt nicht. Achte auf Groß- und Kleinschreibung und die Bindestriche.';
    }finally{var g=$('go');if(g)g.disabled=false;}
  }
  $('show').addEventListener('change',function(){$('pw').type=this.checked?'text':'password';});
  $('f').addEventListener('submit',function(e){e.preventDefault();tryOpen($('pw').value.trim().normalize('NFC'),false);});
  var saved=null;try{saved=localStorage.getItem(KEY);}catch(e){}
  if(saved){$('keep').checked=true;tryOpen(saved,true);}
})();
</script>
