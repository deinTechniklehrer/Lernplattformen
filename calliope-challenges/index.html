<style>
[hidden]{display:none!important}
:root{
  --ground:#eef0ea; --ground-dot:#d9ddd3; --surface:#ffffff; --surface-2:#f6f7f3; --line:#d5d9cf; --line-strong:#b9bfb2;
  --ink:#1c2a2d; --muted:#56676b; --accent:#0a7570; --accent-ink:#ffffff; --accent-soft:#d6ecea;
  --signal:#d9481f; --signal-soft:#fbe3da; --ok:#1f8a4c; --ok-soft:#dcf1e3; --warn:#b7791f; --warn-soft:#fbefd9; --bad:#c23b3b; --bad-soft:#f8dede;
  --code-bg:#fbfbf9; --code-kw:#7a2a9a; --code-num:#16734a; --code-com:#a0591c; --code-str:#b0322c; --code-fn:#1c2a2d;
  --b-out:#6d85e6; --b-ctl:#e7ae3c; --b-math:#6cbf53; --b-var:#c057d1; --b-in:#9a5cf5; --b-com:#9a9a9a; --b-txt:#ffffff;
  --shadow:0 1px 2px rgba(20,40,40,.06),0 4px 16px rgba(20,40,40,.06);
  --r:10px; --font:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif; --disp:"Bricolage Grotesque","Atkinson Hyperlegible",system-ui,sans-serif; --mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark;
  --ground:#11181a; --ground-dot:#1b2528; --surface:#182224; --surface-2:#1d292b; --line:#2a383b; --line-strong:#3a4b4f;
  --ink:#e2ebe9; --muted:#9db0b3; --accent:#3cbdb2; --accent-ink:#06201e; --accent-soft:#16393a;
  --signal:#ff7b54; --signal-soft:#3d2219; --ok:#4cc27d; --ok-soft:#173424; --warn:#e5a94a; --warn-soft:#3a2d15; --bad:#f07171; --bad-soft:#3d1c1c;
  --code-bg:#141d1f; --code-kw:#d08cf0; --code-num:#6fd3a0; --code-com:#e0a064; --code-str:#ff8f86; --code-fn:#e2ebe9;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.25);
}}
:root[data-theme="dark"]{
  color-scheme:dark;
  --ground:#11181a; --ground-dot:#1b2528; --surface:#182224; --surface-2:#1d292b; --line:#2a383b; --line-strong:#3a4b4f;
  --ink:#e2ebe9; --muted:#9db0b3; --accent:#3cbdb2; --accent-ink:#06201e; --accent-soft:#16393a;
  --signal:#ff7b54; --signal-soft:#3d2219; --ok:#4cc27d; --ok-soft:#173424; --warn:#e5a94a; --warn-soft:#3a2d15; --bad:#f07171; --bad-soft:#3d1c1c;
  --code-bg:#141d1f; --code-kw:#d08cf0; --code-num:#6fd3a0; --code-com:#e0a064; --code-str:#ff8f86; --code-fn:#e2ebe9;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.25);
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--ground);background-image:radial-gradient(var(--ground-dot) 1.2px,transparent 1.3px);background-size:18px 18px;color:var(--ink);font:16px/1.55 var(--font)}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h1,h2,h3,h4{font-family:var(--disp);line-height:1.2;text-wrap:balance;margin:0}
p{margin:0}
img{max-width:100%;height:auto}
code,.mono{font-family:var(--mono);font-size:.9em}
.hidden{display:none!important}
body[data-mode="block"] .m-code{display:none!important}
body[data-mode="code"] .m-block{display:none!important}

/* ---------- Top bar ---------- */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;display:flex;align-items:center;gap:12px;padding:10px 16px;background:var(--surface);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand-mark{width:34px;height:34px;flex:none}
.brand-t{font-family:var(--disp);font-weight:700;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand-s{font-size:12px;color:var(--muted);white-space:nowrap}
.topbar .spacer{flex:1}
.navtoggle{display:none;border:1px solid var(--line);background:var(--surface-2);border-radius:8px;padding:6px 10px;cursor:pointer}
.modeswitch{display:flex;border:1px solid var(--line-strong);border-radius:8px;overflow:hidden;background:var(--surface-2)}
.modeswitch button{border:0;background:transparent;padding:6px 12px;cursor:pointer;display:flex;gap:6px;align-items:center;font-size:14px;font-weight:700;color:var(--muted)}
.modeswitch button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.modeswitch .sw{width:12px;height:12px;border-radius:3px;display:inline-block}
.savestate{font-size:12px;color:var(--muted);white-space:nowrap}
.savestate b{color:var(--ok)}
.iconbtn{border:1px solid var(--line);background:var(--surface-2);border-radius:8px;padding:6px 10px;cursor:pointer;font-size:14px}

/* ---------- Layout ---------- */
.shell{display:grid;grid-template-columns:290px minmax(0,1fr);min-height:calc(100% - 57px)}
.side{border-right:1px solid var(--line);background:var(--surface);padding:14px 10px 40px;position:sticky;top:57px;height:calc(100vh - 57px);overflow:auto}
.main{padding-block:24px 80px;padding-inline:16px;min-width:0}
.page{max-width:880px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
@media (max-width:900px){
  .shell{grid-template-columns:1fr}
  .side{position:fixed;left:0;top:57px;bottom:0;width:min(320px,88vw);z-index:40;transform:translateX(-102%);transition:transform .2s;box-shadow:var(--shadow);height:auto}
  body.nav-open .side{transform:none}
  .navtoggle{display:inline-block}
  .brand-s,.savestate{display:none}
}
@media (max-width:520px){.brand-t{font-size:14px;max-width:38vw}.topbar{gap:8px;padding:8px 12px}.modeswitch button{padding:6px 8px;font-size:13px}.modeswitch .lbl-long{display:none}}
@media (max-width:380px){.brand-t{display:none}}

/* ---------- Sidebar nav ---------- */
.nav-prof{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:8px 10px 14px;border-bottom:1px solid var(--line);margin-bottom:8px}
.nav-prof .av{width:36px;height:36px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:700;font-family:var(--disp)}
.nav-prof .n{font-weight:700;font-size:14px}
.nav-prof .k{font-size:12px;color:var(--muted)}
.nav-total{margin:6px 10px 10px;font-size:12px;color:var(--muted)}
.bar{height:6px;border-radius:4px;background:var(--line);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:4px;transition:width .3s}
.nav-mod{margin:14px 10px 4px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.nav-item{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:0;background:transparent;padding:7px 10px;border-radius:8px;cursor:pointer;font-size:14px;line-height:1.3}
.nav-item:hover{background:var(--surface-2)}
.nav-item[aria-current="page"]{background:var(--accent-soft);font-weight:700}
.ring{--p:0;width:20px;height:20px;border-radius:50%;flex:none;background:conic-gradient(var(--accent) calc(var(--p)*1%),var(--line) 0);display:grid;place-items:center}
.ring::after{content:"";width:12px;height:12px;border-radius:50%;background:var(--surface)}
.ring.done{background:var(--ok)}
.ring.done::after{content:"✓";width:auto;height:auto;background:none;color:#fff;font-size:12px;font-weight:700}
.nav-item .tag{margin-left:auto;font-size:10px;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:0 4px}

/* ---------- Cards / sections ---------- */
.hero{display:flex;flex-direction:column;gap:10px}
.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);font-weight:700}
.hero h1{font-size:clamp(26px,4vw,36px)}
.goal{display:flex;gap:10px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.goal .gi{font-weight:700;color:var(--accent);white-space:nowrap}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:12px;box-shadow:var(--shadow)}
.card h2{font-size:21px}
.card h3{font-size:17px}
.sec-h{display:flex;align-items:center;gap:6px 10px;flex-wrap:wrap}
.sec-h h2{min-width:0}
.sec-h .kind{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:2px 8px;border-radius:20px;background:var(--surface-2);border:1px solid var(--line);color:var(--muted)}
.kind.task{background:var(--signal-soft);color:var(--signal);border-color:transparent}
.kind.ex{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.kind.sub{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.prose{display:flex;flex-direction:column;gap:10px;max-width:68ch;min-width:0}
.prose code,li code,td code{overflow-wrap:anywhere}
h1,h2,h3{overflow-wrap:break-word;hyphens:auto;-webkit-hyphens:auto}
.prose ul,.prose ol{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:4px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}
.two.wide-l{grid-template-columns:3fr 2fr}
@media (max-width:700px){.two,.two.wide-l{grid-template-columns:1fr}}
.fig{margin:0;display:flex;flex-direction:column;gap:6px}
.fig img{border-radius:8px;border:1px solid var(--line);background:#fff}
.fig figcaption{font-size:13px;color:var(--muted)}
.fig.small img{max-width:260px}
.note{border-left:4px solid var(--accent);background:var(--accent-soft);padding:10px 12px;border-radius:0 8px 8px 0;font-size:15px}
.note.warn{border-color:var(--warn);background:var(--warn-soft)}
.note.bad{border-color:var(--bad);background:var(--bad-soft)}
.note.tip{border-color:var(--signal);background:var(--signal-soft)}
.note.okn{border-color:var(--ok);background:var(--ok-soft)}
.kbd{font-family:var(--mono);font-size:.85em;border:1px solid var(--line-strong);border-bottom-width:2px;border-radius:4px;padding:0 5px;background:var(--surface-2)}
.pill{display:inline-block;font-size:12px;padding:1px 8px;border-radius:20px;background:var(--surface-2);border:1px solid var(--line)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{border:1px solid var(--line-strong);background:var(--surface);border-radius:8px;padding:8px 14px;cursor:pointer;font-weight:700;font-size:15px;display:inline-flex;gap:8px;align-items:center}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.05)}
.btn.small{padding:4px 10px;font-size:13px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.linkcard{display:flex;gap:12px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:8px;text-decoration:none;color:var(--ink);background:var(--surface-2);max-width:460px}
.linkcard img{width:120px;border-radius:6px;flex:none}
.linkcard b{display:block}
.linkcard span{font-size:13px;color:var(--muted)}
.pager{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}

/* tasks */
.tasks{display:flex;flex-direction:column;gap:8px;margin:0;padding:0;list-style:none}
.task{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface-2)}
.task input{width:20px;height:20px;margin-top:2px;accent-color:var(--ok);flex:none}
.task.done{background:var(--ok-soft);border-color:transparent}
.task label{cursor:pointer}

/* ---------- Code view ---------- */
.prog{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--code-bg)}
.prog-h{display:flex;align-items:center;gap:8px;padding:6px 8px;background:var(--surface-2);border-bottom:1px solid var(--line);font-size:13px;flex-wrap:wrap}
.prog-h .ttl{font-weight:700;margin-right:auto}
.prog-tabs{display:flex;border:1px solid var(--line-strong);border-radius:6px;overflow:hidden}
.prog-tabs button{border:0;background:var(--surface);padding:3px 10px;cursor:pointer;font-size:12px;font-weight:700;color:var(--muted)}
.prog-tabs button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
.prog-b{overflow:auto;max-height:560px}
.codeview{margin:0;padding:10px 0;font:13.5px/1.6 var(--mono);color:var(--code-fn);counter-reset:ln;min-width:max-content}
.codeview .ln{display:block;padding:0 14px 0 0;white-space:pre}
.codeview .ln::before{counter-increment:ln;content:counter(ln);display:inline-block;width:34px;text-align:right;margin-right:14px;color:var(--muted);opacity:.6}
.codeview .ln.hl{background:rgba(231,174,60,.22)}
.tk-kw{color:var(--code-kw)} .tk-num{color:var(--code-num)} .tk-com{color:var(--code-com)} .tk-str{color:var(--code-str)} .tk-pp{color:var(--muted)}
.blockview{padding:14px;min-width:max-content;background:var(--code-bg);background-image:radial-gradient(var(--ground-dot) 1px,transparent 1.2px);background-size:16px 16px}
.prog-foot{padding:6px 10px;font-size:12px;color:var(--muted);border-top:1px solid var(--line);background:var(--surface-2)}

/* ---------- Blocks (Tinkercad look) ---------- */
.bk-stack{display:flex;flex-direction:column;align-items:flex-start}
.bk{--c:var(--b-out);position:relative;display:inline-flex;align-items:center;flex-wrap:nowrap;gap:5px;background:var(--c);color:var(--b-txt);font:700 12.5px/1 var(--font);padding:7px 9px 7px 10px;border-radius:5px;margin-top:-1px;border:1px solid rgba(0,0,0,.14);min-height:34px;white-space:nowrap}
.bk.notch::before{content:"";position:absolute;left:14px;top:-1px;width:22px;height:5px;background:var(--code-bg);clip-path:polygon(0 0,100% 0,78% 100%,22% 100%);opacity:.85}
.bk.hl,.bk-c.hl>.bk-head{outline:3px solid var(--ink);outline-offset:1px}
.bk.out{--c:var(--b-out)} .bk.ctl{--c:var(--b-ctl)} .bk.var{--c:var(--b-var)} .bk.com{--c:var(--b-com)} .bk.inp{--c:var(--b-in)} .bk.math{--c:var(--b-math)}
.bk-c{--c:var(--b-ctl);display:flex;flex-direction:column;align-items:flex-start;margin-top:-1px}
.bk-c>.bk-head,.bk-c>.bk-mid,.bk-c>.bk-foot{background:var(--c);color:#fff;font:700 12.5px/1 var(--font);display:inline-flex;align-items:center;gap:5px;padding:7px 10px;border:1px solid rgba(0,0,0,.14);white-space:nowrap}
.bk-c>.bk-head{border-radius:5px 5px 5px 0;min-height:34px;min-width:120px}
.bk-c.hat>.bk-head{border-radius:18px 18px 5px 0;padding-top:12px;min-width:110px}
.bk-c>.bk-mid{border-radius:0 5px 5px 0;min-width:70px;min-height:24px}
.bk-c>.bk-foot{border-radius:0 5px 5px 5px;min-width:130px;height:20px;justify-content:flex-end;padding:0 8px;font-size:12px}
.bk-c>.bk-body{border-left:16px solid var(--c);padding:3px 0 3px 0;min-height:20px;display:flex;flex-direction:column;align-items:flex-start}
.bk-c>.bk-body:empty{min-height:22px}
.bk .dd,.bk-c .dd{background:rgba(0,0,0,.12);border:1px solid rgba(0,0,0,.18);border-radius:4px;padding:4px 6px;font-weight:700}
.bk .dd::after,.bk-c .dd::after{content:" ▾";font-size:10px}
.bk .num,.bk-c .num,.bk .txt{background:#fff;color:#333;border-radius:20px;padding:4px 9px;font-weight:600;min-width:22px;text-align:center}
.bk .txt{border-radius:12px}
.bk input.num,.bk-c input.num{width:auto;border:0;font:600 12.5px/1 var(--font);outline:none;padding:4px 8px;field-sizing:content;min-width:28px;max-width:70px}
.bk .rep{display:inline-flex;align-items:center;gap:4px;border-radius:20px;padding:4px 8px;border:1px solid rgba(0,0,0,.15)}
.bk .rep.var,.bk-c .rep.var{background:var(--b-var)}
.bk .rep.inp,.bk-c .rep.inp{background:var(--b-in)}
.bk .rep.math,.bk-c .rep.math{background:var(--b-math)}
.bk-c .rep{display:inline-flex;align-items:center;gap:4px;border-radius:20px;padding:4px 8px;border:1px solid rgba(0,0,0,.15)}
.hex{display:inline-flex;align-items:center;gap:4px;background:var(--b-math);padding:4px 12px;clip-path:polygon(9px 0,calc(100% - 9px) 0,100% 50%,calc(100% - 9px) 100%,9px 100%,0 50%)}
.colorsw{width:22px;height:18px;border-radius:9px;border:2px solid #fff;display:inline-block}
.bk.com .txt{background:#fff;color:#555;font-weight:400;max-width:360px;overflow:hidden;text-overflow:ellipsis}
.bk-vars{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px;align-items:center;font-size:12px;color:var(--muted)}
.bk-vars .rep{background:var(--b-var);color:#fff;border-radius:20px;padding:3px 9px;font-weight:700;font-size:12px}
.bk-note{font-size:12px;color:var(--muted);margin-top:10px;max-width:420px;white-space:normal}

/* ---------- Simulator ---------- */
.sim{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface)}
.sim-h{display:flex;gap:8px;align-items:center;padding:8px 10px;background:var(--surface-2);border-bottom:1px solid var(--line);flex-wrap:wrap}
.sim-h .ttl{font-weight:700;font-family:var(--disp);margin-right:auto}
.sim-grid{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:0}
@media (max-width:760px){.sim-grid{grid-template-columns:1fr}}
.sim-edit{border-right:1px solid var(--line);min-width:0}
@media (max-width:760px){.sim-edit{border-right:0;border-bottom:1px solid var(--line)}}
.sim-edit textarea{width:100%;min-height:260px;border:0;resize:vertical;background:var(--code-bg);font:13.5px/1.6 var(--mono);padding:10px 12px;tab-size:2;outline:none;white-space:pre;overflow:auto}
.sim-edit .blockview{max-height:420px;overflow:auto}
.sim-out{display:flex;flex-direction:column;gap:10px;padding:12px;min-width:0}
.board{display:flex;flex-direction:column;gap:10px;align-items:stretch}
.pinrow{display:grid;grid-template-columns:repeat(14,1fr);gap:3px;background:#2c5f7c;padding:6px 6px 4px;border-radius:6px}
.pin{display:flex;flex-direction:column;align-items:center;gap:2px;font:700 9px/1 var(--mono);color:#dfe9ef}
.pin i{width:100%;aspect-ratio:1;max-width:16px;background:#1a1a1a;border-radius:2px;box-shadow:inset 0 0 0 2px #444;transition:background .06s}
.pin.on i{background:#ffd34d;box-shadow:0 0 6px #ffd34d}
.pin.pwm span::before{content:"~"}
.parts{display:flex;gap:14px;flex-wrap:wrap;align-items:flex-end}
.part{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;color:var(--muted);min-width:56px}
.ledbulb{--c:#e53935;--l:0;width:30px;height:38px;border-radius:15px 15px 4px 4px;background:color-mix(in srgb,var(--c) calc(25% + var(--l)*75%),#555);box-shadow:0 0 calc(var(--l)*24px) calc(var(--l)*6px) color-mix(in srgb,var(--c) 80%,transparent);border:1px solid rgba(0,0,0,.3);transition:background .05s,box-shadow .05s}
.rgbbulb{width:34px;height:40px;border-radius:17px 17px 4px 4px;border:1px solid rgba(0,0,0,.3)}
.servo-dial{width:64px;height:40px;position:relative;border-radius:64px 64px 0 0;background:var(--surface-2);border:1px solid var(--line-strong);overflow:hidden}
.servo-dial i{position:absolute;left:50%;bottom:0;width:3px;height:34px;background:var(--signal);transform-origin:bottom center;transition:transform .3s}
.neo{display:flex;gap:4px;background:#222;padding:6px;border-radius:4px}
.neo i{width:16px;height:16px;border-radius:3px;background:#333}
.serial{background:#0f1719;color:#c9f5e4;font:12.5px/1.45 var(--mono);border-radius:8px;padding:8px 10px;height:130px;overflow:auto;white-space:pre-wrap}
.serial:empty::before{content:"Serieller Monitor (leer)";color:#6b8a86}
.sim-ctrl{display:flex;flex-direction:column;gap:8px;font-size:14px}
.sim-ctrl label{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sim-ctrl input[type=range]{flex:1;min-width:140px;accent-color:var(--accent)}
.timeline{width:100%;height:auto;border:1px solid var(--line);border-radius:8px;background:var(--code-bg)}
.sim-msg{font-size:13px;padding:6px 10px;border-radius:6px}
.sim-msg.err{background:var(--bad-soft);color:var(--bad)}
.sim-msg.info{background:var(--surface-2);color:var(--muted)}
.clock{font:700 13px var(--mono);color:var(--muted)}

/* ---------- Exercises ---------- */
.ex{display:flex;flex-direction:column;gap:12px}
.ex-foot{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.score{font-weight:700;font-size:14px;padding:4px 10px;border-radius:20px}
.score.ok{background:var(--ok-soft);color:var(--ok)}
.score.mid{background:var(--warn-soft);color:var(--warn)}
.score.no{background:var(--bad-soft);color:var(--bad)}
.q{display:flex;flex-direction:column;gap:8px;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--surface-2)}
.q .qt{font-weight:700}
.q .qn{font-size:12px;color:var(--muted)}
.opts{display:flex;flex-direction:column;gap:6px}
.opt{display:flex;gap:10px;align-items:center;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);cursor:pointer}
.opt input{accent-color:var(--accent);width:18px;height:18px}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.miss{border-style:dashed;border-color:var(--ok)}
.tf{display:flex;gap:8px}
.tf .opt{flex:1;justify-content:center}
.blank{border:0;border-bottom:2px solid var(--line-strong);background:var(--surface);padding:2px 6px;min-width:110px;border-radius:4px 4px 0 0}
.blank.right{border-color:var(--ok);background:var(--ok-soft)}
.blank.wrong{border-color:var(--bad);background:var(--bad-soft)}
.fb{font-size:14px}
.fb.ok{color:var(--ok)} .fb.no{color:var(--bad)}

/* sort */
.pool{display:flex;flex-wrap:wrap;gap:8px;min-height:48px;padding:10px;border:2px dashed var(--line-strong);border-radius:10px;background:var(--surface-2)}
.pool:has(.chip.card),.bucket .in:has(.chip.card){display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,280px),1fr));gap:8px}
.pool:has(.chip.card .bksvg),.bucket .in:has(.chip.card .bksvg){grid-template-columns:repeat(auto-fill,minmax(min(100%,370px),1fr))}
.ex:has(.chip.card .bksvg) .buckets{grid-template-columns:1fr}
.pool:empty::after{content:"Alle Karten sind verteilt.";color:var(--muted);font-size:14px}
.chip{border:1px solid var(--line-strong);background:var(--surface);border-radius:8px;padding:6px 10px;cursor:pointer;font-size:14.5px;font-weight:700;user-select:none;display:inline-flex;align-items:center;gap:6px;max-width:100%}
.chip[aria-pressed="true"]{outline:3px solid var(--accent);outline-offset:1px}
.chip.right{border-color:var(--ok);background:var(--ok-soft)}
.chip.wrong{border-color:var(--bad);background:var(--bad-soft)}
.chip.card{flex-direction:column;align-items:flex-start;font-weight:400;padding:8px}
.buckets{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.bucket{border:2px solid var(--line);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:8px;min-height:110px;background:var(--surface);cursor:pointer}
.bucket.armed{border-color:var(--accent);background:var(--accent-soft)}
.bucket h4{font-size:15px;display:flex;justify-content:space-between}
.bucket .in{display:flex;flex-wrap:wrap;gap:6px}
.hint{font-size:13px;color:var(--muted)}

/* hotspot */
.hs-wrap{position:relative;display:inline-block;max-width:100%;align-self:flex-start;width:fit-content}
.hs-wrap img{display:block;border-radius:8px;border:1px solid var(--line)}
.hs{position:absolute;transform:translate(-50%,-50%);border:2px solid #fff;background:var(--signal);color:#fff;border-radius:20px;min-width:30px;height:30px;padding:0 8px;font-weight:700;font-size:13px;cursor:pointer;box-shadow:0 2px 6px rgba(0,0,0,.35);white-space:nowrap;display:flex;align-items:center;justify-content:center}
.hs.filled{background:var(--ink);color:var(--surface);border-color:var(--surface)}
.hs.right{background:var(--ok)} .hs.wrong{background:var(--bad)}
.hs.armed{outline:3px solid var(--accent)}

/* table exercise */
.tbl-wrap{overflow-x:auto}
table.ex-t{border-collapse:collapse;width:100%;font-size:14.5px}
table.ex-t select{min-width:8.5em}
.ex-t th,.ex-t td{border:1px solid var(--line);padding:8px;text-align:left;vertical-align:middle}
.ex-t th{background:var(--surface-2);font-family:var(--disp)}
.ex-t select{width:100%;padding:6px;border-radius:6px;border:1px solid var(--line-strong);background:var(--surface)}
.ex-t select.right{border-color:var(--ok);background:var(--ok-soft)}
.ex-t select.wrong{border-color:var(--bad);background:var(--bad-soft)}
.eva-h{font-size:11px;text-transform:uppercase;letter-spacing:.06em}

/* text mark */
.marktext{line-height:2.1;font-size:16px;max-width:70ch}
.mw{border-radius:4px;padding:1px 3px;cursor:pointer;border-bottom:2px dotted var(--line-strong)}
.mw:hover{background:var(--surface-2)}
.mw.s{background:#cfe3ff;color:#123;border-bottom-color:#3b7ddd}
.mw.a{background:#ffe0c7;color:#321;border-bottom-color:#e07a2a}
.mw.right{outline:2px solid var(--ok)} .mw.wrong{outline:2px solid var(--bad)}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:13px}
.legend span{display:inline-flex;gap:6px;align-items:center}
.legend i{width:14px;height:14px;border-radius:3px;display:inline-block}

/* parsons */
.parsons{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:700px){.parsons{grid-template-columns:1fr}}
.pz-col{border:2px dashed var(--line-strong);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:6px;min-height:160px;background:var(--surface-2)}
.pz-col.target{border-style:solid;border-color:var(--accent);background:var(--code-bg)}
.pz-col h4{font-size:14px}
.pz-item{display:flex;align-items:center;gap:6px;cursor:pointer}
.pz-item .ctr{display:flex;gap:2px;margin-left:auto}
.pz-item .ctr button{border:1px solid var(--line);background:var(--surface);border-radius:4px;cursor:pointer;padding:0 6px;font-size:13px}
.pz-code{font:13.5px var(--mono);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:5px 8px}
.pz-fixed{font:13px var(--mono);color:var(--muted);padding:2px 4px;white-space:pre}

/* timeline demo */
.tl{display:grid;grid-template-columns:auto repeat(6,1fr);gap:3px;font-size:13px;align-items:center}
.tl .h{font-size:11px;color:var(--muted);text-align:center}
.tl .c{height:28px;border-radius:4px;background:var(--line)}
.tl .c.r{background:#e53935} .tl .c.g{background:#2e9d4b}
.tl .lab{padding-right:8px;font-weight:700}

/* circuit builder */
.cb{display:flex;flex-direction:column;gap:10px}
.cb svg{width:100%;height:auto;border-radius:10px;border:1px solid var(--line);background:#f1f1ee}
.cb-steps{display:flex;gap:6px;flex-wrap:wrap}
.cb-steps button{width:30px;height:30px;border-radius:50%;border:1px solid var(--line-strong);background:var(--surface);cursor:pointer;font-weight:700;font-size:13px}
.cb-steps button[aria-current="step"],.cb-steps button.seen[aria-current="step"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.cb-steps button.seen{background:var(--accent-soft)}
.cb-text{min-height:64px;font-size:15.5px;background:var(--surface-2);border-radius:8px;padding:10px 12px;border:1px solid var(--line)}
.cb-text b{color:var(--accent)}

/* submission */
.sub-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:700px){.sub-grid{grid-template-columns:1fr}}
.drop{border:2px dashed var(--line-strong);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:8px;align-items:center;justify-content:center;text-align:center;min-height:150px;background:var(--surface-2);cursor:pointer;font-size:14px;color:var(--muted)}
.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.drop img{max-height:220px;border-radius:6px;border:1px solid var(--line)}
.sub-grid textarea{width:100%;min-height:150px;font:13px/1.5 var(--mono);border:1px solid var(--line-strong);border-radius:8px;padding:8px;background:var(--code-bg);white-space:pre;resize:vertical}
.checklist{display:flex;flex-direction:column;gap:6px;margin:0;padding:0;list-style:none}
.checklist li{display:flex;gap:8px;align-items:flex-start;font-size:14.5px}
.checklist .st{flex:none;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;color:#fff}
.st.ok{background:var(--ok)} .st.no{background:var(--bad)} .st.wa{background:var(--warn)} .st.q{background:var(--line-strong)}
.aibox{border:1px solid var(--line);border-radius:10px;padding:12px;background:var(--surface-2);font-size:15px;display:flex;flex-direction:column;gap:8px}
.aibox .kilist{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px}
.aibox textarea.prompt{width:100%;min-height:170px;font:12.5px/1.5 var(--mono);border:1px solid var(--line-strong);border-radius:8px;padding:8px;background:var(--code-bg);color:var(--ink);white-space:pre-wrap;resize:vertical;margin-top:6px}

/* start page */
.start-hero{display:grid;grid-template-columns:1.3fr 1fr;gap:20px;align-items:center}
@media (max-width:760px){.start-hero{grid-template-columns:1fr}}
.start-hero h1{font-size:clamp(30px,5vw,46px);letter-spacing:-.01em}
.start-hero .lead{font-size:18px;color:var(--muted);max-width:52ch}
.field{display:flex;flex-direction:column;gap:4px;font-size:14px;font-weight:700}
.field input,.field select{font-weight:400;padding:8px 10px;border:1px solid var(--line-strong);border-radius:8px;background:var(--surface)}
.modecards{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr));gap:10px}
.modecard{min-width:0;overflow:hidden;border:2px solid var(--line);border-radius:10px;padding:12px;background:var(--surface);cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:8px}
.modecard[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.modecard b{font-family:var(--disp);font-size:17px}
.modgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.modtile{border:1px solid var(--line);border-radius:10px;padding:12px;background:var(--surface);display:flex;flex-direction:column;gap:8px;cursor:pointer;text-align:left}
.modtile:hover{border-color:var(--accent)}
.modtile .mt{font-family:var(--disp);font-weight:700}
.modtile .ms{font-size:13px;color:var(--muted)}
.codebox{font:700 22px var(--mono);letter-spacing:.12em;background:var(--surface-2);border:1px dashed var(--line-strong);border-radius:8px;padding:6px 12px;display:inline-block}

/* test & export */
.testq{display:flex;flex-direction:column;gap:8px}
.result-big{font-family:var(--disp);font-size:40px;font-weight:800}
.exp-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.overview{width:100%;border-collapse:collapse;font-size:14px}
.overview td,.overview th{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left}
.overview td.num{text-align:right;font-variant-numeric:tabular-nums}
.toast{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:8px;font-size:14px;z-index:60;box-shadow:var(--shadow);max-width:90vw}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:35;display:none}
body.nav-open .scrim{display:block}
@media (min-width:901px){body.nav-open .scrim{display:none}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ===== v2: Blöcke als SVG (Tinkercad-Look) ===== */
.bksvg{position:relative;display:inline-block;vertical-align:top;max-width:100%;overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch}
.bksvg svg{display:block;overflow:visible}
.bksvg .bt{fill:#fff;font:500 16px "Helvetica Neue",Helvetica,Arial,sans-serif;dominant-baseline:central}
.bksvg .bn{fill:#575E75;font:500 16px "Helvetica Neue",Helvetica,Arial,sans-serif;dominant-baseline:central}
.bksvg .ba{fill:none;stroke:#fff;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.bksvg .bl{fill:none;stroke:#fff;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.bksvg .blk>.bg{transition:filter .15s,stroke .15s}
.bksvg .blk.run>.bg{stroke:#ffd500;stroke-width:4;filter:drop-shadow(0 0 6px rgba(255,213,0,.95))}
.bksvg .blk.hl>.bg{stroke:var(--ink);stroke-width:3}
.bnum{position:absolute;border:0;background:transparent;color:#575E75;text-align:center;font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;font-weight:500;padding:0;border-radius:20px;outline:none;cursor:text}
.bnum:hover{background:rgba(76,151,255,.08)}
.bnum:focus{box-shadow:0 0 0 2px #4C97FF inset;background:#fff}
.bk-vars{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px;align-items:center;font-size:12px;color:var(--muted)}
.bk-vars .vchip{background:#D65CD6;color:#fff;border:1px solid #BD42BD;border-radius:20px;padding:2px 10px;font:500 12px "Helvetica Neue",Helvetica,Arial,sans-serif}
.blockview{background-color:#f9f9f9;background-image:radial-gradient(#dcdcdc 1px,transparent 1.2px)}
:root[data-theme="dark"] .blockview{background-color:#1f2a2c;background-image:radial-gradient(#34454a 1px,transparent 1.2px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .blockview{background-color:#1f2a2c;background-image:radial-gradient(#34454a 1px,transparent 1.2px)}}
.prog-b.both{display:grid;grid-template-columns:auto 1fr}
.prog-b.both .pv-block{border-right:1px solid var(--line)}
@media (max-width:760px){.prog-b.both{grid-template-columns:1fr}.prog-b.both .pv-block{border-right:0;border-bottom:1px solid var(--line)}}

/* ===== v2: Simulator ===== */
.sim-grid{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:0}
@media (max-width:820px){.sim-grid{grid-template-columns:1fr}}
.sim-left{display:flex;flex-direction:column;gap:10px;padding:12px;border-right:1px solid var(--line);min-width:0;background:var(--surface)}
@media (max-width:820px){.sim-left{border-right:0;border-bottom:1px solid var(--line)}}
.sim-right{display:flex;flex-direction:column;gap:10px;padding:12px;min-width:0}
.board-wrap{background:#f3f3f1;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.board-svg{display:block;width:100%;height:auto}
.board-svg .bpl{fill:#e8f1f5;font:700 8px var(--mono)}
.board-svg .brl{font:700 13px var(--mono);fill:#333}
.board-svg .bpart{font:600 10.5px var(--font);fill:#4a5558}
.board-svg .wire-hi{pointer-events:none}
.board-svg .sensor,.board-svg .btn-part{cursor:pointer}
.board-svg .btn-part .cap{transition:r .08s,fill .08s}
.board-svg .btn-part.pressed .cap{r:8;fill:#0a7570}
.board-svg [data-buzz] .waves path,.board-svg [data-us] .ping path{fill:none;stroke:#8a5cf5;stroke-width:2.2;stroke-linecap:round;opacity:0}
.board-svg [data-buzz].on .waves path{animation:wave .6s infinite}
.board-svg [data-buzz].on .waves path:nth-child(2){animation-delay:.2s}
.board-svg [data-us] .ping path{stroke:#2f7fd8}
.board-svg [data-us].on .ping path{animation:wave 1s infinite}
.board-svg [data-us].on .ping path:nth-child(2){animation-delay:.35s}
@keyframes wave{0%{opacity:0}30%{opacity:1}100%{opacity:0}}
.board-svg .glow{transition:opacity .06s}
.board-svg .horn{transition:transform .35s cubic-bezier(.3,.7,.3,1)}
.simgo{background:#fff;border-color:#2da44e;color:#1c7a36}
.simgo .ico{font-size:12px}
.simgo.stop{background:#2da44e;color:#fff;border-color:#2da44e}
.sp-l{font-size:12px;color:var(--muted);display:flex;gap:4px;align-items:center}
.clock{font:700 12.5px var(--mono);color:var(--muted);margin-right:auto}
.sim-h .ttl{margin-right:12px}
.ed-h{display:flex;gap:8px;align-items:baseline}
.ed-h .ed-mode{font-weight:700;font-size:13px;background:var(--surface-2);border:1px solid var(--line);border-radius:6px;padding:2px 8px}
.ed .blockview{max-height:460px;overflow:auto;padding:12px;border:1px solid var(--line);border-radius:8px}
.ed-code{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--code-bg)}
.ed-code .gutter{margin:0;padding:10px 6px 10px 0;width:44px;text-align:right;font:13.5px/1.6 var(--mono);color:var(--muted);opacity:.8;overflow:hidden;user-select:none;background:var(--surface-2);border-right:1px solid var(--line);flex:none}
.ed-code .gutter span{display:inline-block;width:100%;padding-right:4px;border-radius:0 4px 4px 0}
.ed-code .gutter span.run{background:#ffd500;color:#222;font-weight:700;opacity:1}
.ed-code .gutter span.run::before{content:"▶ ";font-size:9px}
.ed-code textarea{flex:1;min-width:0;border:0;border-radius:0;height:100%!important;min-height:0!important;resize:none!important}
.ed-code .gutter{height:100%}
.sim-edit textarea,.ed-code textarea{width:100%;min-height:240px;resize:vertical;background:var(--code-bg);font:13.5px/1.6 var(--mono);padding:10px 12px;tab-size:2;outline:none;white-space:pre;overflow:auto;color:var(--ink)}
.mon{border:1px solid var(--line);border-radius:8px;overflow:hidden}
.mon-h{display:flex;gap:6px;align-items:center;padding:4px 8px;background:var(--surface-2);border-bottom:1px solid var(--line);font-size:13px;font-weight:700}
.mon-h .spacer{flex:1}
.mon .serial{border-radius:0;height:140px;background:#fff;color:#222}
:root[data-theme="dark"] .mon .serial{background:#0f1719;color:#c9f5e4}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .mon .serial{background:#0f1719;color:#c9f5e4}}
.mon .serial:empty::before{color:#98a5a8}
.plot{display:block;width:100%;height:120px}
input.pulse{outline:3px solid var(--accent);outline-offset:3px}

/* ===== v2: Steckbrett-Aufbau ===== */
.cb svg{width:100%;height:auto;border-radius:10px;border:1px solid var(--line);background:#f3f3f1}
.cb svg .lbl{font:600 11px var(--mono);fill:#555}
.cb svg .lbl.b{fill:#222;font-size:16px}.cb svg .lbl.r{fill:#c62828;font-size:16px}
.cb svg .pl{font:700 9px var(--mono);fill:#e8f1f5}
.cb svg .hole{fill:#6d6d6d;transition:fill .08s}
.cb svg .hole.grp{fill:#3cb043}
.cb svg .hole:hover{fill:#1f8a2e}
.cb svg .hl{fill:rgba(60,176,67,.18);stroke:#3cb043;stroke-width:2;display:none;pointer-events:none}
.cb svg .el{display:none}
.cb svg .el.on,.cb svg .hl.on{display:inline}
.cb svg .leg-l{font:800 12px var(--mono);fill:#333}
.cb svg .glow{opacity:0}
.cb svg .w .wd{stroke-dasharray:none}
.cb svg .w.enter .wd{stroke-dasharray:1;stroke-dashoffset:1;animation:cbdraw .8s ease forwards}
.cb svg .led.enter,.cb svg .res.enter{transform-box:fill-box;transform-origin:center;animation:cbdrop .55s cubic-bezier(.2,.8,.3,1.25)}
@keyframes cbdraw{to{stroke-dashoffset:0}}
@keyframes cbdrop{0%{opacity:0;transform:translateY(-26px) scale(.9)}100%{opacity:1;transform:none}}
.cb svg .flow{fill:none;stroke:#ffd500;stroke-width:3.2;stroke-dasharray:1.5 11;stroke-linecap:round;display:none;pointer-events:none}
.cb svg.blinkA .f1{display:inline;animation:cbflow .9s linear infinite,cbon 2s steps(1) infinite}
.cb svg.blinkB .f2{display:inline;animation:cbflow .9s linear infinite,cboff 2s steps(1) infinite}
.cb svg.blinkA .led1 .glow{animation:cbon 2s steps(1) infinite}.cb svg.blinkA .led1 .lit{animation:cblit 2s steps(1) infinite}
.cb svg.blinkB .led2 .glow{animation:cboff 2s steps(1) infinite}.cb svg.blinkB .led2 .lit{animation:cblit2 2s steps(1) infinite}
.cb svg.blinkA .bl-L{animation:cbL 2s steps(1) infinite}
@keyframes cbflow{to{stroke-dashoffset:-25}}
@keyframes cbon{0%{opacity:1}50%{opacity:0}}
@keyframes cboff{0%{opacity:0}50%{opacity:1}}
@keyframes cblit{0%{opacity:.35}50%{opacity:0}}
@keyframes cblit2{0%{opacity:0}50%{opacity:.35}}
@keyframes cbL{0%{fill:#ffd23f}50%{fill:#6b5a2a}}
.cb svg .tip{pointer-events:none;transition:opacity .1s}
@media (prefers-reduced-motion:reduce){.cb svg .w.enter .wd{stroke-dashoffset:0}}

.multi{display:flex;flex-direction:column;gap:4px}
.quiz{display:flex;flex-direction:column;gap:10px}
.open textarea{width:100%;min-height:130px;padding:10px;border:1px solid var(--line-strong);border-radius:8px;background:var(--surface);font:inherit;resize:vertical}
.open-foot{display:flex;flex-wrap:wrap;gap:6px 12px;justify-content:space-between;align-items:center;margin-top:6px}
.qc{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:13px}
.qc span{border:1px solid var(--line);border-radius:20px;padding:1px 8px;color:var(--muted)}
.qc span.on{border-color:var(--ok);color:var(--ok);font-weight:700}.qc span.on::after{content:" ✓"}
.muster{background:var(--surface-2);border:1px dashed var(--line-strong);border-radius:8px;padding:10px 12px}
.muster ul{margin:6px 0;padding-left:20px}
/* Platine */
.boardgrid{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:760px){.boardgrid{grid-template-columns:1fr}}
.cal-svg{width:100%;height:auto;display:block;max-width:520px;margin:0 auto;touch-action:manipulation}
.cal-svg .bp{cursor:pointer;outline:none}
.cal-svg .bp .hl{fill:none;stroke:none}
.cal-svg .bp:hover .hl,.cal-svg .bp:focus-visible .hl{stroke:#ffffff;stroke-width:5;stroke-dasharray:10 6}
.cal-svg .bp.sel .hl{stroke:#ffd23f;stroke-width:9;stroke-dasharray:none}
.cal-svg .bp.ok .hl{stroke:#4cc27d;stroke-width:9;stroke-dasharray:none}
.cal-svg .bp.bad .hl{stroke:#f07171;stroke-width:9;stroke-dasharray:none}
.cal-svg .lab{font:700 17px Arial,Helvetica,sans-serif;fill:#fff;opacity:.92;pointer-events:none;letter-spacing:.04em}
.nolab .cal-svg .lab{display:none}
.partinfo{background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:8px;min-height:160px}
.partinfo h3{font-size:19px}
.partlist{display:flex;flex-wrap:wrap;gap:6px}
.uses{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.uses .chip{font-size:13.5px;padding:4px 10px}
.spotq{display:flex;flex-direction:column;gap:6px}
.spotq button{display:flex;justify-content:space-between;gap:10px;align-items:center;text-align:left;border:1px solid var(--line-strong);background:var(--surface);border-radius:8px;padding:8px 10px;cursor:pointer;font-size:14.5px}
.spotq button[aria-pressed="true"]{outline:3px solid var(--accent)}
.spotq .ans{font-weight:700;color:var(--accent);white-space:nowrap}
/* Challenge-Seite */
.auftrag{font-size:18px;line-height:1.6}
.tipzone{display:flex;flex-direction:column;gap:10px;align-items:flex-start}
.tipbox{background:var(--warn-soft);border-left:4px solid var(--warn);padding:10px 12px;border-radius:0 8px 8px 0;max-width:100%}
.tipbox h4{font-size:15px;margin-bottom:4px}
.progbox{overflow-x:auto;max-width:100%;border:1px solid var(--line);border-radius:8px;background:var(--code-bg);-webkit-overflow-scrolling:touch}
.prog{max-width:100%;min-width:0}
.runchk{display:flex;gap:12px;align-items:center;font-weight:700;font-size:18px;border:2px solid var(--line-strong);border-radius:10px;padding:12px 14px;cursor:pointer;background:var(--surface-2)}
.runchk input{width:26px;height:26px;accent-color:var(--ok);flex:none}
.runchk.on{border-color:var(--ok);background:var(--ok-soft)}
.status{display:flex;gap:10px;align-items:center;font-weight:700}
.status.done{color:var(--ok)}
details.info{border:1px solid var(--line);border-radius:10px;background:var(--surface-2)}
details.info>summary{cursor:pointer;padding:10px 14px;font-weight:700;font-family:var(--disp);font-size:16px}
details.info>.infobody{padding:0 14px 14px;display:flex;flex-direction:column;gap:10px}
details.info[open]>summary{border-bottom:1px solid var(--line);margin-bottom:10px}
.howlist{display:flex;flex-direction:column;gap:8px}
.steps{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:4px}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;font-size:14px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:4px}
.sumlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.sumlist li{display:flex;gap:10px;align-items:center;flex-wrap:wrap;border:1px solid var(--line);border-radius:8px;padding:6px 10px}
.sumlist li .t{flex:1 1 180px;min-width:0}
.sumlist li .st{font-weight:700;font-size:13.5px}
.sumlist li.done{border-color:var(--ok);background:var(--ok-soft)}
.codeout{width:100%;min-height:70px;font:13px var(--mono);padding:8px;border:1px dashed var(--line-strong);border-radius:8px;background:var(--surface-2);word-break:break-all}
.lic{display:flex;gap:12px;align-items:center;font-size:13px;color:var(--muted)}
.lic a{color:inherit}
.linkcard .ico{width:56px;height:56px;border-radius:10px;display:grid;place-items:center;font-size:26px;flex:none;background:var(--accent-soft)}
.side .nav-item .nav-cp{margin-left:auto}
.nav-chili svg{display:block}
@media (max-width:520px){.savestate{display:none}.logo-chip{padding:2px 5px}.brand-t{max-width:34vw}}
@media (max-width:430px){.brand-t{display:none}}
</style>
</head>

<script>
/* Calliope-Challenges: MakeCode-Blöcke als eigene Grafik (HTML/CSS) und Text-Code mit Hervorhebung.
   Wird von make_calliope.py in die Schülerseite und in die Lösungsseite eingesetzt.
   Kurzschrift im Blocktext:
     (12)            Zahlenfeld
     "Text"          Textfeld
     {rot}           Auswahlfeld
     {g:#.#.#/.....} LED-Bild 5×5, Reihen mit / getrennt, # = an
     [Inhalt|kat]    runder Block (kat: in, var, math, logic, basic, music)
   Blöcke: {s:kat,t}  Befehl · {e:kat,t,b:[]}  Ereignis · {c:kat,t,b:[],x:[[t,[]],…]}  Klammer mit „sonst“-Teilen
           {n:'…'}    Lücke („hier fehlt noch etwas“) */
var CB = (function () {
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function grid(v) {
    var rows = v.split('/'), h = '<span class="ledg" role="img" aria-label="LED-Bild">';
    rows.forEach(function (r) { for (var i = 0; i < 5; i++) h += '<i' + (r[i] === '#' ? ' class="on"' : '') + '></i>'; });
    return h + '</span>';
  }
  function inl(s) {
    var o = '', i = 0;
    while (i < s.length) {
      var ch = s[i], j, close = { '(': ')', '"': '"', '{': '}', '[': ']' }[ch];
      if (close && s.indexOf(close, i + 1) < 0) { o += esc(s.slice(i)); break; }
      if (ch === '(') { j = s.indexOf(')', i); o += '<span class="num">' + esc(s.slice(i + 1, j)) + '</span>'; i = j + 1; }
      else if (ch === '"') { j = s.indexOf('"', i + 1); o += '<span class="txt">' + esc(s.slice(i + 1, j)) + '</span>'; i = j + 1; }
      else if (ch === '{') { j = s.indexOf('}', i); var v = s.slice(i + 1, j); o += v.indexOf('g:') === 0 ? grid(v.slice(2)) : '<span class="dd">' + esc(v) + '</span>'; i = j + 1; }
      else if (ch === '[') {
        var d = 0; for (j = i; j < s.length; j++) { if (s[j] === '[') d++; else if (s[j] === ']') { d--; if (!d) break; } }
        var inner = s.slice(i + 1, j), k = inner.lastIndexOf('|');
        o += '<span class="rep k-' + inner.slice(k + 1) + '">' + inl(inner.slice(0, k)) + '</span>'; i = j + 1;
      } else { j = i; while (j < s.length && '("{['.indexOf(s[j]) < 0) j++; o += esc(s.slice(i, j)); i = j; }
    }
    return o;
  }
  function blk(b) {
    if (b.n) return '<div class="bk-gap">' + esc(b.n) + '</div>';
    if (b.s) return '<div class="bk notch k-' + b.s + '">' + inl(b.t) + '</div>';
    var cat = b.e || b.c, h = '<div class="bk-c k-' + cat + (b.e ? ' hat' : '') + '"><div class="bk-head">' + inl(b.t) + '</div><div class="bk-body">' + (b.b || []).map(blk).join('') + '</div>';
    (b.x || []).forEach(function (x) { h += '<div class="bk-mid">' + inl(x[0]) + '</div><div class="bk-body">' + x[1].map(blk).join('') + '</div>'; });
    return h + '<div class="bk-foot"></div></div>';
  }
  function blocks(list) { return '<div class="blockview"><div class="bk-stacks">' + list.map(function (b) { return '<div class="bk-stack">' + blk(b) + '</div>'; }).join('') + '</div></div>'; }
  function hl(l) {
    var re = /(\/\/.*$)|("[^"]*"|`[^`]*`)|\b(let|if|else|function|for|while|true|false)\b|\b(0x[0-9a-fA-F]+|\d+)\b/g, o = '', k = 0, m;
    while ((m = re.exec(l))) { o += esc(l.slice(k, m.index)); o += '<span class="tk-' + (m[1] ? 'com' : m[2] ? 'str' : m[3] ? 'kw' : 'nm') + '">' + esc(m[0]) + '</span>'; k = re.lastIndex; }
    return o + esc(l.slice(k));
  }
  function code(src) { return '<pre class="codeview">' + src.split('\n').map(function (l) { return '<span class="ln">' + (hl(l) || ' ') + '</span>'; }).join('') + '</pre>'; }
  /* Programm in beiden Darstellungen; sichtbar je nach body[data-mode] */
  function prog(p) {
    return '<div class="prog"><div class="m-block progbox">' + blocks(p.blocks) + '</div><div class="m-code progbox">' + code(p.js) + '</div></div>';
  }
  /* Ein einzelner Block als Text-Chip (für Reihenfolge- und Markier-Aufgaben) */
  function chip(cat, t) { return '<span class="bk mini k-' + cat + '">' + inl(t) + '</span>'; }
  return { esc: esc, inl: inl, blocks: blocks, code: code, prog: prog, chip: chip };
})();

<script>
(function(){

const KEY='calliope-challenges-v1';

function el(t,a,...k){const e=document.createElement(t);if(a)for(const n in a){const v=a[n];if(v==null||v===false)continue;if(n==='class')e.className=v;else if(n==='html')e.innerHTML=v;else if(n.startsWith('on'))e.addEventListener(n.slice(2),v);else e.setAttribute(n,v===true?'':v);}k.flat().forEach(c=>{if(c==null||c===false)return;e.append(c.nodeType?c:document.createTextNode(c));});return e;}

/* ---------- Schwierigkeit und Skill-Level ---------- */
const CHILI=[null,{k:'mild',t:'MILD',c:'#3aa935',d:'#23801f'},{k:'spicy',t:'SPICY',c:'#f5a300',d:'#c77f00'},{k:'hot',t:'HOT',c:'#f0501e',d:'#c23a10'},{k:'extra',t:'EXTRA',c:'#d5121e',d:'#9e0a14'}];

function chiliSvg(level,on,h){const L=CHILI[level],c=on?L.c:'#cfcfcf',d=on?L.d:'#adadad',g=on?'#3c9a2c':'#a5a5a5',w=h*64/54;
  return `<svg class="chili" viewBox="0 0 64 54" width="${w.toFixed(1)}" height="${h}" role="img" aria-label="${L.t}${on?'':' (nicht)'}"><path d="M26 22c-6-8 1-12-1-19c7 5 10 10 8 16c3-4 3-7 2-11c6 6 7 12 3 17z" fill="${c}" opacity=".85"/><path d="M43 17c9 0 15 8 13 18c-3 12-19 18-35 17c-7 0-12-2-17-6c10 0 18-3 23-8c6-5 8-10 9-15c1-4 4-6 7-6z" fill="${c}" stroke="${d}" stroke-width="1.6" stroke-linejoin="round"/><path d="M41 20c2-3 6-4 9-2c-2 1-2 3-1 5c-3-1-6-1-8-3z" fill="${g}"/><path d="M47 18c1-5 4-9 9-10" fill="none" stroke="${g}" stroke-width="3" stroke-linecap="round"/><path d="M49 24c2 4 1 9-3 13" fill="none" stroke="#fff" stroke-opacity=".45" stroke-width="2" stroke-linecap="round"/>${h>=30?`<text x="38" y="39" transform="rotate(-38 38 39)" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-weight="800" font-size="8" fill="#fff">${L.t}</text>`:''}</svg>`;}
function chiliRow(level,h){return [1,2,3,4].map(l=>chiliSvg(l,l===level,h)).join('');}
function levelBadge(lv,small){return `<span class="lvl-badge${small?' sm':''}" style="--lc:${lv.c}">${lv.t}</span>`;}

/* ---------- Bauteile der Platine ---------- */
const PARTS={
  matrix:{n:'LED-Matrix',d:'25 kleine LEDs in 5 Reihen und 5 Spalten. Sie zeigt Text, Zahlen und Bilder. Gleichzeitig misst sie die <b>Lichtstärke</b>, also wie hell es ist (0 bis 255).',u:[1,3,4,5,7,8,9,10,11]},
  rgb:{n:'RGB-LED',d:'Eine LED unter der LED-Matrix. Sie mischt <b>Rot</b>, <b>Grün</b> und <b>Blau</b> und kann so in vielen Farben leuchten.',u:[2,3,6,7,8]},

  cpu:{n:'Prozessor',d:'Das „Gehirn“ des Calliope: Er führt dein Programm aus. In ihm steckt auch ein <b>Temperatursensor</b>.',u:[5,8]},

  bat:{n:'Batterieanschluss',d:'Hier steckst du das Batteriepack an. Achtung: Schließe nie gleichzeitig das Batteriepack und USB oder eine Powerbank an!',u:[]},
  grove:{n:'Anschlüsse A0 und A1',d:'Stecker für zusätzliche Sensoren und Aktoren, zum Beispiel einen Bewegungsmelder.',u:[]},
  pins:{n:'Pins 0, 1, 2, 3, − und +',d:'Sechs goldene Anschlüsse am Rand. Die Pins 0 bis 3 kannst du als <b>Touch-Sensoren</b> nutzen oder Bauteile anschließen. − und + liefern Strom für Bauteile.',u:[]}

/* Eigene Zeichnung des Calliope mini (keine Vorlage übernommen) */
function boardSvg(){
  const C=[500,480],R=380,ang=[0,60,120,180,240,300],pl=['3','2','1','0','−','+'];

  const g=(id,inner,hl)=>`<g class="bp" data-p="${id}" tabindex="0" role="button" aria-label="${PARTS[id].n}">${inner}${hl}</g>`;

  s+=`<g fill="none" stroke="#2c5674" stroke-width="3" opacity=".7"><path d="M300 360 L360 300 L440 300"/><path d="M700 360 L640 300 L560 300"/><path d="M430 610 L470 650 L520 650"/><path d="M230 560 L300 620"/></g></g>`;
  /* Pins */
  s+=g('pins',P.map((p,i)=>`<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="50" fill="#e4dc6a"/><circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="22" fill="#f4f3ec"/>`).join('')+P.map((p,i)=>{const x=p[0]+(C[0]-p[0])*.21,y=p[1]+(C[1]-p[1])*.21+11;return `<text x="${x.toFixed(1)}" y="${y.toFixed(1)}" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-weight="700" font-size="34" fill="#fff" pointer-events="none">${pl[i]}</text>`;}).join(''),
    P.map(p=>`<circle class="hl" cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="60"/>`).join(''));
  /* Kopfleiste (Deko) */
  
  s+=g('usb',`<rect x="465" y="198" width="70" height="56" rx="3" fill="${grey}"/><text class="lab" x="500" y="282" text-anchor="middle">USB</text>`,`<rect class="hl" x="453" y="186" width="94" height="80" rx="10"/>`);
  s+=g('reset',`<ellipse cx="588" cy="226" rx="14" ry="18" fill="#eceee9"/><text class="lab" x="590" y="268" text-anchor="middle">RESET</text>`,`<circle class="hl" cx="588" cy="226" r="32"/>`);
  s+=g('mic',`<rect x="372" y="214" width="46" height="42" rx="3" fill="${k}"/><text class="lab" x="395" y="282" text-anchor="middle">MIKROFON</text>`,`<rect class="hl" x="360" y="202" width="70" height="66" rx="10"/>`);
  const grove=(x,rot,l,lx)=>`<g transform="translate(${x} 300) rotate(${rot})"><rect x="-52" y="-19" width="104" height="38" rx="3" fill="${grey}"/>${[-27,-9,9,27].map(d=>`<circle cx="${d}" cy="0" r="4.5" fill="#33393c"/>`).join('')}<rect class="hl" x="-64" y="-31" width="128" height="62" rx="10"/></g><text class="lab" x="${lx}" y="356" text-anchor="middle">${l}</text>`;
  s+=g('grove',grove(318,60,'A0',372)+grove(682,-60,'A1',628),'');
  s+=g('a',`<g transform="translate(262 470) rotate(45)"><rect x="-27" y="-27" width="54" height="54" rx="4" fill="#d9dbd6"/></g><circle cx="262" cy="470" r="17" fill="#45c0de"/><text x="262" y="414" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-weight="700" font-size="32" fill="#fff" pointer-events="none">A</text>`,`<circle class="hl" cx="262" cy="466" r="54"/>`);
  s+=g('b',`<g transform="translate(738 470) rotate(45)"><rect x="-27" y="-27" width="54" height="54" rx="4" fill="#d9dbd6"/></g><circle cx="738" cy="470" r="17" fill="#ef4a5e"/><text x="738" y="414" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-weight="700" font-size="32" fill="#fff" pointer-events="none">B</text>`,`<circle class="hl" cx="738" cy="466" r="54"/>`);
  s+=g('acc',`<rect x="318" y="504" width="50" height="30" rx="3" fill="${k}"/><text class="lab" x="300" y="564" text-anchor="middle">LAGESENSOR</text>`,`<rect class="hl" x="306" y="492" width="74" height="54" rx="10"/>`);

const HOWTO=[
 {id:'anschliessen',t:'Calliope anschließen',h:`<ol class="steps"><li>Stecke das Kabel des <b>Batteriepacks</b> in den grauen Batterieanschluss des Calliope.</li><li>Schalte das Batteriepack am Schalter ein. Der Calliope startet dann das Programm, das zuletzt übertragen wurde.</li></ol><div class="note warn">Willst du den Calliope mit einem Computer oder einer Powerbank verbinden, darf das Batteriepack auf keinen Fall gleichzeitig angeschlossen sein!</div>`},
 {id:'makecode',t:'MakeCode öffnen',h:`<ol class="steps"><li>Öffne die App <b>„Calliope mini“</b> auf dem iPad. Erlaube die Bluetooth-Verbindung mit „OK“.</li><li>Tippe unten auf <b>„Editoren und Programme“</b> und dann auf <b>„MakeCode“</b>.</li><li>Tippe auf <b>„Neues Projekt“</b>, gib einen Namen ein und tippe auf „Erstellen“.</li></ol><p>Links siehst du die <b>Simulation</b>: Sie zeigt, was dein Programm macht. In der Mitte stehen die <b>Befehle</b>, sortiert nach Bereichen wie Grundlagen, Eingabe, Musik, Logik, Schleifen, Variablen und Mathematik. Ziehe Befehle nach rechts in deinen <b>Code</b> und stecke sie zusammen.</p><p class="hint">Am Computer geht es auch im Browser: <a href="https://makecode.calliope.cc/" target="_blank" rel="noopener">makecode.calliope.cc</a> (öffnet in neuem Tab).</p>`},
 {id:'uebertragen',t:'Code übertragen',h:`<ol class="steps"><li>Schalte den Calliope ein.</li><li>Drücke <b>A + B + Reset</b> gleichzeitig und halte sie etwa 3 Sekunden.</li><li>Lass <b>nur Reset</b> los, A und B hältst du weiter gedrückt.</li><li>Warte, bis auf der LED-Matrix das <b>Bluetooth-Symbol</b> erscheint.</li><li>Lass A und B los. Jetzt leuchtet ein <b>Muster</b>.</li><li>Tippe in MakeCode oben rechts auf das rote Verbinden-Symbol und trage das Muster vom Calliope ein.</li><li>Tippe unten links auf <b>„Herunterladen“</b> und im Fenster noch einmal auf „Herunterladen“. Warte, bis 100 % erreicht sind.</li></ol><p>Änderst du dein Programm, überträgst du es einfach noch einmal.</p><div class="note">Startet die Bluetooth-Verbindung nicht und erscheint kein Muster, hilft deine Lehrkraft: Sie spielt einmal eine Startdatei per USB vom Computer auf.</div>`},
 {id:'matrix',t:'LED-Matrix',h:`<p>Die <b>LED-Matrix</b> besteht aus 25 LEDs in 5 Reihen und 5 Spalten. Mit diesen Befehlen aus <b>Grundlagen</b> zeigst du etwas an:</p>##zeige Text "Hallo"|zeige Zahl (42)|zeige Symbol {g:...../.#.#./...../#...#/.###.}|zeige LEDs {g:.#.#./#####/#####/.###./..#..}##<p><b>zeige Symbol</b> hat fertige Bilder (Pfeil nach unten antippen). Mit <b>zeige LEDs</b> malst du ein eigenes Bild. <b>Bildschirminhalt löschen</b> schaltet alle LEDs aus.</p>`},
 {id:'rgb',t:'RGB-LED',h:`<p>Die <b>RGB-LED</b> sitzt unter der LED-Matrix. Sie mischt ihre Farbe aus Rot, Grün und Blau. Die Befehle findest du in <b>Grundlagen</b>:</p>##setze RGB-LED-Farbe auf {rot}|eingebaute RGB-LED ausschalten##<p>Tippe auf die Farbe, um eine andere zu wählen.</p>`},
 {id:'pause',t:'Warten mit „pausiere“',h:`<p><b>pausiere (ms)</b> wartet, bevor der nächste Befehl kommt. Die Zeit steht in <b>Millisekunden</b>: <b>1000 ms = 1 Sekunde</b>, 5000 ms = 5 Sekunden.</p>##pausiere (ms) (1000)##`},
 {id:'musik',t:'Töne',h:`<p>Der <b>Lautsprecher</b> spielt Töne. Im Bereich <b>Musik</b> findest du:</p>##!music:spiele Note {Mittleres C} für {1} Schlag##<p>Die <b>Note</b> bestimmt, wie hoch der Ton ist. Die <b>Schläge</b> bestimmen, wie lange er dauert.</p>`},
 {id:'sensoren',t:'Sensoren',h:`<p>Der Calliope hat mehrere <b>Sensoren</b>. Ihre Messwerte sind runde Blöcke im Bereich <b>Eingabe</b>. Du setzt sie zum Beispiel in „zeige Zahl“ ein:</p>##zeige Zahl [Lichtstärke|in]|zeige Zahl [Lautstärke|in]|zeige Zahl [Temperatur °C|in]##<ul><li><b>Lichtstärke</b>: misst die LED-Matrix (0 = dunkel bis 255 = hell).</li><li><b>Lautstärke</b>: misst das Mikrofon (0 bis 255).</li><li><b>Temperatur</b>: misst ein Sensor im Prozessor, in °C.</li><li>Der <b>Lagesensor</b> erkennt Bewegung: <b>wenn geschüttelt</b>.</li></ul><p>Tipp: Setze den Befehl in „dauerhaft“. Dann siehst du, welche Werte bei dir vorkommen.</p>`},
 {id:'bedingung',t:'Bedingte Anweisung und Verzweigung',h:`<p>Mit <b>wenn … dann</b> (Bereich <b>Logik</b>) führt der Calliope Befehle nur aus, wenn eine <b>Bedingung</b> erfüllt ist. Mit dem <b>+</b> bekommst du <b>ansonsten</b> und <b>sonst wenn</b>.</p>@@cond@@<p>Als Bedingung kannst du Zahlen <b>vergleichen</b>: <b>&gt;</b> größer als, <b>&lt;</b> kleiner als, <b>=</b> gleich. Die Verzweigung wird nur geprüft, wenn das Programm gerade an dieser Stelle ist. Blöcke wie <b>wenn Knopf A geklickt</b> oder <b>wenn geschüttelt</b> reagieren dagegen sofort, egal wo das Programm gerade ist.</p>`},
 {id:'schleife',t:'Schleifen',h:`<p>Eine <b>Schleife</b> wiederholt Befehle. <b>dauerhaft</b> wiederholt immer weiter. <b>wiederhole … mal</b> (Bereich <b>Schleifen</b>) wiederholt genau so oft, wie du einstellst, dann geht es darunter weiter.</p>@@loop@@`},
 {id:'variablen',t:'Variablen',h:`<p>Eine <b>Variable</b> speichert eine Zahl unter einem Namen. Erstelle sie im Bereich <b>Variablen</b> mit „Erstelle eine Variable“.</p>##!var:setze {zähler} auf (0)|!var:ändere {zähler} um (1)##<p>Eine <b>Sensor-Variable</b> speichert einen Messwert, damit du ihn mehrmals nutzen kannst. Eine <b>Zähler-Variable</b> zählt etwas, zum Beispiel wie oft eine Taste gedrückt wurde.</p>`},
 {id:'zufall',t:'Zufallszahlen',h:`<p>Im Bereich <b>Mathematik</b> liefert <b>wähle eine zufällige Zahl von … bis …</b> bei jedem Aufruf eine neue <b>Zufallszahl</b>.</p>##zeige Zahl [wähle eine zufällige Zahl von (1) bis (10)|math]##`},
 {id:'touch',t:'Touch-Pins',h:`<p>Am Rand hat der Calliope sechs goldene <b>Pins</b>. Die Pins 0 bis 3 sind <b>Touch-Sensoren</b>: Berührst du den Pin − und gleichzeitig einen Touch-Pin, merkt das der Calliope. Die Befehle findest du unter „Fortgeschritten“ → „Pins“.</p>`}

const CHN={};CH.forEach(c=>CHN[c.n]=c);
const pad=n=>String(n).padStart(2,'0');
const cpOf=n=>LEVELS.find(l=>l.cp===n);

/* ---------- Zustand ---------- */
let S;try{S=JSON.parse(localStorage.getItem(KEY)||'null');}catch(e){S=null;}
if(!S||typeof S!=='object')S={};
S.pg=S.pg||'start';S.a=S.a||{};S.ok=S.ok||{};S.run=S.run||{};S.tip=S.tip||{};S.muster=S.muster||{};S.name=S.name||'';S.kl=S.kl||'';S.mode=S.mode==='code'?'code':'block';
let saveT=0;
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));const s=$('#saveState');if(s){const d=new Date();s.innerHTML='Gespeichert <b>✓</b> '+pad(d.getHours())+':'+pad(d.getMinutes());}}catch(e){}}

const TASK_IDS=Object.keys(T);
const label={};
function isDone(id){const t=T[id];if(t.type==='open')return (S.a[id]||'').trim().length>=t.min;return !!S.ok[id];}
function chDone(n){return !!S.run[n]&&CHN[n].tasks.every(isDone);}
function chPart(n){const c=CHN[n];return ((S.run[n]?1:0)+c.tasks.filter(isDone).length)/(1+c.tasks.length);}
function level(){let lv=-1;LEVELS.forEach((l,i)=>{if(chDone(l.cp))lv=Math.max(lv,i);});return lv;}

/* ---------- Rückmeldung ---------- */
function showFb(fb,cls,head,body,list){fb.hidden=false;fb.className='wfb '+cls;const kids=[el('p',{class:'lvl'},head)];if(body)kids.push(el('p',{},body));if(list&&list.length)kids.push(el('ul',{},...list.map(x=>el('li',{},x))));fb.replaceChildren(...kids);}
function report(id,ok,art,fb){S.ok[id]=S.ok[id]||ok;save();refresh();if(window.LP)LP.result(id,ok,label[id],art,fb);}
function mkCheck(id,art,fn){const fb=el('div',{class:'wfb',hidden:true,'aria-live':'polite'});const b=el('button',{class:'btn primary',type:'button'},'Prüfen');b.onclick=()=>fn(fb);art.append(el('div',{class:'row'},b),fb);return fb;}
const chipHtml=it=>Array.isArray(it)?CB.chip(it[0],it[1]):esc(it);

/* ---------- Aufgabenformate ---------- */
function wSeg(id,t,w,art){
  const v=S.a[id]=Array.isArray(S.a[id])&&S.a[id].length===t.items.length?S.a[id]:t.items.map(()=>-1);
  const rows=t.items.map((it,i)=>{const r=el('div',{class:'segrow'});const seg=el('div',{class:'seg',role:'group','aria-label':it[0]});
    t.cats.forEach((c,ci)=>{const b=el('button',{type:'button','aria-pressed':String(v[i]===ci)},c);b.onclick=()=>{v[i]=ci;$$('button',seg).forEach((x,xi)=>x.setAttribute('aria-pressed',String(xi===ci)));r.classList.remove('s-ok','s-bad');save();};seg.append(b);});
    r.append(el('span',{},it[0]),seg);return r;});
  w.className='w seglist';w.append(...rows);
  mkCheck(id,art,fb=>{if(v.some(x=>x<0)){showFb(fb,'mid','Noch nicht fertig','Ordne zuerst alle Zeilen zu.');return;}
    let ok=0;t.items.forEach((it,i)=>{const g=v[i]===it[1];rows[i].classList.toggle('s-ok',g);rows[i].classList.toggle('s-bad',!g);if(g)ok++;});
    const all=ok===t.items.length;
    if(all)showFb(fb,'ok','Alles richtig!',ok+' von '+t.items.length+' richtig.');else showFb(fb,ok>=t.items.length*.6?'mid':'err',ok+' von '+t.items.length+' richtig','Die rot markierten Zeilen stimmen noch nicht. Lies die Information noch einmal.');
    report(id,all,art,fb);});
}
function wSort(id,t,w,art){
  const v=S.a[id]=Array.isArray(S.a[id])&&S.a[id].length===t.items.length?S.a[id]:t.items.map(()=>-1);
  let armed=-1;
  const pool=el('div',{class:'cards'});
  const C=t.items.map((it,i)=>{const b=el('button',{type:'button',class:'sc','aria-pressed':'false'},it[0]);b.onclick=()=>{armed=armed===i?-1:i;draw();};return b;});
  const boxes=t.cats.map(()=>el('div',{class:'cards'}));
  const cols=t.cats.map((c,ci)=>{const d=el('button',{type:'button',class:'sdrop'},c);d.onclick=()=>{if(armed<0)return;const i=armed;v[i]=ci;armed=-1;C.forEach(n=>n.classList.remove('s-ok','s-bad'));save();draw();C[i].focus();};
    return el('div',{class:'scol'},d,boxes[ci]);});
  const poolBox=el('div',{class:'pool'},el('h4',{},'Karten: zuerst antippen, dann die Spalte'),pool);
  function draw(){C.forEach((b,i)=>{b.setAttribute('aria-pressed',String(i===armed));b.setAttribute('aria-label',t.items[i][0]+(v[i]>=0?' (liegt bei '+t.cats[v[i]]+')':' (noch nicht zugeordnet)'));(v[i]>=0?boxes[v[i]]:pool).append(b);});
    w.classList.toggle('armed',armed>=0);poolBox.hidden=v.every(x=>x>=0);}
  w.className='w sortw';w.append(poolBox,el('div',{class:'cols'},...cols));draw();
  mkCheck(id,art,fb=>{if(v.some(x=>x<0)){showFb(fb,'mid','Noch nicht fertig','Lege zuerst alle Karten in eine Spalte.');return;}
    let ok=0;t.items.forEach((it,i)=>{const g=v[i]===it[1];C[i].classList.toggle('s-ok',g);C[i].classList.toggle('s-bad',!g);if(g)ok++;});
    const all=ok===t.items.length;
    if(all)showFb(fb,'ok','Alles richtig!',ok+' von '+t.items.length+' Karten liegen richtig.');else showFb(fb,ok>=t.items.length*.6?'mid':'err',ok+' von '+t.items.length+' richtig','Die rot markierten Karten liegen noch falsch. Tippe sie an und dann die richtige Spalte. Lies die Information noch einmal.');
    report(id,all,art,fb);});
}

const CP='€‚ƒ„…†‡ˆ‰Š‹ŒŽ‘’“”•–—˜™š›œžŸ';
function clean(t){return String(t||'').replace(/→/g,'->').replace(/★/g,'*').replace(/−/g,'-').replace(/[\u{1F300}-\u{1FAFF}☀-➿️‍]/gu,'').split('').filter(ch=>{const c=ch.charCodeAt(0);return c===10||(c>=32&&c<=126)||(c>=160&&c<=255)||CP.indexOf(ch)>=0;}).join('');}
const hex=c=>[1,3,5].map(i=>parseInt(c.slice(i,i+2),16));
$('#pdfBtn').onclick=()=>{const note=$('#pdfNote');note.hidden=false;
  if(!(window.jspdf&&window.jspdf.jsPDF)){note.textContent='Das PDF-Werkzeug konnte nicht geladen werden.';return;}
  const d=new window.jspdf.jsPDF({unit:'mm',format:'a4'}),M=16,W=210-2*M;let y=20;

  y+=12;
  const nd=CH.filter(c=>chDone(c.n)).length;txt('Geschafft: '+nd+' von '+CH.length+' Challenges',{b:1,size:12,lh:6});y+=2;
  CH.forEach(c=>{need(13);const L=CHILI[c.lv],cc=hex(L.c),done=chDone(c.n),cp=cpOf(c.n);
    d.setFillColor(cc[0],cc[1],cc[2]);d.roundedRect(M,y-3.8,15,5.2,1,1,'F');d.setTextColor(255,255,255);d.setFont('helvetica','bold');d.setFontSize(7.5);d.text(L.t,M+7.5,y,{align:'center'});

    d.setTextColor(sc[0],sc[1],sc[2]);d.text(clean(st),210-M,y,{align:'right'});y+=4.6;
    const q=c.tasks.filter(isDone).length;const det=[(S.run[c.n]?'läuft auf dem Calliope':'noch nicht getestet'),'Fragen: '+q+' von '+c.tasks.length+' gelöst'];if((S.tip[c.n]|0)>=2)det.push('mit Teillösung');else if((S.tip[c.n]|0)===1)det.push('mit Tipp');if(cp)det.push('* Checkpoint '+cp.t);
