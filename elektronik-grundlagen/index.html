<style>
:root{--bg:#eef3f8;--card:#ffffff;--ink:#14212e;--muted:#56657a;--line:#cfd9e4;--accent:#0b5aa2;--accent-ink:#ffffff;--bad:#b3261e;--f:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#0f1720;--card:#17222e;--ink:#e6edf5;--muted:#9fb0c3;--line:#2b3a4b;--accent:#5aa3e6;--accent-ink:#0f1720;--bad:#ff8a80;color-scheme:dark}}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.5 var(--f);display:grid;place-items:center;padding:24px max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px))}
main{width:100%;max-width:440px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:28px 24px;display:flex;flex-direction:column;gap:14px}
.lock{width:44px;height:44px;border-radius:50%;background:var(--accent);display:grid;place-items:center}
.lock svg{width:22px;height:22px;stroke:var(--accent-ink);fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
h1{font-size:1.45rem;line-height:1.2;margin:0;text-wrap:balance}
p{margin:0;color:var(--muted)}
label{font-weight:700;font-size:.95rem}
input[type=password],input[type=text]{width:100%;font:inherit;padding:11px 12px;border:1.5px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
input:focus-visible,button:focus-visible,a:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.row{display:flex;align-items:center;gap:8px;font-size:.95rem;color:var(--muted)}
button,.btn{font:700 1rem var(--f);padding:11px 16px;border-radius:8px;border:0;background:var(--accent);color:var(--accent-ink);cursor:pointer;text-align:center;text-decoration:none}
button[disabled]{opacity:.6;cursor:wait}
.btn.ghost{background:transparent;color:var(--accent);border:1.5px solid var(--accent)}
.msg{min-height:1.4em;font-size:.95rem}
.msg.bad{color:var(--bad)}
.out{display:flex;flex-direction:column;gap:10px}
footer{font-size:.8rem;color:var(--muted)}
</style>

  <h1>Elektronik-Grundlagen (Fortbildung)</h1>
  <p>Diese Fortbildungsfassung enthält alle Lösungen und ist nur für Lehrkräfte gedacht. Bitte gib das Passwort für Lehrkräfte ein.</p>

    <div style="display:flex;flex-direction:column;gap:8px">
      <label for="pw">Passwort</label>
      <input id="pw" type="password" autocomplete="current-password" required>
      <div class="row"><input id="show" type="checkbox"><label for="show" style="font-weight:400">Passwort anzeigen</label></div>
      <div class="row"><input id="keep" type="checkbox"><label for="keep" style="font-weight:400">Auf diesem Gerät merken</label></div>
      <button id="go" type="submit">Öffnen</button>
    </div>
  </form>

<script>
(function(){
  var KIND='html', FILE='', KEY='lp-lehrkraefte-pw';
  var P=JSON.parse(document.getElementById('payload').textContent);
  var $=function(id){return document.getElementById(id);};
  function b64(s){var b=atob(s),u=new Uint8Array(b.length);for(var i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u;}
  async function decrypt(pw){
    var base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
    var key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(P.salt),iterations:P.iter,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
    return new Uint8Array(await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(P.iv)},key,b64(P.ct)));
  }
  function show(bytes){
    if(KIND==='html'){var html=new TextDecoder().decode(bytes);document.open();document.write(html);document.close();return;}
    var url=URL.createObjectURL(new Blob([bytes],{type:'application/pdf'}));
    var out=$('out');out.hidden=false;$('f').hidden=true;$('msg').textContent='Entsperrt.';
    var a=document.createElement('a');a.className='btn';a.href=url;a.target='_blank';a.rel='noopener';a.textContent='PDF öffnen';
    var d=document.createElement('a');d.className='btn ghost';d.href=url;d.download=FILE;d.textContent='PDF herunterladen';
    out.append(a,d);
  }
  async function tryOpen(pw,silent){
    if(!window.crypto||!crypto.subtle){$('msg').textContent='Dieser Browser kann die Seite nicht entsperren. Bitte einen aktuellen Browser verwenden.';$('msg').className='msg bad';return;}
    $('go').disabled=true;if(!silent){$('msg').className='msg';$('msg').textContent='Wird entsperrt …';}
    try{
      var bytes=await decrypt(pw);
      if($('keep').checked){try{localStorage.setItem(KEY,pw);}catch(e){}}
      show(bytes);
    }catch(e){
      try{if(silent)localStorage.removeItem(KEY);}catch(x){}
      $('msg').className='msg bad';$('msg').textContent=silent?'':'Das Passwort stimmt nicht. Achte auf Groß- und Kleinschreibung und die Bindestriche.';
    }finally{var g=$('go');if(g)g.disabled=false;}
  }
  $('show').addEventListener('change',function(){$('pw').type=this.checked?'text':'password';});
  $('f').addEventListener('submit',function(e){e.preventDefault();tryOpen($('pw').value.trim().normalize('NFC'),false);});
  var saved=null;try{saved=localStorage.getItem(KEY);}catch(e){}
  if(saved){$('keep').checked=true;tryOpen(saved,true);}
})();
</script>
